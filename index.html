<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23395d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cátedra">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Cátedra</title>
<style>
:root{
  --bg:#f4f2ee; --bg2:#ebe8e2; --panel:#ffffff; --panel2:#faf9f7; --line:#e2ded6; --line2:#d3cec4;
  --ink:#1c1f26; --ink2:#4a4f5a; --ink3:#7b808a; --accent:#23395d; --accent2:#3b5a8c; --accentbg:#e8edf5;
  --ok:#2f7a4f; --okbg:#e5f2ea; --warn:#9a6a12; --warnbg:#fbf1dc; --bad:#a2372b; --badbg:#f8e6e3; --mute:#6b7079; --mutebg:#eeede9;
  --paper:#ffffff; --paperink:#1b1b1b; --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 28px rgba(20,24,33,.08);
  --tjsc:#1f6f5c; --trf5:#8a3b2e; --tjrs:#2f4f8f;
  --r:12px; --r2:8px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --doc:Cambria,"Cambria Math",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15171c; --bg2:#1b1e24; --panel:#1f2229; --panel2:#23262e; --line:#2f333c; --line2:#3a3f49;
  --ink:#e9eaee; --ink2:#b7bbc4; --ink3:#8a8f99; --accent:#9fb7e0; --accent2:#b9cbea; --accentbg:#26314a;
  --ok:#7cc79a; --okbg:#1f3328; --warn:#e2b45c; --warnbg:#3a2f18; --bad:#ec8b7e; --badbg:#3d2320; --mute:#a3a7b0; --mutebg:#2a2d34;
  --paper:#fbfaf7; --paperink:#1b1b1b; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --tjsc:#5fb39b; --trf5:#d98a79; --tjrs:#8fa9e0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:268px 1fr;height:100vh;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font:600 17px/1 var(--doc)}
:root[data-theme="dark"] .brand .mark{color:#15171c}
.brand b{font:600 18px/1.1 var(--doc);letter-spacing:.2px}
.brand small{display:block;color:var(--ink3);font-size:11.5px;margin-top:2px}
.nav{padding:4px 10px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--accentbg);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.side-h{padding:14px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center}
.side-h span{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none}
#discList{overflow:auto;flex:1;padding:0 10px 14px;min-height:0}
.disc-btn{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink2)}
.disc-btn:hover{background:var(--panel2);color:var(--ink)}
.disc-btn.on{background:var(--accentbg);color:var(--accent)}
.disc-btn .nm{font-size:13px;line-height:1.25}
.disc-btn .ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.disc-btn .bar{grid-column:1/-1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.disc-btn .bar i{display:block;height:100%;background:var(--lens,var(--accent));border-radius:3px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px)}
#menuBtn{display:none}
.lens{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.lens button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.lens button i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.lens button.on{background:var(--c);color:#fff}
:root[data-theme="dark"] .lens button.on{color:#15171c}
.search{flex:1;max-width:520px;position:relative;margin-left:auto}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px 8px 34px;outline:none}
.search input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accentbg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--ui);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel2)}
#view{flex:1;overflow:auto;min-height:0}
.wrap{max-width:1180px;margin:0 auto;padding:26px 28px 80px}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:550;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#15171c}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--panel2);color:var(--ink)}
.badge{display:inline-flex;align-items:center;min-width:20px;height:20px;padding:0 7px;border-radius:10px;background:var(--mutebg);color:var(--mute);font-size:11.5px;font-weight:650;justify-content:center;font-variant-numeric:tabular-nums}
.badge.acc{background:var(--accent);color:#fff}
:root[data-theme="dark"] .badge.acc{color:#15171c}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--mutebg);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.warn{background:var(--warnbg);color:var(--warn)} .chip.bad{background:var(--badbg);color:var(--bad)} .chip.acc{background:var(--accentbg);color:var(--accent)}
.chip.ed{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.chip button{border:0;background:none;padding:0;margin-left:2px;cursor:pointer;color:inherit;opacity:.7;font-size:14px;line-height:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h1.pg{font:600 26px/1.2 var(--doc);margin:0 0 4px;letter-spacing:.1px}
p.sub{margin:0 0 22px;color:var(--ink3)}
h2.sec{font:600 13px/1 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:28px 0 12px}
label.f{display:block;font-size:12px;font-weight:650;color:var(--ink2);margin:0 0 5px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:8px 10px;outline:none}
.in:focus{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accentbg)}
textarea.in{resize:vertical;min-height:90px;line-height:1.5}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
.sp{flex:1}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:36px;text-align:center;color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accentbg);color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{width:34px;height:20px;appearance:none;background:var(--line2);border-radius:20px;position:relative;cursor:pointer;transition:.15s;margin:0}
.toggle input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:16px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink3);font-weight:600}
.kpi .v{font:600 30px/1.1 var(--doc);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:4px}
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.covc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .12s,transform .12s}
.covc:hover{border-color:var(--accent2);transform:translateY(-1px)}
.covc h4{margin:0 0 2px;font:600 15px/1.25 var(--doc)}
.covc .n{font-size:12px;color:var(--ink3);margin-bottom:10px}
.covrow{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:11.5px;margin-top:5px;font-variant-numeric:tabular-nums}
.covrow b{color:var(--c);font-weight:700}
.covrow .t{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.covrow .t i{display:block;height:100%;background:var(--c);border-radius:4px}
.covrow .na{color:var(--ink3);font-style:italic;grid-column:2/4}
.typebars .tb{display:grid;grid-template-columns:190px 1fr 50px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.typebars .tb .t{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.typebars .tb .t i{display:block;height:100%;background:var(--accent2)}
.hist{display:flex;flex-direction:column;gap:2px}
.hist .h{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}

/* ---------- ingest ---------- */
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:30px;text-align:center;color:var(--ink3);cursor:pointer;transition:.12s;background:var(--panel)}
.drop.over{border-color:var(--accent);background:var(--accentbg);color:var(--accent)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px}
.prog{margin-top:18px}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.plog{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-height:220px;overflow:auto;margin-top:10px;white-space:pre-wrap;color:var(--ink2)}

/* ---------- triage ---------- */
.lotes{display:flex;flex-direction:column;gap:8px}
.lote{display:grid;grid-template-columns:1fr auto;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.lote:hover{border-color:var(--accent2)}
.lote .ttl{font-weight:650}
.tbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin:-6px 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.fbtn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.fbtn.on{border-color:var(--accent);background:var(--accentbg);color:var(--accent)}
.prop{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--st,var(--line2));border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.prop.dec-descartar{opacity:.62}
.prop .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prop .pgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-bottom:10px}
.prop .ed{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--paper);color:var(--paperink);font:12pt/1.5 var(--doc);text-align:justify;max-height:340px;overflow:auto;outline:none}
.prop .ed:focus{border-color:var(--accent2)}
.prop .ed p,.prop .ed2 p{margin:0 0 .5em}
.prop .ed2{outline:none;min-height:30px}
.prop .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.prop .cmp .box{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:11.5pt/1.45 var(--doc);max-height:240px;overflow:auto;background:var(--panel2)}
.prop .cmp .box h6{margin:0 0 6px;font:700 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.prop .note{margin-top:8px;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
.pts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.decis{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.decis .seg button{padding:5px 10px}

/* ---------- caderno ---------- */
.cad{display:grid;grid-template-columns:300px 1fr;height:100%;min-height:0}
.toc{border-right:1px solid var(--line);overflow:auto;background:var(--panel);min-height:0}
.toc-h{position:sticky;top:0;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2}
.toc-h h3{margin:0;font:600 17px/1.25 var(--doc)}
.toc-h .muted{font-size:12px;margin-top:3px}
.toc ul{list-style:none;margin:0;padding:6px 8px 30px}
.toc li button{display:grid;grid-template-columns:auto 1fr auto;gap:8px;width:100%;border:0;background:none;padding:6px 8px;text-align:left;border-radius:7px;cursor:pointer;font-size:12.5px;line-height:1.3;color:var(--ink2);align-items:start}
.toc li button:hover{background:var(--panel2);color:var(--ink)}
.toc li button.on{background:var(--accentbg);color:var(--accent)}
.toc li .no{font-weight:700;color:var(--ink3);min-width:26px;font-variant-numeric:tabular-nums}
.toc li.l1 button{padding-left:22px} .toc li.l2 button{padding-left:36px}
.toc li.secl{padding:10px 8px 2px;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.toc li .ct{font-size:11px;font-weight:700;color:var(--ink3);background:var(--mutebg);border-radius:8px;padding:0 6px;height:17px;line-height:17px}
.toc li .ct.has{background:var(--accentbg);color:var(--accent)}
.docarea{overflow:auto;min-height:0;background:var(--bg2);position:relative}
.dtool{position:sticky;top:0;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.dtool .sepv{width:1px;height:22px;background:var(--line2);margin:0 4px}
.fmt{display:flex;flex:none}
.dtool>*{flex-shrink:0}
.seg button{white-space:nowrap}
.fmt button{border:0;background:none;min-width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink2);font:600 14px var(--doc);display:inline-grid;place-items:center;padding:0 6px}
.fmt button:hover{background:var(--panel2);color:var(--ink)}
.page{width:210mm;max-width:calc(100% - 32px);margin:26px auto 80px;background:var(--paper);color:var(--paperink);box-shadow:var(--shadow);padding:25mm 25mm 30mm 30mm;font-family:var(--doc);font-size:var(--dfs,12pt);line-height:var(--dlh,1.5);min-height:297mm;border-radius:2px}
.page .d-cover{border-bottom:1px solid #d7d2c8;padding-bottom:14pt;margin-bottom:18pt}
.page .d-cover .k{font-variant:small-caps;letter-spacing:.08em;color:#6b6457;font-size:10.5pt}
.page h1{font:400 24pt/1.15 var(--doc);margin:4pt 0 6pt;color:#1f2a44;font-variant:small-caps;letter-spacing:.02em}
.page .d-cover .m{color:#6b6457;font-size:10.5pt}
.page h2.pt{font:400 15pt/1.3 var(--doc);color:#1f2a44;margin:26pt 0 4pt;padding-top:8pt;border-top:1px solid #e6e1d7;scroll-margin-top:70px}
.page h2.pt .pn{font-variant:small-caps;letter-spacing:.06em;color:var(--pc,#1f2a44);margin-right:8pt}
.page .ementa{font-size:10pt;color:#6b6457;font-style:italic;text-align:justify;margin:0 0 10pt;line-height:1.4}
.page .ementa.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.page h3.tp{font:400 12.5pt/1.3 var(--doc);font-variant:small-caps;letter-spacing:.07em;color:#8a5a14;margin:16pt 0 6pt;border-bottom:1px solid #efe7d6;padding-bottom:2pt}
.page h4.as{font:italic 400 12pt/1.3 var(--doc);color:#2f3b55;margin:12pt 0 4pt}
.page .it{position:relative;margin:0 0 10pt;padding:2pt 0;border-radius:2px;transition:background .15s}
.page .it:hover{background:#faf7f0}
.page .it.flash{animation:flash 1.6s}
@keyframes flash{0%,30%{background:#fff1c9}100%{background:transparent}}
.page .it .ih{font-variant:small-caps;letter-spacing:.03em;color:#2c2c2c;margin:0 0 2pt;display:flex;gap:8pt;align-items:baseline}
.page .it .ih .rf{color:#6b6457;font-size:10.5pt;font-variant:normal;letter-spacing:0}
.page .it .ih .star{color:#b8860b}
.page .it .ih .dv{font-variant:normal;letter-spacing:0;font-size:9.5pt;color:#a2372b;border:1px solid #e5b8b1;border-radius:3pt;padding:0 4pt}
.page .ic{outline:none;text-align:justify;border-radius:2px}
.page .ic:focus{background:#fffdf6;box-shadow:0 0 0 2px #efe4c3}
.page .ic p{margin:0 0 6pt} .page .ic p:last-child{margin-bottom:0}
.page .ic blockquote,.prop .ed blockquote{margin:6pt 0 6pt 24pt;padding-left:10pt;border-left:2px solid #d8cfbd;color:#333}
.page .ic ul,.page .ic ol,.prop .ed ul,.prop .ed ol{margin:4pt 0 6pt;padding-left:22pt}
.page table,.prop .ed table{border-collapse:collapse;width:100%;margin:6pt 0;font-size:.95em}
.page td,.page th,.prop .ed td,.prop .ed th{border:1px solid #cfc8ba;padding:3pt 6pt;vertical-align:top;text-align:left}
.page th{background:#f3efe6;font-weight:400;font-variant:small-caps}
.page mark,.prop .ed mark{background:#fff0a8;color:inherit;padding:0 1px}
.page .it .src{font-size:9pt;color:#9a9386;margin-top:2pt;font-family:var(--ui)}
.page .gut{position:absolute;right:-44px;top:0;display:flex;flex-direction:column;gap:2px;opacity:0;transition:opacity .12s}
.page .it:hover .gut,.page .it:focus-within .gut{opacity:1}
.page .gut button{width:28px;height:28px;border-radius:7px;border:1px solid #e3ddd0;background:#fff;cursor:pointer;display:grid;place-items:center;color:#6b6457}
.page .gut button:hover{color:#1f2a44;border-color:#b9b1a1}
.page .nomat{color:#a39c8e;font-size:10.5pt;font-style:italic;font-family:var(--doc);margin:4pt 0 8pt;display:flex;gap:10px;align-items:center}
.page .nomat button,.page .addrow button{font:12px var(--ui);border:1px dashed #cfc7b6;background:none;border-radius:6px;padding:3px 9px;cursor:pointer;color:#6b6457}
.page .addrow{margin:4pt 0 0;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.page section.ponto:hover .addrow{opacity:1}
.page .pnote{margin:10pt 0 4pt;border-left:3px solid #c9b98f;padding:4pt 0 4pt 10pt;background:#fcfaf3}
.page .pnote .lb{font:11px var(--ui);color:#8a7b55;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3pt}
.page .semponto h2.pt .pn{color:#8a8375}
em.lat{font-style:italic}

/* ---------- modal / toast / menu ---------- */
.ov{position:fixed;inset:0;background:rgba(15,18,24,.45);display:grid;place-items:center;z-index:50;padding:18px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(680px,100%);max-height:calc(100dvh - 36px);display:flex;flex-direction:column}
.modal.wide{width:min(980px,100%)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;font:600 18px/1.2 var(--doc)}
.modal .body{padding:18px 20px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 26px rgba(0,0,0,.25);animation:fade .15s;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:5px;min-width:220px}
.menu button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.picker-list{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:10px}
.picker-list .pi{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;align-items:start}
.picker-list .pi:hover{background:var(--panel2)}
.picker-list .pi.sel{background:var(--accentbg)}
.picker-list .ph2{padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);position:sticky;top:0;color:var(--c)}
.res{display:flex;flex-direction:column;gap:8px}
.res .r{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.res .r:hover{border-color:var(--accent2)}
.res .r .t{font:600 15px/1.3 var(--doc)}
.res .r .x{font:13.5px/1.5 var(--doc);color:var(--ink2);margin-top:4px}
.res mark{background:#ffe89a;color:inherit}
.ed-list .pe{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.ed-list .pe textarea{min-height:40px;font-size:13px;field-sizing:content}
.setsec{margin-bottom:18px}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  @page{size:A4;margin:22mm 22mm 24mm 27mm}
  body{background:#fff;overflow:visible;height:auto}
  #app,#toasts,.ov,.menu{display:none!important}
  #printArea{display:block}
  #printArea .page{box-shadow:none;margin:0;padding:0;width:auto;max-width:none;min-height:0}
  #printArea .gut,#printArea .addrow,#printArea .nomat button{display:none!important}
  #printArea h2.pt{break-after:avoid}
  #printArea h3.tp,#printArea h4.as,#printArea .ih{break-after:avoid}
  #printArea .ementa.clip{display:block;-webkit-line-clamp:unset}
}

/* ---------- responsive ---------- */
@media (max-width:1100px){.cad{grid-template-columns:250px 1fr}.page .gut{right:4px;top:-30px;flex-direction:row}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:284px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  #side.open{transform:none}
  #menuBtn{display:inline-grid}
  #top{padding:8px 10px;gap:6px;flex-wrap:wrap}
  .search{order:5;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .wrap{padding:18px 16px 70px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.prop .pgrid,.prop .cmp{grid-template-columns:1fr}
  .cad{grid-template-columns:1fr}
  .toc{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:39;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .toc.open{transform:none}
  .page{width:auto;max-width:none;margin:10px;padding:18px 16px 30px;min-height:0;font-size:calc(var(--dfs,12pt) * .95)}
  .page .gut{position:static;opacity:1;flex-direction:row;justify-content:flex-end;margin-top:4px}
  .page .addrow{opacity:1}
  .dtool{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .dtool::-webkit-scrollbar{display:none}
  .dtool .toggle{white-space:nowrap}
  .typebars .tb{grid-template-columns:130px 1fr 40px}
  .lens button{padding:5px 8px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}

</style>
</head>

<script type="application/json" id="editais-embutidos">{"app":"Cátedra","versao":1,"atualizado":"29/9/2026","disciplinas":[{"id":"penal","nome":"Direito Penal"},{"id":"lpe","nome":"Legislação Penal Extravagante"},{"id":"ppenal","nome":"Direito Processual Penal"},{"id":"execucao","nome":"Execução Penal"},{"id":"empresarial","nome":"Direito Empresarial"},{"id":"civil","nome":"Direito Civil"},{"id":"lce","nome":"Legislação Civil Extravagante"},{"id":"pcivil","nome":"Direito Processual Civil"},{"id":"constitucional","nome":"Direito Constitucional"},{"id":"administrativo","nome":"Direito Administrativo"},{"id":"tributario","nome":"Direito Tributário e Financeiro"},{"id":"consumidor","nome":"Direito do Consumidor e Econômico"},{"id":"ambiental","nome":"Direito Ambiental"},{"id":"eca","nome":"Direito da Criança e do Adolescente"},{"id":"eleitoral","nome":"Direito Eleitoral"},{"id":"dh","nome":"Direitos Humanos"},{"id":"humanistica","nome":"Formação Humanística"},{"id":"internacional","nome":"Direito Internacional"},{"id":"previdenciario","nome":"Direito Previdenciário"},{"id":"lp","nome":"Língua Portuguesa"}],"editais":[{"id":"tjsc","sigla":"TJSC","nome":"Tribunal de Justiça de Santa Catarina — Concurso 2025","cor":"#1f6f5c","pontos":{"civil":[{"id":"tjsc:civil:1","n":"1","lvl":0,"t":"Lei de Introdução às Normas do Direito Brasileiro."},{"id":"tjsc:civil:2","n":"2","lvl":0,"t":"Sistema do Código Civil. Princípios gerais do Direito. Unidade sistemática e pluralidade de fontes. Codificação e constitucionalização das relações interprivadas."},{"id":"tjsc:civil:3","n":"3","lvl":0,"t":"Direito subjetivo. Direito potestativo. Faculdade jurídica. Direitos imprescritíveis. Relação jurídica e situações jurídicas. Situações subjetivas existenciais e situações subjetivas patrimoniais."},{"id":"tjsc:civil:4","n":"4","lvl":0,"t":"Das pessoas naturais. Da personalidade e da capacidade. Dos direitos de personalidade. Da ausência. Da personalidade jurídica. Liberdade, autonomia e novas tecnologias. Teorias da desconsideração da personalidade jurídica. Do domicílio."},{"id":"tjsc:civil:5","n":"5","lvl":0,"t":"Dos Bens. Bens considerados em si mesmos. Móveis e imóveis. Fungíveis e consumíveis. Divisíveis. Singulares e coletivos. Bens reciprocamente considerados. Principais e acessórios. Benfeitorias e sua classificação. Bens públicos. Distinção dos particulares."},{"id":"tjsc:civil:6","n":"6","lvl":0,"t":"Dos Fatos jurídicos. Teoria Geral do negócio jurídico. Prova. Negócios jurídicos: conceito, pressupostos e elementos de existência, requisitos de validade; classificações. Inexistência, invalidade e ineficácia. Interpretação dos atos e negócios jurídicos. Defeitos dos atos e negócios jurídicos. Erro. Dolo. Coação. Estado de perigo. Lesão. Fraude contra credores. Invalidade do negócio jurídico. Negócio nulo. Condições de nulidade. Simulação. Negócio anulável. Condições de anulabilidade. Convalidação. Requisitos. Prova dos fatos jurídicos. Interesse público e estrutura do negócio jurídico. A função negocial nas relações jurídicas contemporâneas. “Lei da Usura” (Decreto nº 22.626/1933)."},{"id":"tjsc:civil:7","n":"7","lvl":0,"t":"Dos atos jurídicos lícitos e dos atos jurídicos ilícitos. Requisitos de configuração do ato ilícito. Excludentes do ato ilícito."},{"id":"tjsc:civil:8","n":"8","lvl":0,"t":"Prescrição e decadência. Regime jurídico do Código Civil. Disposições gerais. Prescrição. Exceção, renúncia, oportunidade de alegação, reconhecimento ex officio e iniciativa do interessado. Interrupção e suspensão da prescrição. Fato com origem criminal. Termo legal da prescrição. Solidariedade. Aproveitamento da prescrição. Condições. Prazos de prescrição. Decadência. Legal e convencional. Renúncia. Prazos de decadência."},{"id":"tjsc:civil:9","n":"9","lvl":0,"t":"Das Obrigações. Modalidades. Obrigações de dar. Obrigações de fazer e não fazer. Obrigações alternativas, divisíveis e indivisíveis. Obrigações solidárias. Solidariedade ativa e passiva. Transmissão das obrigações. Adimplemento, inadimplemento e extinção das obrigações. Mora."},{"id":"tjsc:civil:10","n":"10","lvl":0,"t":"Contratos em geral. Normas gerais. Extinção do contrato. Tendências atuais do direito contratual. Autonomia da vontade. Intervenção do Estado e a função social do contrato. Contrato e propriedade. Pós-eficácia contratual. Lei de Liberdade Econômica (Lei nº 13.874/2019)."},{"id":"tjsc:civil:11","n":"11","lvl":0,"t":"Formação dos contratos, estipulação em favor de terceiro, promessa de fato de terceiro, vícios redibitórios, evicção, contratos aleatórios, contrato preliminar, contrato com pessoa a declarar. Teoria da boa-fé objetiva. Extinção do contrato. Distrato. Cláusula resolutiva. Exceção do contrato não cumprido. Revisão contratual. Teorias subjetivas e objetivas. Imprevisão. Resolução por onerosidade excessiva. Teoria da base do negócio jurídico."},{"id":"tjsc:civil:12","n":"12","lvl":0,"t":"Classificação dos contratos: unilaterais e bilaterais; típicos, atípicos e mistos; consensuais e reais; gratuitos e onerosos; cumulativos e aleatórios; contratos solenes e não solenes; contratos personalíssimos; contratos preliminares. Contrato com pessoa a nomear. Gestão de negócios. Distinções e semelhanças do regime jurídico-contratual entre ‘civil law’ e ‘common law’."},{"id":"tjsc:civil:13","n":"13","lvl":0,"t":"Contratos em espécie (típicos): Compra e venda. Troca ou permuta. Contrato estimatório. Doação. Locação de coisas. Fiança. Empréstimo. Comodato. Mútuo. Prestação de serviço. Empreitada. Depósito. Mandato. Comissão. Agência e Distribuição. Corretagem. Transporte. Seguro. Constituição de renda. Transação. Contratos atípicos. Contratos agrários. Parceria e arrendamento."},{"id":"tjsc:civil:14","n":"14","lvl":0,"t":"Atos Unilaterais. Promessa de recompensa. Gestão de negócios. Pagamento indevido. Enriquecimento sem causa."},{"id":"tjsc:civil:15","n":"15","lvl":0,"t":"Da responsabilidade civil e da obrigação de indenizar. Do novo direito de danos e os reflexos na imputação e no nexo causal."},{"id":"tjsc:civil:16","n":"16","lvl":0,"t":"Da posse. Conceito e classificação. Detenção. Aquisição. Efeitos e perda. Composse e defesa dos direitos possessórios. Posse justa, violenta, clandestina e precária. Posse de boa-fé. Constituto possessório. Aquisição, efeitos, desforço próprio. Direitos do possuidor de boa-fé. Obrigações e direitos do possuidor de má-fé. Exceptio proprietatis. Perda da posse."},{"id":"tjsc:civil:17","n":"17","lvl":0,"t":"Da propriedade. Função social da propriedade. Aquisição da propriedade imóvel. Modos de aquisição a título originário e derivado. Aquisição da propriedade móvel. Tradição. Perda da propriedade. Direitos de vizinhança. Superfície. Servidões. Usufruto. Uso e Habitação. Direito do promitente comprador. Penhor. Hipoteca. Anticrese. Alienação fiduciária. Proteção possessória. Usucapião. Espécies e requisitos."},{"id":"tjsc:civil:18","n":"18","lvl":0,"t":"Direito das famílias. Direitos pessoais. Casamento. Formas, pressupostos, capacidade, impedimentos, causas suspensivas, celebração, provas, nulidade, anulabilidade e eficácia. Dissolução do casamento. Dissolução da sociedade conjugal e do vínculo matrimonial. Formas, causas, hipóteses de impossibilidade de vida em comum. Separação, divórcio e proteção da pessoa dos filhos. Direito Parental. Relação de parentesco, filiação, reconhecimento dos filhos, adoção, poder familiar e bem de família. Investigação de paternidade. Fundamentos biologistas e bases socioafetivas da filiação e do parentesco. Filiação matrimonial. Filiação havida fora do casamento. Posse de estado de filho. Filiação e descendência genética. Guarda compartilhada (Lei nº 13.058/2014). Direito Protetivo. Tutela e Curatela. Medidas protetivas à violência doméstica e familiar (Lei nº 11.340/2006)."},{"id":"tjsc:civil:19","n":"19","lvl":0,"t":"Direito das famílias. Direitos pessoais. Da União Estável e do Concubinato. União estável. Conceito, condições, impedimentos, deveres, causas suspensivas do casamento e a união estável, regime patrimonial. Concubinato. Conceito e reconhecimento judicial. Da União Homoafetiva."},{"id":"tjsc:civil:20","n":"20","lvl":0,"t":"Direito das Família. Direitos patrimoniais. Regimes de bens no casamento, usufruto e administração dos bens dos filhos menores. Alimentos. Conceito, abrangência, finalidade, pressupostos, critérios e características da obrigação. Bem de família."},{"id":"tjsc:civil:21","n":"21","lvl":0,"t":"Do Direito das Sucessões. Da sucessão em geral. Herança e administração. Vocação hereditária. Aceitação e renúncia. Exclusão da sucessão. Herança jacente. Petição de herança. Sucessão legítima. Ordem de vocação hereditária. Herdeiros necessários. Direito de representação. Sucessão testamentária. Testamento em geral. Capacidade de testar. Testamentos público, cerrado e particular. Codicilo. Legados e sua caducidade. Testamentos especiais. Direito de acrescer entre herdeiros e legatários. Substituições. Deserdação. Redução das disposições testamentárias. Revogação e rompimento do testamento. Inventário e partilha. Sonegados. Pagamento de dívidas. Colação de bens. Garantia dos quinhões hereditários. Anulação de partilha. Das disposições finais e transitórias do Código Civil Brasileiro, artigos 2.028 a 2.046."},{"id":"tjsc:civil:22","n":"22","lvl":0,"t":"Registros Públicos. Lei nº 6.015, de 31 de dezembro de 1973 (Provimento nº 149/2023 do Conselho Nacional de Justiça). Natureza dos serviços. Delegação. Fé pública. Lei nº 8.935/94. Registro de imóveis. Princípios de regência do registro imobiliário. Atos sujeitos a registro. Averbações. Registro de Títulos e Documentos. Atos sujeitos a registro. Sociedades religiosas e partidos políticos. Competência para registro dos atos constitutivos e estatutos. Registro Civil das Pessoas Naturais. Atos sujeitos a registro. Tabelionatos de Notas e Tabelionatos de Protestos Cambiais. Competência dos titulares."},{"id":"tjsc:civil:23","n":"23","lvl":0,"t":"Da alienação fiduciária (Decreto-Lei nº 911, de 1º de outubro de 1969). Lei nº 9.514, de 20 de novembro de 1997. Do condomínio em edificações e as incorporações imobiliárias (Lei nº 4.591, de 16 de dezembro de 1964), Lei nº 10.931, de 2 de agosto de 2004. Do Estatuto do Idoso (Lei nº 10.741, de 1º de outubro de 2003). Da locação de imóveis urbanos (Lei nº 8.245, de 18 de outubro de 1991). Estatuto da Pessoa com Deficiência (Lei nº 13.146/2015). Lei nº 14.382/2022. Regime Jurídico Emergencial e Transitório das relações jurídicas de Direito Privado (Lei nº 14.010/2020). Resolução CNJ nº 452, de 22/4/2022. Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018). Marco Civil da Internet (Lei nº 12.965/2014). Lei Federal de Parcelamento do Solo Urbano nº 6.766/1979. Lei Estadual nº 17.492/2018."}],"pcivil":[{"id":"tjsc:pcivil:1","n":"1","lvl":0,"t":"Direito material e direito processual. Normas processuais fundamentais. Boa-fé, eficiência e colaboração processual. Direito processual e Constituição. Acesso à Justiça. Lesão e ameaça a direito. Instrumentalidade, efetividade, adequação, tempestividade e eficiência da tutela jurisdicional. Princípio de economia processual. Garantia da duração razoável do processo. Meios adequados de resolução de conflitos. Conciliação e mediação. Arbitragem. Aplicação das normas processuais."},{"id":"tjsc:pcivil:2","n":"2","lvl":0,"t":"Jurisdição e competência. Conceito. Características. Espécies. Escopos. Critérios. Limites. Princípios. Cooperação internacional. Incompetência absoluta e relativa e meios de suscitação. Modificação da competência. Prevenção. Prorrogação. Perpetuação. Cooperação nacional. Atos de concertação. Produção de prova única nos litígios de massa."},{"id":"tjsc:pcivil:3","n":"3","lvl":0,"t":"Ação: conceito, natureza jurídica, teorias, condições, identificação e Classificação. Processo: conceito, natureza jurídica, teorias. Pressupostos processuais."},{"id":"tjsc:pcivil:4","n":"4","lvl":0,"t":"Sujeitos do processo. Partes e capacidade processual. Deveres processuais e responsabilidade. Litigância de má-fé e atos atentatórios à dignidade da justiça. Despesas processuais, honorários de sucumbência, multas e gratuidade da justiça. Sucessão e substituição. Curador especial. Procuradores. Litisconsórcio: modalidades, poderes e limitação. Intervenção de terceiros: espécies, características. Assistência simples e litisconsorcial. Denunciação da lide. Chamamento ao processo. Incidente de desconsideração da personalidade jurídica. Amicus Curiae. Juiz: poderes, deveres e responsabilidades. Impedimento e suspeição. Auxiliares da Justiça. Carreiras essenciais à administração da Justiça. Ministério Público. Advocacia Pública. Defensoria Pública."},{"id":"tjsc:pcivil:5","n":"5","lvl":0,"t":"Atos processuais: conceito, classificação, forma. Negócio jurídico processual e convenção processual. Calendário processual. Prática de atos processuais no processo eletrônico. Atos das partes. Preclusão temporal, lógica e consumativa. Atos do juiz. Preclusão pro judicato. Tempo, lugar e comunicação dos atos processuais. Prazos. Citações e intimações. Teoria da aparência. Citação real e ficta. Contumácia. Invalidades processuais. Mera irregularidade. Anulabilidade. Nulidade. Vícios processuais sanáveis e insanáveis. Distribuição e registro. Valor da causa."},{"id":"tjsc:pcivil:6","n":"6","lvl":0,"t":"Tutelas provisórias. Aspectos gerais. Poder geral de tutela. Tutelas de urgência. Tutela cautelar e tutela antecipada: cabimento, fungibilidade, momento, requisitos, procedimentalização. Estabilização da tutela antecipada requerida em caráter antecedente. Modalidades de tutela urgente antecipada na forma específica: tutela inibitória e tutela de remoção do ilícito. Tutela de evidência: cabimento, requisitos, procedimentalização. Distribuição do tempo do processo."},{"id":"tjsc:pcivil:7","n":"7","lvl":0,"t":"Procedimento comum. Formação, suspensão e extinção do Processo. Elementos da demanda. Petição inicial: requisitos, alteração, aditamento, emenda, inépcia e indeferimento. Improcedência liminar do pedido. Recursos. Retratação. Teoria da aparência. Audiência de conciliação ou de mediação."},{"id":"tjsc:pcivil:8","n":"8","lvl":0,"t":"Resposta: conceito, espécies. Contestação. Reconvenção. Revelia. Providências preliminares. Julgamento conforme o estado do processo. Extinção do processo. Julgamento antecipado do mérito. Julgamento antecipado parcial do mérito. Saneamento e organização do processo. Delimitação das questões e requerimento de esclarecimentos. Saneamento compartilhado."},{"id":"tjsc:pcivil:9","n":"9","lvl":0,"t":"Provas: conceito e disposições gerais. Relevância e admissibilidade. Prova direta e indireta. Presunções e máximas de experiência. Ônus e dever probatório. Distribuição estática e distribuição dinâmica. Inversão. Poderes probatórios do juiz. Prova ilícita. Regras de exclusão e regras de privilégio. Provas típicas e atípicas. Prova estatística nas demandas coletivas. Prova e tutela inibitória. Produção da prova e produção antecipada da prova. Valoração da prova. Sistema do convencimento motivado. Standards de prova. Audiência de instrução e julgamento."},{"id":"tjsc:pcivil:10","n":"10","lvl":0,"t":"Sentença: conceito, disposições gerais, classificação e elementos. Racionalidade. Fundamentação analítica. Interpretação e argumentação jurídica na sentença. Justificação das consequências da decisão judicial (LINDB). Interpretação da decisão judicial. Efeitos. Regra da congruência. Julgamento das ações relativas às prestações de fazer, de não fazer e de entregar coisa e as formas de tutela específica. Remessa obrigatória. Coisa julgada: conceito; espécies; limites; eficácias negativa, positiva e preclusiva; relativização. O deduzido e o dedutível. Coisa julgada sobre questão. Sentenças autossuficientes e sentenças não autossuficientes. Liquidação de sentença."},{"id":"tjsc:pcivil:11","n":"11","lvl":0,"t":"Cumprimento de Sentença: disposições gerais. Cumprimento de sentença que reconheça a exigibilidade de obrigação: (a) de pagar quantia certa; (b) de prestar alimentos, provisórios ou definitivos; (c) de pagar quantia certa pela Fazenda Pública; (d) de fazer, de não fazer e de entregar coisa. Defesa. Cumprimento de sentença provisório e definitivo."},{"id":"tjsc:pcivil:12","n":"12","lvl":0,"t":"Procedimentos especiais do CPC/15: ação de consignação em pagamento, ação de exigir contas, ações possessórias, inventário e partilha, ações de família, embargos de terceiro, oposição, habilitação, ação monitória, da homologação do penhor legal; da regulação de avaria grossa; restauração de autos."},{"id":"tjsc:pcivil:13","n":"13","lvl":0,"t":"Procedimentos de jurisdição voluntária: disposições gerais. Notificação e interpelação, alienação judicial. Divórcio e separação consensuais, extinção consensual de união estável e alteração do regime de bens do matrimônio. Testamentos e codicilos. Herança jacente. Bens dos ausentes. Coisas vagas. Interdição e tutela. Organização e fiscalização das fundações."},{"id":"tjsc:pcivil:14","n":"14","lvl":0,"t":"Processo de execução: disposições gerais, partes, competência, requisitos. Títulos executivos. Responsabilidade patrimonial. Espécies de execução. Execução para entrega de coisa. Execução das obrigações de fazer e não fazer. Execução por quantia certa. Execução contra a fazenda pública. Execução de alimentos. Embargos à execução. Suspensão e extinção do processo de execução."},{"id":"tjsc:pcivil:15","n":"15","lvl":0,"t":"Da ordem dos processos nos Tribunais e competência originária: disposições gerais. Incidentes de assunção de competência, de arguição de inconstitucionalidade e de resolução de demandas repetitivas. Conflito de competência. Homologação de sentença estrangeira e concessão de exequatur a carta rogatória. Ação rescisória. Incidente de resolução de demandas repetitivas. Reclamação."},{"id":"tjsc:pcivil:16","n":"16","lvl":0,"t":"Recursos: conceito, natureza jurídica, classificação, normas fundamentais, efeitos. Juízo de admissibilidade e juízo de mérito. Sucedâneos recursais. Ações autônomas de impugnação. Precedentes (ratio decidendi, obiter dictum, formação, vinculação, distinção e superação). Distinguishing e overruling. Recomendação nº 134 do Conselho Nacional de Justiça. Súmulas. Súmulas vinculantes. Papel das Cortes Superiores. Recursos em espécie: apelação, agravo de instrumento, embargos de declaração, agravo interno, recurso ordinário, recurso especial, recurso extraordinário. Repercussão geral em recurso extraordinário. Recursos extraordinário e especial repetitivos e seu julgamento. Agravo em recurso especial e em recurso extraordinário. Embargos de divergência. Técnica de julgamento não unânime."},{"id":"tjsc:pcivil:17","n":"17","lvl":0,"t":"Código de Processo Civil (Lei nº 13.105/2015 e suas alterações). Procedimentos especiais previstos na legislação extravagante. Doutrina processual e legislação processual esparsa e suas alterações (independentemente de indicação específica do diploma legal, mas notadamente a respeito do indicado) sobre: bem de família (Lei nº 8.009/1990 e suas alterações); prescrição das ações contra a Fazenda Pública (Decreto nº 20.910/1932 e Decreto-lei nº 4.597/1942); assistência judiciária (Lei nº 1.060/1950 e suas alterações); execução fiscal (Lei nº 6.830/1980 e suas alterações); divórcio, separação e união estável (Lei nº 6.515/1977 e suas alterações e Lei nº 9.278/1996); proteção do consumidor (Lei nº 8.078/1990) e suas alterações; desapropriação (Decreto-Lei nº 3.365/1941 e suas alterações); registros públicos (Lei nº 6.015/1973 e suas alterações, Provimento nº 149/2023 do Conselho Nacional de Justiça; mandado de segurança (Lei nº 12.016/2009); ação popular e ação civil pública (Lei nº 4.717/1965 e suas alterações, Lei nº 7.347/1985 e suas alterações e Lei nº 8.429/1992 e suas alterações); habeas data (Lei nº 9.507/1997); alimentos (Lei nº 5.478/1968 e suas alterações e Lei nº 11.804/2008); investigação de paternidade (Lei nº 8.560/1992 e suas alterações); habeas corpus cível; usucapião; Juizados Especiais Estadual e Federal (Lei nº 9.099/1995 e suas alterações e Lei nº 10.259/2001 e suas alterações) e Juizado Especial da Fazenda Pública (Lei nº 12.153/2009); informatização do processo judicial (Lei nº 11.419/2006); medidas cautelares e tutela antecipada contra o Poder Público/Fazenda Pública e suspensão de liminares (Lei nº 8.437/1992 e suas alterações e Lei nº 9.494/1997 e suas alterações); edição, revisão e cancelamento de enunciado de súmula vinculante pelo Supremo Tribunal Federal (Lei nº 11.417/2006); mediação e autocomposição de conflitos (Lei nº 13.140/2015). Reflexos da Lei nº 13.105/2015 e suas alterações na legislação processual esparsa. Lei de Introdução às Normas do Direito Brasileiro (Lei nº 13.655/2018). Lei de Arbitragem (Lei nº 9.307/1996 e alterações – Lei nº 13.129/2015). Lei nº 14.538/2023."}],"consumidor":[{"id":"tjsc:consumidor:1","n":"1","lvl":0,"t":"Fundamentos Constitucionais e infraconstitucionais do Direito do Consumidor. Campo de Aplicação do Código de Defesa do Consumidor (CDC)."},{"id":"tjsc:consumidor:2","n":"2","lvl":0,"t":"Relação de Consumo. Conceitos de consumidor, fornecedor, produto e serviço. Correntes e posicionamento do STJ."},{"id":"tjsc:consumidor:3","n":"3","lvl":0,"t":"Principiologia e Direitos Básicos no CDC. Boa-fé objetiva. Inversão do ônus da prova."},{"id":"tjsc:consumidor:4","n":"4","lvl":0,"t":"Responsabilidade pelo fato e do produto e do serviço no CDC. Responsabilidade pelo Vício do produto e do serviço no CDC. Prazos. Garantia Contratual e Legal. Decadência e Prescrição. Desconsideração da Personalidade Jurídica no CDC."},{"id":"tjsc:consumidor:5","n":"5","lvl":0,"t":"Oferta e Publicidade. Práticas Comerciais Abusivas. Cobrança de Dívidas e cadastros de Inadimplentes. Contratação no comércio eletrônico – Decreto nº 7.962, de 15 de março de 2013."},{"id":"tjsc:consumidor:6","n":"6","lvl":0,"t":"Proteção Contratual no CDC. Cláusulas Abusivas. Contratos de Adesão. Financiamentos. Ações de revisão de contrato. Prevenção e tratamento do superenvidamento."},{"id":"tjsc:consumidor:7","n":"7","lvl":0,"t":"Sanções administrativas. O Sistema Nacional de Defesa do Consumidor."},{"id":"tjsc:consumidor:8","n":"8","lvl":0,"t":"Defesa dos Direitos do Consumidor em Juízo. Ações Coletivas para defesa de interesses difusos, coletivos e individuais homogêneos em matéria de consumo. Conciliação no superendividamento."},{"id":"tjsc:consumidor:9","n":"9","lvl":0,"t":"Lei do Cadastro Positivo e seu regulamento (Lei nº 12.414/2011 e Decreto nº 9.936/2019)."},{"id":"tjsc:consumidor:10","n":"10","lvl":0,"t":"Regulamento Geral de Direitos do Consumidor de Serviços de Telecomunicações (Resolução nº 632 ANATEL, de 7 de março de 2014)."},{"id":"tjsc:consumidor:11","n":"11","lvl":0,"t":"Regras de Prestação do Serviço Público de Distribuição de Energia Elétrica (Resolução Normativa ANEEL nº 1.000, de 7 de dezembro de 2021)."},{"id":"tjsc:consumidor:12","n":"12","lvl":0,"t":"Lei dos planos e seguros privados de assistência à saúde (Lei nº 9.656/1998)."},{"id":"tjsc:consumidor:13","n":"13","lvl":0,"t":"Jurisprudência, precedentes e súmulas do STF e do STJ em matéria de direito do consumidor."}],"eca":[{"id":"tjsc:eca:1","n":"1","lvl":0,"t":"Constituição Federal de 1988. Proteção integral e prioridade absoluta dos direitos da Infância e Juventude."},{"id":"tjsc:eca:2","n":"2","lvl":0,"t":"Estatuto da Criança e do Adolescente (Lei nº 8.069/1990 e suas alterações). Lei do SINASE (Sistema Nacional de Atendimento Socioeducativo) (Lei nº 12.594/2012)."},{"id":"tjsc:eca:3","n":"3","lvl":0,"t":"Autorização de viagem. Resolução CNJ nº 295 de 13/09/2019."},{"id":"tjsc:eca:4","n":"4","lvl":0,"t":"Sistema de Garantia dos Direitos da Criança e do Adolescente."},{"id":"tjsc:eca:5","n":"5","lvl":0,"t":"Atos Normativos referentes à criança e ao adolescente do Conselho Nacional de Justiça."},{"id":"tjsc:eca:6","n":"6","lvl":0,"t":"Normativa Internacional: Declaração Universal dos Direitos da Criança, Convenção das Nações Unidas sobre os Direitos da Criança e do Adolescente, Convenção de Haia sobre Cooperação em Matéria de Adoção, Regras Mínimas sobre Administração da Justiça da Infância e da Juventude (Regras de Beijing)."},{"id":"tjsc:eca:7","n":"7","lvl":0,"t":"Lei Orgânica da Assistência Social - LOAS (Lei nº 8.742/1993, com as alterações da Lei nº 12.435/2011). Política Nacional de Assistência Social (Resolução do Conselho Nacional de Assistência Social nº 145/04 – D.O.U. 28.10.2004). Tipificação Nacional dos Serviços Socioassistenciais (Resolução do Conselho Nacional se Assistência Social nº 109/09 – D.O.U. 25.11.2009). Resolução CNJ nº 165/2012 e suas alterações. Recomendação CNJ nº 98/2021. Resolução CONANDA nº 169/2014."},{"id":"tjsc:eca:8","n":"8","lvl":0,"t":"Resoluções nº 113, de 19.04.06 e nº 117, de 11.07.06, ambas do Conselho Nacional dos Direitos da Criança e do Adolescente (CONANDA), que dispõem sobre os parâmetros para a institucionalização e fortalecimento do Sistema de Garantia dos Direitos da Criança e do Adolescente."},{"id":"tjsc:eca:9","n":"9","lvl":0,"t":"Proteção e direitos das crianças e adolescentes com transtornos mentais (Lei nº 10.216/2001)."},{"id":"tjsc:eca:10","n":"10","lvl":0,"t":"Lei nº 13.431/2017 e Decreto nº 9.603/2018- Sistema de garantia de direitos da criança e do adolescente vítima ou testemunha de violência."},{"id":"tjsc:eca:11","n":"11","lvl":0,"t":"Lei nº 14.344/2022 – cria mecanismos para a prevenção e o enfrentamento da violência doméstica e familiar contra a criança e o adolescente, nos termos do § 8º do art. 226 e do § 4º do art. 227 da Constituição Federal e das disposições específicas previstas em tratados, convenções ou acordos internacionais de que o Brasil seja parte."},{"id":"tjsc:eca:12","n":"12","lvl":0,"t":"Lei nº 13.257/2016 – Marco Legal da Primeira Infância."},{"id":"tjsc:eca:13","n":"13","lvl":0,"t":"Resolução CONANDA nº 231/2022 - Altera a Resolução nº 170, de 10 de dezembro de 2014 para dispor sobre o processo de escolha em data unificada em todo o território nacional dos membros do Conselho Tutelar."}],"penal":[{"id":"tjsc:penal:1","n":"1","lvl":0,"t":"Direito Penal: conceito, funções e caracteres. Ciências Penais e disciplinas auxiliares;"},{"id":"tjsc:penal:2","n":"2","lvl":0,"t":"Escolas e tendências penais: escola clássica, escola positiva, escola crítica, escola moderna alemã, escola penal humanista, escola técnico-jurídica, escola correcionalista, movimento de defesa social;"},{"id":"tjsc:penal:3","n":"3","lvl":0,"t":"Principais fases da evolução epistemológica do Direito Penal: positivismo, neokantismo, finalismo e ontologismo do finalismo de Welzel, pós-finalismo: normativismo funcionalista. Direito Penal do Inimigo;"},{"id":"tjsc:penal:4","n":"4","lvl":0,"t":"Princípios Fundamentais do Direito Penal. Princípio da legalidade ou reserva legal. Princípio da dignidade da pessoa humana. Princípio da culpabilidade. Princípio da exclusiva proteção de bens jurídicos. Princípio da intervenção mínima e da fragmentariedade. Princípios da pessoalidade e da individualização da pena. Princípio da proporcionalidade. Princípio da humanidade. Princípio da adequação social. Princípio da insignificância;"},{"id":"tjsc:penal:5","n":"5","lvl":0,"t":"Bem Jurídico-Penal: Conceito e delimitação. Bem jurídico individual e transindividual. Objeto do crime. Bem jurídico e função;"},{"id":"tjsc:penal:6","n":"6","lvl":0,"t":"Teoria da lei penal. Fontes do Direito Penal: costume, jurisprudência e doutrina. Norma e lei penal: conceito e estrutura lógica da norma jurídico-penal. Lei penal em branco. Interpretação da lei penal. Aplicação da lei penal: argumento analógico, princípios gerais de direito e equidade."},{"id":"tjsc:penal:7","n":"7","lvl":0,"t":"Âmbito temporal da lei penal: irretroatividade e retroatividade da lei penal favorável. Lei excepcional ou temporária. Tempo do crime."},{"id":"tjsc:penal:8","n":"8","lvl":0,"t":"Âmbito espacial da lei penal. Princípios Fundamentais. Conceito de território nacional. Lugar do delito. Extraterritorialidade: imunidade diplomática e imunidade parlamentar. Extradição: conceito e espécies. Princípios e condições. Limitações à extradição. Deportação e expulsão."},{"id":"tjsc:penal:9","n":"9","lvl":0,"t":"Delito: conceito formal, material ou analítico. Classificação dos delitos: delito de resultado, delito de mera atividade ou conduta, delito qualificado pelo resultado, delito de lesão, delito de perigo abstrato e concreto, delito comum, especial (próprio e impróprio), delito de mão própria, delito unissubsistente, delito plurissubsistente, delito pluriofensivo, delito instantâneo, permanente e instantâneo de efeitos permanentes, delito de dano, delito comissivo, delito omissivo próprio (puro) e omissivo impróprios (ou comissivos por omissão, ou comissivos-omissivos), delitos unissubjetivo, delito plurissubjetivo (coletivo, de concurso necessário), delitos de ação única, delitos de ação múltipla ou de conteúdo variado, delito complexo, delito progressivo ou de passagem, delito habitual;"},{"id":"tjsc:penal:10","n":"10","lvl":0,"t":"Teorias da ação. Causas que excluem a ação e omissão. Relação de causalidade. Teorias. Superveniência de causa relativamente independente. Causação e imputação do resultado. Teorias. Estrutura do delito omissivo. Delito omissivo próprio. Delito omissivo impróprio;"},{"id":"tjsc:penal:11","n":"11","lvl":0,"t":"Tipicidade. Conceito de tipo. Tipicidade e ilicitude. Desvalor da ação, desvalor do resultado. Classificação estrutural dos tipos. Tipo de injusto de ação doloso: tipo objetivo e tipo subjetivo. Elemento subjetivo geral: o dolo. Elemento subjetivo do injusto (elemento subjetivo especial do tipo). Tipo de injusto de ação culposo. Conceito e elementos. Modalidades de culpa. Espécies de culpa. Princípio da confiança. Dolo eventual e culpa consciente. Erro de tipo. Conceito. Erro de tipo e erro de tipo permissivo. Erro de tipo escusável e inescusável. Erro acidental. Erro provocado por terceiro. Erro sobre o objeto. Erro na execução. Resultado diverso do pretendido;"},{"id":"tjsc:penal:12","n":"12","lvl":0,"t":"Ilicitude ou antijuridicidade. Causas de justificação. Estado de necessidade: conceito, fundamento e requisitos. Legítima defesa: conceito, fundamento e requisitos. Estrito cumprimento de dever legal: conceito, fundamento, requisitos. Colisão de deveres. Exercício Regular de direito: conceito, fundamento e requisitos. Consentimento do ofendido: conceito, funções, fundamento e requisito;"},{"id":"tjsc:penal:13","n":"13","lvl":0,"t":"Culpabilidade. Conceito. Evolução dogmática da culpabilidade. Conceito material de culpabilidade. Elementos da culpabilidade. Imputabilidade. Conceito. Causas de exclusão da imputabilidade. Imputabilidade diminuída. Embriaguez actio libera in causa. Consciência da ilicitude. Conceitos e teorias. Erro de proibição. Conceito e modalidades. Distinção entre erro de proibição e erro de tipo. Erro de proibição vencível e erro de proibição invencível. Exigibilidade de conduta diversa. Inexigibilidade. Hipóteses legais e supralegais de exculpação;"},{"id":"tjsc:penal:14","n":"14","lvl":0,"t":"Etapas da realização do delito: consumação e tentativa. Conceito e elementos. Fundamento da punibilidade da tentativa. Preparação e execução. Desistência voluntária e arrependimento eficaz. Arrependimento posterior. Crime impossível. Crime impossível e delito putativo. Intervenção predisposta de autoridade e atuação do agente provocador;"},{"id":"tjsc:penal:15","n":"15","lvl":0,"t":"Sujeitos do delito. Sujeito ativo e passivo. Responsabilidade penal da pessoa jurídica;"},{"id":"tjsc:penal:16","n":"16","lvl":0,"t":"Concurso de pessoas. Autoria e participação: teorias, requisitos e divisão. Autoria e coautoria: conceito de autor. Autoria colateral Participação: conceitos, elementos e espécies de participação. Punibilidade no concurso de pessoas. Circunstâncias incomunicáveis;"},{"id":"tjsc:penal:17","n":"17","lvl":0,"t":"Concurso de delitos. Unidade e Pluralidade delitiva. Sistemas. Concurso material ou real. Concurso formal ou ideal. Crime continuado. Multas no concurso de delitos;"},{"id":"tjsc:penal:18","n":"18","lvl":0,"t":"Teoria das Circunstâncias. Circunstâncias judiciais. Circunstâncias legais. Circunstâncias legais. Circunstâncias agravantes. Reincidência. Conceito e elementos da reincidência. Espécies e efeitos da reincidência. Agravantes no concurso de pessoas. Circunstâncias atenuantes. Causas de aumento e de diminuição de pena. Qualificadoras;"},{"id":"tjsc:penal:19","n":"19","lvl":0,"t":"Teorias da pena. Conceito. Espécies. Fundamentos e fins da pena. Teorias absolutas, relativas ou unitárias (ecléticas), Classificação das penas;"},{"id":"tjsc:penal:20","n":"20","lvl":0,"t":"Sistemas penitenciários;"},{"id":"tjsc:penal:21","n":"21","lvl":0,"t":"Princípios da Execução Penal: Princípio da legalidade; Princípio do devido processo legal; princípio da humanidade; princípio da jurisdicionalidade; princípios do contraditório e da ampla defesa; princípio da publicidade. Objeto e aplicação da Lei de Execução Penal: Do objeto da execução penal; da jurisdição do Juízo da Execução; dos presos provisórios, condenados pela Justiça Eleitoral ou Militar; delitos não atingidos pela sentença ou pela lei; a comunidade como ente colaborador. Classificação dos condenados: exame de personalidade e exame criminológico. Assistência: assistência material, assistência à saúde, assistência educacional, assistência social, assistência religiosa, assistência ao egresso. Trabalho: trabalho interno e externo. Deveres e direitos do preso. Disciplina: Faltas disciplinares, regime disciplinar diferenciado, sanções, aplicação das sanções e procedimento disciplinar;"},{"id":"tjsc:penal:22","n":"22","lvl":0,"t":"Órgãos da Execução Penal. Conselho Nacional de Política Criminal e Penitenciaria. Juízo da Execução. Ministério Público. Conselho Penitenciário. Departamentos penitenciários. Departamento Penitenciário Nacional. Departamento Penitenciário local. Direção administrativa e de pessoal dos estabelecimentos penais. Patronato. Conselho da Comunidade. Defensoria Pública;"},{"id":"tjsc:penal:23","n":"23","lvl":0,"t":"Estabelecimentos penais. Penitenciária. Colônia agrícola, industrial ou similar. Casa do albergado. Centro de Observação. Hospital de Custódia e Tratamento Psiquiátrico. Cadeia Pública;"},{"id":"tjsc:penal:24","n":"24","lvl":0,"t":"Penas privativas de liberdade e execução das penas em espécie: Reclusão e Detenção. Guia de recolhimento. Cálculo de liquidação e soma das penas. Superveniência de doença mental. Regimes. Soma e unificação de pena, detração, remição e fixação de regime. Progressão de regime: requisito objetivo e subjetivo, progressão nos crimes hediondos ou equiparados, regime aberto. Progressão por saltos. Regressão de regime. Monitoração eletrônica. Permissão de saída prisional. Saída temporária. Requisitos para a concessão da saída temporária. Condições legais de fiscalização. Prazo para saída temporária. Revogação da saída temporária. Remição. Contagem do tempo remido. Decisão judicial. Perda do tempo remido. Tempo remido e benefícios;"},{"id":"tjsc:penal:25","n":"25","lvl":0,"t":"Penas restritivas de direitos. Prestação pecuniária. Perda de bens e valores. Prestação de serviços à comunidade ou a entidades públicas. Interdição temporária de direitos: proibição do exercício de cargo, função ou atividade pública, bem como de mandado eletivo; proibição do exercício de profissão, atividade ou ofício que dependam de habilitação especial, de licença ou autorização do poder público; suspensão de autorização ou de habilitação para dirigir veículo; proibição de frequentar determinados lugares; proibição de inscrever-se em concurso, avaliação ou exames públicos. Limitação de fim de semana. Substituição. Conversão da pena na execução. Fiscalização e regras para execução;"},{"id":"tjsc:penal:26","n":"26","lvl":0,"t":"Pena de multa. Conceito. Natureza Jurídica. Sistemas de cominação de multa penal. Aplicação da pena de multa. Pagamento e parcelamento. Conversão e suspensão da pena de multa. Da prescrição da pena de multa na execução;"},{"id":"tjsc:penal:27","n":"27","lvl":0,"t":"Determinação da pena. Conceitos e sistemas. Individualização legal, judicial e executória. Fixação da pena. Fixação da pena privativa de liberdade. Fixação da pena de multa;"},{"id":"tjsc:penal:28","n":"28","lvl":0,"t":"Suspensão condicional da pena. Conceito e natureza jurídica. Sistemas. Requisitos. Espécies. Condições. Período de prova. Revogação. Prorrogação. Extinção. Competência;"},{"id":"tjsc:penal:29","n":"29","lvl":0,"t":"Livramento condicional. Requisitos de ordem objetiva e subjetiva. Concessão do livramento. Condições. Carta de livramento, cerimônia, caderneta e pecúlio. Revogação obrigatória e facultativa. Efeitos da revogação. Modificação das condições. Suspensão do livramento. Prorrogação do período de prova e extinção da pena;"},{"id":"tjsc:penal:30","n":"30","lvl":0,"t":"Medidas de Segurança. Conceito. Natureza jurídica. Pena e medida de segurança. Princípio da legalidade. Sistemas. Pressupostos de aplicação das medidas de segurança: prática de fato punível, periculosidade do autor, e ausência de imputabilidade plena. Espécies: internação em hospital de custódia e tratamento psiquiátrico, e tratamento ambulatorial. Locais de internação e tratamento. Duração das medidas de segurança. Exame de verificação da cessação de periculosidade. Desinternação ou liberação condicional. Medida de segurança substitutiva: semi-imputabilidade e superveniência de doença mental. Duração da medida de segurança substitutiva. Extinção da punibilidade e medidas de segurança. Direitos do internado;"},{"id":"tjsc:penal:31","n":"31","lvl":0,"t":"Processo e procedimento judicial na execução penal. Iniciativa. Procedimento. Videoconferência na execução penal. Agravo em execução;"},{"id":"tjsc:penal:32","n":"32","lvl":0,"t":"Conversões na execução. Incidentes de execução. Conversões: pena privativa de liberdade em penas restritivas de direito; penas restritivas de direito em pena privativa de liberdade; impossibilidade de conversão da pena de multa; pena privativa de liberdade em medidas de segurança. Tratamento ambulatorial em internação;"},{"id":"tjsc:penal:33","n":"33","lvl":0,"t":"Excesso ou desvio na execução. Legitimidade para suscitar o incidente;"},{"id":"tjsc:penal:34","n":"34","lvl":0,"t":"Efeitos da condenação. Conceito. Efeitos secundários penais. Efeitos secundários extrapenais: genéricos específicos. Reabilitação: conceito, condições, requisitos, efeitos e revogação;"},{"id":"tjsc:penal:35","n":"35","lvl":0,"t":"Condições objetivas da punibilidade. Definição e natureza jurídica. Enumeração e efeitos. Escusas absolutórias. Conceito e denominação. Natureza jurídica;"},{"id":"tjsc:penal:36","n":"36","lvl":0,"t":"Causas de extinção da punibilidade. Natureza jurídica e efeitos da extinção da punibilidade. Morte do agente. Anistia, graça e indulto. Abolitio criminis. Renúncia. Perdão do ofendido. Perdão judicial. Retratação. Decadência e perempção;"},{"id":"tjsc:penal:37","n":"37","lvl":0,"t":"Prescrição. Conceito e fundamentos. Os prazos de prescrição e sua contagem. Espécies. Suspensão e interrupção da prescrição;"},{"id":"tjsc:penal:38","n":"38","lvl":0,"t":"Dos crimes contra a pessoa;"},{"id":"tjsc:penal:39","n":"39","lvl":0,"t":"Dos crimes contra o patrimônio;"},{"id":"tjsc:penal:40","n":"40","lvl":0,"t":"Dos crimes contra a propriedade imaterial;"},{"id":"tjsc:penal:41","n":"41","lvl":0,"t":"Dos crimes contra a organização do trabalho;"},{"id":"tjsc:penal:42","n":"42","lvl":0,"t":"Dos crimes contra o sentimento religioso e contra o respeito aos mortos;"},{"id":"tjsc:penal:43","n":"43","lvl":0,"t":"Dos crimes contra a dignidade sexual;"},{"id":"tjsc:penal:44","n":"44","lvl":0,"t":"Dos crimes contra a f ia doméstica e familiar contra a criança e o adolescente (Lei nº 14.344/2022); n) CIRCULAR N. 277 DE 03 DE OUTUBRO DE 2023 – CORREGEDORIA-GERAL DA JUSTIÇA; o) Decreto-Lei nº 3.240/1941; p) Resolução nº 213/2015 do Conselho Nacional de Justiça; q) Resolução nº 427/2021 do Conselho Nacional de Justiça; r) Resolução nº 484/2022 do Conselho Nacional de Justiça."}],"constitucional":[{"id":"tjsc:constitucional:1","n":"1","lvl":0,"t":"Constituição: conceito e classificação; conteúdo da Constituição; normas constitucionais materiais e formais; supremacia da Constituição."},{"id":"tjsc:constitucional:2","n":"2","lvl":0,"t":"Estado Democrático de Direito: conceito; fundamentos constitucionais; princípio da República."},{"id":"tjsc:constitucional:3","n":"3","lvl":0,"t":"Interpretação da Constituição: hermenêutica constitucional; teorias da interpretação; critério da interpretação conforme; mutação constitucional."},{"id":"tjsc:constitucional:4","n":"4","lvl":0,"t":"Aplicabilidade das normas constitucionais: classificação quanto à eficácia e à aplicabilidade."},{"id":"tjsc:constitucional:5","n":"5","lvl":0,"t":"Controle de constitucionalidade: sistemas de controle; o sistema brasileiro; instrumentos; exercício do controle; efeitos da declaração de inconstitucionalidade; efeitos da declaração de constitucionalidade; a inconstitucionalidade por omissão."},{"id":"tjsc:constitucional:6","n":"6","lvl":0,"t":"Poder Constituinte: conceito; legitimidade e limites; poder originário e poder derivado; poder constituinte estadual."},{"id":"tjsc:constitucional:7","n":"7","lvl":0,"t":"Poder Legislativo: organização, funcionamento e competências; Congresso Nacional; processo legislativo; Comissões Parlamentares e controle jurisdicional; imunidades parlamentares; orçamento e fiscalização orçamentária; Tribunais de Contas."},{"id":"tjsc:constitucional:8","n":"8","lvl":0,"t":"Poder Judiciário: a função jurisdicional; organização do Poder Judiciário; Supremo Tribunal Federal; Superior Tribunal de Justiça; Súmula Vinculante; Conselho Nacional de Justiça; Justiça dos Estados."},{"id":"tjsc:constitucional:9","n":"9","lvl":0,"t":"Funções essenciais à Justiça: Ministério Público (natureza, princípios e garantias, estrutura e funções constitucionais); Advocacia (o advogado e a administração da Justiça, direitos, deveres e inviolabilidade); Advocacia pública (procuradorias e defensorias)."},{"id":"tjsc:constitucional:10","n":"10","lvl":0,"t":"Poder Executivo: princípios constitucionais da Administração Pública; presidencialismo e parlamentarismo; organização e estrutura do Poder Executivo; eleição e mandato do Chefe do Executivo; perda do mandato: hipóteses e consequências; responsabilidade do Chefe do Executivo; Medida Provisória: natureza, efeitos, conteúdo e limites; competência política, executiva e regulamentar; Estado de sítio e Estado de defesa."},{"id":"tjsc:constitucional:11","n":"11","lvl":0,"t":"Estrutura federativa brasileira: conceito e características da federação; repartição e classificação das competências na Constituição de 1988; União (natureza da unidade federativa; competências; organização), Estados (competências, organização e autonomia), Municípios (competências, organização e autonomia) e Distrito Federal (natureza, competências, organização e autonomia); os “consórcios públicos” (Lei nº 11.107/2005 e suas alterações); intervenção nos Estados e Municípios (autonomia e intervenção, competência interventiva, pressupostos formais e substanciais, procedimento, limites e controle)."},{"id":"tjsc:constitucional:12","n":"12","lvl":0,"t":"Direitos e garantias fundamentais: declaração dos direitos e sua formação histórica; natureza e eficácia das normas sobre direitos fundamentais; conceito de direitos e de garantias; classificação dos direitos fundamentais;"},{"id":"tjsc:constitucional:13","n":"13","lvl":0,"t":"Direitos individuais: destinatários; classificação; direito à vida; direito à privacidade; dignidade da pessoa humana; igualdade; liberdade los escriturais."},{"id":"tjsc:empresarial:6.2","n":"6.2","lvl":1,"t":"Classificação dos títulos de crédito quanto à circulação: a) títulos de crédito não à ordem; b) títulos de crédito ao portador; títulos de crédito à ordem."},{"id":"tjsc:empresarial:6.3","n":"6.3","lvl":1,"t":"Institutos cambiários: a) saque; b) endosso; c) aceite; d) intervenção; e) aval; f) protesto (Lei nº 9.492/1997)."},{"id":"tjsc:empresarial:6.4","n":"6.4","lvl":1,"t":"Títulos de crédito em espécie: a) letra de câmbio; b) nota promissória; c) duplicata; d) cheque; e) cédula de produto rural; f) comercial paper; g) cédulas de crédito comercial, industrial, rural e bancário; h) debêntures; i) títulos de crédito do agronegócio (Lei nº 11.076/2004 e suas alterações)."},{"id":"tjsc:empresarial:7","n":"7","lvl":0,"t":"Recuperação judicial, extrajudicial falência do empresário e da sociedade empresária (Lei nº 11.101/2005 e suas alterações)."},{"id":"tjsc:empresarial:7.1","n":"7.1","lvl":1,"t":"Crise econômica e financeira e cessação do pagamento; causas macro e microeconômicas da crise da empresa."},{"id":"tjsc:empresarial:7.2","n":"7.2","lvl":1,"t":"Disposições preliminares e comuns à recuperação judicial e à falência: a) verificação e da habilitação de créditos; b) administrador judicial e comitê de credores; c) assembleia geral de credores."},{"id":"tjsc:empresarial:7.3","n":"7.3","lvl":1,"t":"Recuperação judicial: a) objetivo; b) legitimidade ativa; c) requisitos; d) créditos abrangidos e exceções; e) meios para a obtenção da recuperação da empresa; f) pedido e processamento da recuperação judicial; g) plano de recuperação judicial; h) consolidação processual e patrimonial/substancial; i) plano alternativo; j) concessão da recuperação e seus efeitos; k) encerramento da recuperação."},{"id":"tjsc:empresarial:7.4","n":"7.4","lvl":1,"t":"Recuperação judicial das Microempresas e Empresas de Pequeno Porte: plano especial. Conteúdo e aprovação."},{"id":"tjsc:empresarial:7.5","n":"7.5","lvl":1,"t":"Recuperação extrajudicial."},{"id":"tjsc:empresarial:7.6","n":"7.6","lvl":1,"t":"Convolação da recuperação judicial em falência."},{"id":"tjsc:empresarial:7.7","n":"7.7","lvl":1,"t":"Falência: a) objetivo; b) juízo universal; c) habilitação e verificação dos créditos; d) classificação dos créditos e ordem de preferência; e) incidente de classificação de créditos de direito público."},{"id":"tjsc:empresarial:7.8","n":"7.8","lvl":1,"t":"Procedimento pré-falimentar e decretação da falência; a) direitos e deveres do falido; b) autofalência; c) efeitos da decretação da falência sobre as obrigações do devedor; suas obrigações, bens, contratos e atos praticados antes da falência; d) ações falimentares."},{"id":"tjsc:empresarial:7.9","n":"7.9","lvl":1,"t":"Crimes em espécie na falência, na recuperação judicial e na recuperação extrajudicial: a) competência; b) natureza da ação penal; c) procedimento penal; d) prescrição; e) efeitos da sentença condenatória; f) legitimação passiva; g) condição objetiva de punibilidade."}],"tributario":[{"id":"tjsc:tributario:1","n":"1","lvl":0,"t":"Sistema Tributário Nacional. Princípios gerais. Limitações constitucionais ao poder de tributar. Repartições de competência (impostos da União, Estados, Distrito Federal e Municípios na Constituição Federal de 1988). Repartição constitucional de receitas tributárias."},{"id":"tjsc:tributario:2","n":"2","lvl":0,"t":"Tributos. Conceito; definição e características; determinação da natureza jurídica específica do tributo; denominação e destino legal do produto da arrecadação. Tributos diretos e indiretos. Fiscalidade, extrafiscalidade e parafiscalidade."},{"id":"tjsc:tributario:3","n":"3","lvl":0,"t":"Espécies tributárias. Impostos; taxas; contribuição de melhoria; contribuições sociais; preço público; tarifa; pedágio."},{"id":"tjsc:tributario:4","n":"4","lvl":0,"t":"Competência tributária. Conceito, espécies e características. Competência tributária e capacidade tributária ativa. Limitações da competência tributária."},{"id":"tjsc:tributario:5","n":"5","lvl":0,"t":"Imunidades tributárias. Conceito; imunidades genéricas; imunidades específicas; outras imunidades."},{"id":"tjsc:tributario:6","n":"6","lvl":0,"t":"Normas gerais de direito tributário. Fontes do direito tributário e espécies normativas. Vigência, aplicação, interpretação e integração da legislação tributária."},{"id":"tjsc:tributario:7","n":"7","lvl":0,"t":"Norma jurídica tributária. Conceito. Classificação. A regra-matriz de incidência tributária: estrutura lógica; critérios da hipótese e da consequência."},{"id":"tjsc:tributario:8","n":"8","lvl":0,"t":"O “fato gerador” da obrigação tributária. Classificações dos “fatos geradores”. Efeitos do “fato gerador”. O “fato gerador” no âmbito do Código Tributário Nacional."},{"id":"tjsc:tributario:9","n":"9","lvl":0,"t":"Obrigação tributária. Obrigação tributária e deveres instrumentais ou formais. A obrigação tributária no âmbito do Código Tributário Nacional. Sujeito ativo e sujeito passivo da obrigação tributária. Solidariedade tributária. Capacidade tributária e domicílio tributário."},{"id":"tjsc:tributario:10","n":"10","lvl":0,"t":"Responsabilidade tributária. Responsabilidade de sucessores, responsabilidade de terceiros e responsabilidade por infrações. A substituição tributária."},{"id":"tjsc:tributario:11","n":"11","lvl":0,"t":"Constituição do crédito tributário. Lançamento tributário: conceito; natureza jurídica; atributos; alterabilidade; modalidades; revisão."},{"id":"tjsc:tributario:12","n":"12","lvl":0,"t":"Suspensão da exigibilidade do crédito tributário. Moratória; depósito do montante integral; reclamações e recursos administrativos; medida liminar em mandado de segurança; medida liminar ou tutela antecipada em outras espécies de ação judicial; parcelamento."},{"id":"tjsc:tributario:13","n":"13","lvl":0,"t":"Extinção do crédito tributário. Pagamento; consignação em pagamento; repetição do indébito tributário; pagamento antecipado e homologação do lançamento; dação em pagamento; compensação; transação; remissão; decadência; prescrição; conversão de depósito em renda; decisão administrativa irreformável; decisão judicial passada em julgado. Causas extintivas não previstas no Código Tributário Nacional."},{"id":"tjsc:tributario:14","n":"14","lvl":0,"t":"Exclusão do crédito tributário. Isenção e anistia."},{"id":"tjsc:tributario:15","n":"15","lvl":0,"t":"Infrações e sanções tributárias. Ilícitos administrativos tributários. Sanções tributárias."},{"id":"tjsc:tributario:16","n":"16","lvl":0,"t":"Garantias e privilégios do crédito tributário. Preferências."},{"id":"tjsc:tributario:17","n":"17","lvl":0,"t":"Administração tributária. Fiscalização; dívida ativa e protesto de certidão de dívida ativa; certidões negativas."},{"id":"tjsc:tributario:18","n":"18","lvl":0,"t":"Processo judicial tributário: execução fiscal; ação cautelar fiscal; ação declaratória; ação anulatória de lançamento; ação de consignação em pagamento; ação de repetição de indébito tributário; mandado de segurança."},{"id":"tjsc:tributario:19","n":"19","lvl":0,"t":"Impostos da União, dos Estados e dos Munícipios."},{"id":"tjsc:tributario:20","n":"20","lvl":0,"t":"Tributação internacional. Acordos para evitar a dupla tributação. Aspectos tributários da OMC, MERCOSUL, ALADI e ALCA. Incentivos fiscais. Legislação. Análise crítica do sistema e de seus reflexos no desenvolvimento do País. Evasão e elisão tributárias."},{"id":"tjsc:tributario:21","n":"21","lvl":0,"t":"Direito financeiro: sede constitucional, seu objeto e suas fontes. Normas gerais de direito financeiro e de direito tributário: autonomia científica e normativa. Atividade financeira do Estado: fundamentos financeiros, econômicos e jurídicos. Finalidades. Aspectos tributários das leis: de responsabilidade tributária, de diretrizes orçamentárias, de orçamento anual, Lei nº 4.320, de 1964, e suas alterações."},{"id":"tjsc:tributario:22","n":"22","lvl":0,"t":"Lei Complementar Estadual nte (FNMA). Licenciamento Ambiental. Sistema de Licenciamento."},{"id":"tjsc:ambiental:8","n":"8","lvl":0,"t":"Tipos de Licença (Licença Prévia, Licença de Instalação e Licença de Operação). Outorgas das Licenças. Licença Ambiental para fins específicos. Função e Natureza Jurídica do Estudo de Impacto Ambiental. Regime jurídico do licenciamento ambiental."},{"id":"tjsc:ambiental:9","n":"9","lvl":0,"t":"Conceito jurídico de impacto ambiental. Exigência Constitucional dos Estudos de Impacto Ambiental. O EIA na legislação nacional. Competência Legislativa sobre o EIA. Competência para exigir o EIA. Estados e Municípios. Competência do CONAMA para estabelecer as diretrizes sobre o EIA. Normas Gerais. Conteúdo do EIA. RIMA. Audiência Pública. As licitações e o EIA."},{"id":"tjsc:ambiental:10","n":"10","lvl":0,"t":"Conceito de Zoneamento Ambiental. Finalidade. Natureza jurídica. Zoneamento Ambiental Urbano. Zonas de Uso Industrial – ZUI. Zonas de Uso Estritamente Industrial – ZUEI. Zona de Uso Predominantemente Industrial – ZUPI. Zona de Uso Diversificado – ZUD. Zoneamento Ambiental Agrícola e Zoneamento Ambiental Costeiro. Zoneamento Ecológico-Econômico."},{"id":"tjsc:ambiental:11","n":"11","lvl":0,"t":"O Dano Ambiental. Apuração do Dano Ambiental. Reparação do Dano Ambiental. Responsabilidade Administrativa, Civil e Penal por danos ao Meio Ambiente. Infrações Administrativas Ambientais. Sanções para as infrações administrativas ambientais. O Poder de Polícia e Direito Ambiental. Regime jurídico das infrações penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente."},{"id":"tjsc:ambiental:12","n":"12","lvl":0,"t":"Meios processuais para a defesa ambiental. Ação Popular. Ação Civil Pública. Competência para o processamento e julgamento das ações civis públicas por danos ao meio ambiente. Legitimidade ativa. Mandado de Segurança Individual e Coletivo. Mandado de Injunção. Ação Direta de Inconstitucionalidade. Desapropriação. Tombamento. A tutel
