xos econômicos das decisões ambientais."}],"internacional":[{"id":"trf5:internacional:1","n":"1","lvl":0,"t":"Direito Internacional Público. Conceito e fontes. Tratados, costume, princípios gerais, atos unilaterais e atos de organizações internacionais. Jurisprudência e doutrina como meios auxiliares. Jus cogens. Obrigações erga omnes. Soft law. Princípios constitucionais das relações internacionais do Brasil."},{"id":"trf5:internacional:2","n":"2","lvl":0,"t":"Tratados internacionais. Capacidade e representação. Negociação, assinatura, ratificação, adesão e reservas. Entrada em vigor. Registro e publicidade. Aplicação, interpretação e efeitos. Validade. Conflito entre tratados. Emenda, suspensão, extinção e denúncia. Acordos executivos. Incorporação e hierarquia no Direito brasileiro."},{"id":"trf5:internacional:3","n":"3","lvl":0,"t":"Direito Internacional dos Direitos Humanos. Sistemas global e regional. Tratados e hierarquia. Controle de convencionalidade nacional e internacional. Diálogo entre jurisdições. Responsabilidade internacional do Estado. Cumprimento de decisões internacionais. Sistema interamericano: Comissão e Corte Interamericanas, medidas e reparações."},{"id":"trf5:internacional:4","n":"4","lvl":0,"t":"Sujeitos de Direito Internacional. Estado. Elementos, reconhecimento, autodeterminação e sucessão. Território terrestre, fluvial, marítimo e aéreo. Fronteiras. Organizações internacionais. Personalidade, competências, privilégios e imunidades. Organização das Nações Unidas."},{"id":"trf5:internacional:5","n":"5","lvl":0,"t":"Jurisdição internacional e imunidades. Territorialidade e extraterritorialidade. Jurisdição em ambientes digitais. Imunidade de jurisdição e de execução dos Estados e organizações internacionais. Relações diplomáticas e consulares. Imunidades de agentes diplomáticos, consulares e chefes de Estado e de governo."},{"id":"trf5:internacional:6","n":"6","lvl":0,"t":"Nacionalidade e condição jurídica das pessoas. Aquisição, perda e reaquisição. Múltipla nacionalidade. Apatridia. Estatuto de igualdade. Nacionalidade da pessoa jurídica."},{"id":"trf5:internacional:7","n":"7","lvl":0,"t":"Migração, asilo e refúgio. Ingresso, permanência e saída. Repatriação, deportação, expulsão e extradição. Asilo. Refúgio. Princípio do non-refoulement. Direitos de migrantes e refugiados. Autoridades e controle judicial."},{"id":"trf5:internacional:8","n":"8","lvl":0,"t":"Direito Internacional Privado. Fontes. Normas de conflito. Elementos de conexão. Qualificação. Questão prévia. Reenvio. Ordem pública. Fraude à lei. Direitos adquiridos. Aplicação e prova do direito estrangeiro. Estatuto pessoal. Obrigações, contratos e responsabilidade civil. Família e sucessões. Pessoas jurídicas estrangeiras."},{"id":"trf5:internacional:9","n":"9","lvl":0,"t":"Processo civil internacional e cooperação jurídica internacional. Jurisdição brasileira concorrente e exclusiva. Eleição de foro. Litispendência internacional. Auxílio direto. Cartas rogatórias. Homologação e execução de decisões estrangeiras. Prova e comunicações processuais. Autoridades centrais. Subtração internacional de crianças. Prestação internacional de alimentos."},{"id":"trf5:internacional:10","n":"10","lvl":0,"t":"Insolvência transnacional. Reconhecimento de processos estrangeiros. Cooperação entre tribunais e administradores. Coordenação de processos concorrentes. Credores estrangeiros."}],"humanistica":[{"id":"trf5:humanistica:A.1","n":"1","lvl":0,"sec":"A) Sociologia do Direito","t":"Sociologia do Direito e administração judiciária. Direito como fenômeno social. Funções sociais do sistema de justiça. Instituições e transformação social. Administração judiciária. Eficiência, eficácia e efetividade. Gestão de pessoas. Governança, planejamento e prestação jurisdicional."},{"id":"trf5:humanistica:A.2","n":"2","lvl":0,"sec":"A) Sociologia do Direito","t":"Relações sociais e relações jurídicas. Direito e mudança social. Controle social formal e informal. Institucionalização de conflitos. Desigualdades e acesso à justiça. Grupos sociais, instituições e pluralismo jurídico."},{"id":"trf5:humanistica:A.3","n":"3","lvl":0,"sec":"A) Sociologia do Direito","t":"Direito, comunicação social e opinião pública. Poder Judiciário, mídia e redes sociais. Comunicação institucional. Transparência, legitimidade, liberdade de expressão e exposição pública."},{"id":"trf5:humanistica:A.4","n":"4","lvl":0,"sec":"A) Sociologia do Direito","t":"Conflitos sociais e mecanismos de solução. Perspectivas sociológicas do conflito. Judicialização. Métodos estatais e não estatais de solução de disputas. Negociação, conciliação, mediação, arbitragem e justiça restaurativa. Sistema multiportas. Litígios individuais, coletivos, repetitivos, estruturais e de massa."},{"id":"trf5:humanistica:B.1","n":"1","lvl":0,"sec":"B) Psicologia Judiciária","t":"Psicologia aplicada à atividade judicial. Comunicação e relacionamento interpessoal. Comunicação verbal e não verbal. Escuta ativa. Relações do magistrado com partes, advogados, membros das instituições, servidores, sociedade e mídia. Comunicação com pessoas em situação de vulnerabilidade."},{"id":"trf5:humanistica:B.2","n":"2","lvl":0,"sec":"B) Psicologia Judiciária","t":"Psicologia do trabalho e comportamento organizacional. Assédio moral e sexual. Discriminação. Violência institucional. Relações de poder. Saúde mental e riscos psicossociais. Gestão de conflitos."},{"id":"trf5:humanistica:B.3","n":"3","lvl":0,"sec":"B) Psicologia Judiciária","t":"Psicologia do conflito e dos métodos consensuais. Teorias do conflito. Negociação, conciliação e mediação. Técnicas de comunicação. Percepção, emoção e tomada de decisão. Justiça restaurativa."},{"id":"trf5:humanistica:B.4","n":"4","lvl":0,"sec":"B) Psicologia Judiciária","t":"Psicologia do testemunho e da decisão. Memória, percepção, sugestibilidade e falsas memórias. Reconhecimento de pessoas. Comportamento de partes e testemunhas. Credibilidade. Entrevistas. Heurísticas e vieses na tomada de decisão judicial."},{"id":"trf5:humanistica:C.1","n":"1","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Regime jurídico da magistratura nacional. Garantias constitucionais. Independência e imparcialidade. Ingresso. Vitaliciamento. Promoção, remoção e permuta. Afastamentos. Convocação e substituição. Aposentadoria. Prerrogativas e incompatibilidades."},{"id":"trf5:humanistica:C.2","n":"2","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Direitos, deveres e proibições. Conduta judicial e extrajudicial. Urbanidade, prudência, integridade, independência, imparcialidade, transparência e reserva. Relações com partes, advogados, Ministério Público, Defensoria Pública, servidores, imprensa e sociedade."},{"id":"trf5:humanistica:C.3","n":"3","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Ética judicial. Valores e deveres éticos. Independência, imparcialidade, integridade, diligência, dedicação, cortesia, prudência, transparência, sigilo, conhecimento e capacitação. Conflitos de interesse. Aparência de imparcialidade. Redes sociais e exposição pública."},{"id":"trf5:humanistica:C.4","n":"4","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Responsabilidade e disciplina da magistratura. Responsabilidade administrativa, civil e penal. Infrações disciplinares. Processo administrativo disciplinar. Garantias. Competências correicionais. Sanções e prescrição."},{"id":"trf5:humanistica:C.5","n":"5","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Controle e governança do Poder Judiciário. Corregedorias, ouvidorias, conselhos superiores e Conselho Nacional de Justiça. Controle administrativo e disciplinar. Planejamento estratégico. Governança, gestão, integridade, riscos, transparência e prestação de contas."},{"id":"trf5:humanistica:D.1","n":"1","lvl":0,"sec":"D) Filosofia do Direito","t":"Justiça e Direito. Teorias da justiça. Justiça distributiva, corretiva e procedimental. Igualdade, equidade, liberdade, dignidade e bem comum."},{"id":"trf5:humanistica:D.2","n":"2","lvl":0,"sec":"D) Filosofia do Direito","t":"Direito, moral e validade. Jusnaturalismo, positivismo e pós-positivismo. Regras, princípios e valores. Validade, vigência, eficácia, efetividade e legitimidade. Equidade."},{"id":"trf5:humanistica:D.3","n":"3","lvl":0,"sec":"D) Filosofia do Direito","t":"Hermenêutica e interpretação. Linguagem. Argumentação. Texto, norma e contexto. Métodos interpretativos. Razoabilidade, proporcionalidade, coerência e integridade. Limites da interpretação."},{"id":"trf5:humanistica:D.4","n":"4","lvl":0,"sec":"D) Filosofia do Direito","t":"Teorias da decisão judicial. Raciocínio jurídico. Discricionariedade. Precedentes. Consequencialismo. Pragmatismo. Argumentação jurídica. Razões jurídicas, morais e institucionais."},{"id":"trf5:humanistica:E.1","n":"1","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Teoria Geral do Direito. Direito objetivo e subjetivo. Norma jurídica. Estrutura, validade, vigência, eficácia e efetividade. Relação jurídica. Sujeitos, objeto, fatos e situações jurídicas."},{"id":"trf5:humanistica:E.2","n":"2","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Fontes do Direito. Fontes formais e materiais. Constituição, legislação, costumes, princípios e precedentes. Doutrina como elemento de compreensão do Direito. Integração. Lacunas. Antinomias e critérios de solução."},{"id":"trf5:humanistica:E.3","n":"3","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Eficácia das normas no tempo e no espaço. Direito intertemporal. Irretroatividade e retroatividade. Direito adquirido, ato jurídico perfeito e coisa julgada. Conflitos temporais nos diversos ramos do Direito."},{"id":"trf5:humanistica:E.4","n":"4","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Teoria do ordenamento jurídico. Unidade, coerência e completude. Hierarquia. Regras e princípios. Conflitos normativos. Constitucionalização. Segurança jurídica e proteção da confiança."},{"id":"trf5:humanistica:E.5","n":"5","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Normas gerais de interpretação e aplicação do Direito. Segurança jurídica. Proteção da confiança. Consequências práticas das decisões. Consideração dos obstáculos e dificuldades reais da gestão pública e das exigências das políticas públicas. Motivação das decisões administrativas, controladoras e judiciais. Regime de transição na imposição de novos deveres ou condicionamentos. Orientações gerais. Precedentes administrativos. Compromissos destinados à eliminação de irregularidade, incerteza jurídica ou situação contenciosa. Responsabilidade do agente público por decisões ou opiniões técnicas."},{"id":"trf5:humanistica:E.6","n":"6","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Teoria política. Política, poder, autoridade, legitimidade e soberania. Estado e organização política. Democracia, representação, participação e Estado de Direito. Relações entre Direito, política e instituições."},{"id":"trf5:humanistica:E.7","n":"7","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Ideologias e correntes políticas. Liberalismo, conservadorismo, socialismo, social-democracia, nacionalismo, comunitarismo e pluralismo político. Transformações contemporâneas da democracia."},{"id":"trf5:humanistica:E.8","n":"8","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Direitos humanos, desenvolvimento e instituições. Declaração Universal dos Direitos Humanos. Universalidade, indivisibilidade e interdependência. Desenvolvimento sustentável. Agenda 2030 e Objetivos de Desenvolvimento Sustentável. Aplicação no Poder Judiciário e em políticas públicas."},{"id":"trf5:humanistica:F.1","n":"1","lvl":0,"sec":"F) Direito Digital","t":"Transformação digital e Poder Judiciário. Sociedade da informação. Governo digital. Processo judicial eletrônico. Atos processuais eletrônicos. Interoperabilidade de sistemas. Coleta, tratamento e compartilhamento de dados na atividade jurisdicional. Automação. Audiências virtuais e híbridas. Prestação jurisdicional remota. Ciência de dados e jurimetria."},{"id":"trf5:humanistica:F.2","n":"2","lvl":0,"sec":"F) Direito Digital","t":"Inteligência artificial e Direito. Algoritmos, aprendizado de máquina e inteligência artificial generativa. Uso pelo Poder Público e pelo Judiciário. Transparência, explicabilidade, auditabilidade, supervisão humana, segurança, governança e responsabilização. Discriminação algorítmica e vieses. Direitos fundamentais. Uso ético e responsável."},{"id":"trf5:humanistica:F.3","n":"3","lvl":0,"sec":"F) Direito Digital","t":"Proteção de dados pessoais. Princípios. Dados pessoais e sensíveis. Tratamento e bases jurídicas. Direitos dos titulares. Agentes de tratamento. Segurança e incidentes. Compartilhamento pelo Poder Público. Tratamento pelo Poder Judiciário. Responsabilidade e fiscalização."},{"id":"trf5:humanistica:F.4","n":"4","lvl":0,"sec":"F) Direito Digital","t":"Cibersegurança e cibercriminalidade. Segurança da informação. Ameaças, vulnerabilidades e incidentes. Deep web e dark web. Rastreabilidade digital. Prova digital. Preservação, integridade e cadeia de custódia. Criptografia, criptoativos e ativos virtuais. Lavagem de dinheiro em ambiente digital."},{"id":"trf5:humanistica:F.5","n":"5","lvl":0,"sec":"F) Direito Digital","t":"Relações jurídicas digitais. Contratos eletrônicos. Assinaturas e documentos eletrônicos. Blockchain e tecnologias de registro distribuído. Smart contracts. Plataformas digitais. Identidade digital e ativos digitais. Relações intermediadas por algoritmos."},{"id":"trf5:humanistica:F.6","n":"6","lvl":0,"sec":"F) Direito Digital","t":"Direitos fundamentais no ambiente digital. Liberdade de expressão. Privacidade, proteção de dados, honra, imagem e identidade. Direito à informação. Desinformação. Plataformas e moderação de conteúdo. Responsabilidade civil. Proteção de crianças e adolescentes."},{"id":"trf5:humanistica:F.7","n":"7","lvl":0,"sec":"F) Direito Digital","t":"Inteligência artificial generativa na atividade jurídica. Geração e revisão de textos. Pesquisa jurídica. Alucinações, vieses, opacidade e uso indevido de dados. Dever de verificação. Confidencialidade. Dados processuais e pessoais. Responsabilidade profissional e institucional."},{"id":"trf5:humanistica:G.1","n":"1","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Pragmatismo jurídico e decisão judicial. Pragmatismo. Contextualismo. Consequencialismo. Racionalismo e empirismo. Utilitarismo. Relação entre normas, fatos e consequências. Consideração das consequências práticas das decisões. Limites do consequencialismo judicial."},{"id":"trf5:humanistica:G.2","n":"2","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Análise Econômica do Direito. Fundamentos e conceitos. Racionalidade econômica. Incentivos. Eficiência. Custos de transação. Externalidades. Assimetria de informação. Risco moral. Seleção adversa. Bens públicos. Falhas de mercado e de governo. Direitos de propriedade. Responsabilidade civil, contratos, regulação e processo sob perspectiva econômica."},{"id":"trf5:humanistica:G.3","n":"3","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Análise econômica do processo. Custos da litigância. Acesso à justiça. Incentivos à litigância e ao acordo. Demandas frívolas e de valor esperado negativo. Litigância repetitiva e de massa. Métodos adequados de solução de conflitos. Eficiência processual. Precedentes, estabilidade, previsibilidade e segurança jurídica. Coisa julgada e incentivos institucionais."},{"id":"trf5:humanistica:G.4","n":"4","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Economia comportamental. Racionalidade limitada. Heurísticas e vieses cognitivos. Ancoragem. Disponibilidade. Representatividade. Aversão à perda. Excesso de confiança. Efeito de enquadramento. Preferências intertemporais. Arquitetura de escolhas. Nudges. Tomada de decisão individual e institucional."},{"id":"trf5:humanistica:G.5","n":"5","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Governança, integridade e comportamento organizacional. Governança corporativa. Compliance. Programas de integridade. Incentivos organizacionais. Cultura institucional. Prevenção de ilícitos. Mecanismos de detecção e denúncia. Proteção do denunciante. Relações entre governança, integridade, prevenção à corrupção e criminalidade econômica."},{"id":"trf5:humanistica:H.1","n":"1","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Direito da Antidiscriminação. Fundamentos constitucionais e internacionais. Igualdade formal, igualdade material e igualdade como reconhecimento. Dignidade da pessoa humana. Princípio da não discriminação. Vulnerabilidade, estigmatização, exclusão e subordinação."},{"id":"trf5:humanistica:H.2","n":"2","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Discriminação direta e indireta. Intencional e não intencional. Institucional e estrutural. Discriminação múltipla, interseccional e por associação. Impacto desproporcional. Assédio discriminatório. Segregação."},{"id":"trf5:humanistica:H.3","n":"3","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Critérios e grupos protegidos. Raça, cor, etnia, origem, nacionalidade, sexo, gênero, orientação sexual, identidade de gênero, idade, deficiência, religião, convicção, condição socioeconômica e outros fatores juridicamente relevantes. Racismo e discriminação racial. Sexismo. Intolerância religiosa. Discriminação contra pessoas LGBTQIA+, pessoas com deficiência, pessoas idosas, povos indígenas, quilombolas, comunidades tradicionais, migrantes e refugiados."},{"id":"trf5:humanistica:H.4","n":"4","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Gênero e patriarcado. Gênero e raça. Discriminação e desigualdades de gênero. Interseccionalidade. Violência de gênero. Protocolo para julgamento com perspectiva de gênero. Perspectivas racial e de outras vulnerabilidades."},{"id":"trf5:humanistica:H.5","n":"5","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Ações afirmativas. Fundamentos, finalidades e espécies. Reserva de vagas. Igualdade de oportunidades. Medidas especiais de promoção da igualdade. Proporcionalidade e controle das ações afirmativas."},{"id":"trf5:humanistica:H.6","n":"6","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Acessibilidade e inclusão. Pessoa com deficiência. Modelo social da deficiência. Barreiras físicas, comunicacionais, tecnológicas, atitudinais e institucionais. Adaptação razoável. Desenho universal. Capacidade jurídica. Participação e acesso à justiça."},{"id":"trf5:humanistica:H.7","n":"7","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Direito da Antidiscriminação e atividade judicial. Vieses explícitos e implícitos. Estereótipos. Produção e valoração da prova em contextos discriminatórios. Distribuição dinâmica do ônus probatório. Tutela individual e coletiva. Reparação e medidas estruturais."},{"id":"trf5:humanistica:H.8","n":"8","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Proteção nacional e internacional contra a discriminação. Sistemas de direitos humanos. Controle de convencionalidade. Deveres estatais de prevenção, investigação, repressão e reparação. Políticas públicas de promoção da igualdade. Discurso de ódio e limites da liberdade de expressão. Discriminação online e algorítmica."}],"dh":[{"id":"trf5:dh:1","n":"1","lvl":0,"t":"Direitos Humanos. Conceito, características, universalidade, indivisibilidade, interdependência e interpretação. Jus cogens. Obrigações erga omnes. Proibição de retrocesso. Dignidade, igualdade e não discriminação."},{"id":"trf5:dh:2","n":"2","lvl":0,"t":"Tratados de direitos humanos no Brasil. Incorporação e hierarquia. Bloco de constitucionalidade. Mecanismos de implementação das decisões internacionais. Controle de convencionalidade. Diálogo entre cortes. Dever de observância dos tratados e da jurisprudência internacional pertinente. Jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos."},{"id":"trf5:dh:3","n":"3","lvl":0,"t":"Sistema universal de direitos humanos. Declaração Universal. Pactos internacionais de direitos civis, políticos, econômicos, sociais e culturais e protocolos. Conselho de Direitos Humanos. Revisão periódica universal. Comitês de tratados, relatores e mecanismos especiais. Comentários e observações gerais."},{"id":"trf5:dh:4","n":"4","lvl":0,"t":"Sistema Interamericano de Direitos Humanos. Carta da Organização dos Estados Americanos. Declaração Americana dos Direitos e Deveres Humanos. Convenção Americana sobre Direitos Humanos. Comissão Interamericana de Direitos Humanos. Corte Interamericana de Direitos Humanos. Competência contenciosa e consultiva. Medidas cautelares e provisórias. Sentenças, reparações, supervisão e execução no Brasil."},{"id":"trf5:dh:5","n":"5","lvl":0,"t":"Direitos dos povos indígenas, quilombolas e comunidades tradicionais. Autodeterminação e identidade. Direitos territoriais e culturais. Consulta prévia, livre e informada. Proteção internacional da diversidade cultural. Sistemas de proteção e monitoramento."},{"id":"trf5:dh:6","n":"6","lvl":0,"t":"Direitos das pessoas com deficiência. Convenções internacionais. Modelo social e de direitos humanos da deficiência. Acessibilidade. Adaptação razoável. Capacidade jurídica. Vida independente. Sistemas de proteção e monitoramento."},{"id":"trf5:dh:7","n":"7","lvl":0,"t":"Direitos das mulheres. Igualdade de gênero. Prevenção e enfrentamento da violência contra a mulher. Discriminação. Convenções universais e interamericanas. Sistemas de proteção e monitoramento. Julgamento com perspectiva de gênero."},{"id":"trf5:dh:8","n":"8","lvl":0,"t":"Proibição de discriminação. Racismo e discriminação racial. Intolerância. Orientação sexual e identidade de gênero. Proteção internacional. Interseccionalidade. Sistemas de proteção e monitoramento."},{"id":"trf5:dh:9","n":"9","lvl":0,"t":"Direitos econômicos, sociais, culturais e ambientais. Justiciabilidade. Pacto internacional e sistema interamericano. Direito à saúde, educação, trabalho, moradia, alimentação, água, meio ambiente e cultura. Sistemas de proteção e monitoramento."},{"id":"trf5:dh:10","n":"10","lvl":0,"t":"Proibição da tortura e direito à integridade pessoal. Instrumentos universais e interamericanos. Prevenção da tortura. Investigação eficaz de tortura, maus-tratos e mortes potencialmente ilícitas. Uso da força por agentes estatais."},{"id":"trf5:dh:11","n":"11","lvl":0,"t":"Direitos de refugiados, migrantes e apátridas. Proteção internacional. Non-refoulement. Migração segura, ordenada e regular. Crianças e adolescentes migrantes. Sistemas de proteção e monitoramento."},{"id":"trf5:dh:12","n":"12","lvl":0,"t":"Tribunal Penal Internacional. Evolução histórica. Competência. Princípios. Crimes internacionais. Procedimento. Cooperação e entrega."}]},"vistas":{"execucao":["trf5:ppenal:14","trf5:penal:7"],"lpe":["trf5:penal:10","trf5:penal:11"]}},{"id":"tjrs","sigla":"TJRS","nome":"Tribunal de Justiça do Rio Grande do Sul — Edital 31/2026-DMAG","cor":"#2f4f8f","pontos":{"lp":[{"id":"tjrs:lp:1","n":"1","lvl":0,"t":"Ortografia."},{"id":"tjrs:lp:1.1","n":"1.1","lvl":1,"t":"Sistema oficial vigente (emprego de letras, acentuação, hífen)."},{"id":"tjrs:lp:2","n":"2","lvl":0,"t":"Morfologia."},{"id":"tjrs:lp:2.1","n":"2.1","lvl":1,"t":"Classes de palavras e suas características morfológicas."},{"id":"tjrs:lp:2.2","n":"2.2","lvl":1,"t":"Flexão nominal: padrões regulares e formas irregulares."},{"id":"tjrs:lp:2.3","n":"2.3","lvl":1,"t":"Flexão verbal: padrões regulares e formas irregulares."},{"id":"tjrs:lp:3","n":"3","lvl":0,"t":"Sintaxe."},{"id":"tjrs:lp:3.1","n":"3.1","lvl":1,"t":"A oração e seus termos."},{"id":"tjrs:lp:3.1.1","n":"3.1.1","lvl":2,"t":"Emprego das classes de palavras."},{"id":"tjrs:lp:3.1.2","n":"3.1.2","lvl":2,"t":"Regência nominal e verbal."},{"id":"tjrs:lp:3.1.3","n":"3.1.3","lvl":2,"t":"Concordância nominal e verbal."},{"id":"tjrs:lp:3.2","n":"3.2","lvl":1,"t":"O período e sua construção."},{"id":"tjrs:lp:3.2.1","n":"3.2.1","lvl":2,"t":"Período simples e período composto."},{"id":"tjrs:lp:3.2.2","n":"3.2.2","lvl":2,"t":"Coordenação: processos, formas e seus sentidos."},{"id":"tjrs:lp:3.2.3","n":"3.2.3","lvl":2,"t":"Subordinação: processos, formas e seus sentidos."},{"id":"tjrs:lp:3.3","n":"3.3","lvl":1,"t":"Equivalência entre estruturas; transformação de estruturas."},{"id":"tjrs:lp:3.4","n":"3.4","lvl":1,"t":"Discurso direto, indireto e indireto livre."},{"id":"tjrs:lp:4","n":"4","lvl":0,"t":"Pontuação: sinais, seus empregos e seus efeitos de sentido."},{"id":"tjrs:lp:5","n":"5","lvl":0,"t":"Semântica."},{"id":"tjrs:lp:5.1","n":"5.1","lvl":1,"t":"Significação de palavras e expressões. Relações semânticas entre palavras e expressões (sinonímia, antonímia, hiponímia, homonímia, polissemia); campos semânticos."},{"id":"tjrs:lp:5.2","n":"5.2","lvl":1,"t":"Significação contextual das expressões; significados literais e significados figurados; denotação e conotação das expressões."},{"id":"tjrs:lp:5.3","n":"5.3","lvl":1,"t":"Relações semânticas, lógicas e enunciativas entre frases."},{"id":"tjrs:lp:5.4","n":"5.4","lvl":1,"t":"Valores semânticos das classes de palavras."},{"id":"tjrs:lp:5.5","n":"5.5","lvl":1,"t":"Valores dos tempos, modos e vozes verbais."},{"id":"tjrs:lp:5.6","n":"5.6","lvl":1,"t":"Efeitos de sentido da ordem de expressões na oração e no período."},{"id":"tjrs:lp:6","n":"6","lvl":0,"t":"Leitura, análise e interpretação de texto."},{"id":"tjrs:lp:6.1","n":"6.1","lvl":1,"t":"Variedades de linguagem, tipos e gêneros textuais, e adequação de linguagem."},{"id":"tjrs:lp:6.2","n":"6.2","lvl":1,"t":"Elementos de sentido do texto: coerência e progressão semântica do texto; relações contextuais entre segmentos de um texto; informações explícitas, inferências válidas, pressupostos e subentendidos na leitura do texto."},{"id":"tjrs:lp:6.3","n":"6.3","lvl":1,"t":"Elementos de estruturação do texto: recursos de coesão; função referencial de pronomes; uso de nexos para estabelecer relações entre segmentos do texto; segmentação do texto em parágrafos e sua organização temática."},{"id":"tjrs:lp:6.4","n":"6.4","lvl":1,"t":"Interpretação do texto: identificação do sentido global de um texto; identificação de seus principais tópicos e de suas relações (estrutura argumentativa); síntese do texto; adaptação e reestruturação do texto para novos fins retóricos"}],"civil":[{"id":"tjrs:civil:1","n":"1","lvl":0,"t":"Lei de Introdução às normas do Direito brasileiro."},{"id":"tjrs:civil:2","n":"2","lvl":0,"t":"Sistema do Código Civil. Princípios gerais do Direito. Unidade sistemática e pluralidade de fontes. Constitucionalização do Direito Civil. Direitos fundamentais e relações privadas."},{"id":"tjrs:civil:3","n":"3","lvl":0,"t":"Direito subjetivo. Direito potestativo. Faculdade jurídica. Direitos imprescritíveis. Relação jurídica e situações jurídicas. Situações subjetivas existenciais e situações subjetivas patrimoniais."},{"id":"tjrs:civil:4","n":"4","lvl":0,"t":"Das Pessoas Naturais. Da Personalidade e da Capacidade. Dos Direitos de Personalidade. Da Ausência. Do Domicílio. Liberdade, autonomia e novas tecnologias."},{"id":"tjrs:civil:5","n":"5","lvl":0,"t":"Das Pessoas Jurídicas. Disposições Gerais. Conceito e Elementos Caracterizadores. Personalidade jurídica da pessoa jurídica. Constituição. Classificação. Extinção. Das Associações. Das Fundações. Sociedades. Entidades sem personificação jurídica e novos sujeitos de direito. Desconsideração da personalidade jurídica. Responsabilidade civil da pessoa jurídica e dos sócios."},{"id":"tjrs:civil:6","n":"6","lvl":0,"t":"Dos bens. Dos bens considerados em si mesmos. Dos bens reciprocamente considerados. Dos bens públicos."},{"id":"tjrs:civil:7","n":"7","lvl":0,"t":"Dos Fatos Jurídicos. Do Negócio Jurídico. Teoria Geral do negócio jurídico. Negócios jurídicos: conceito, pressupostos e elementos de existência, requisitos de validade; classificações. Da representação. Dos Elementos acidentais. Inexistência, invalidade e ineficácia. Interpretação dos atos e negócios jurídicos. Dos Defeitos dos negócios jurídicos. Erro. Dolo. Coação. Estado de perigo. Lesão. Fraude contra credores. Invalidade do negócio jurídico. Negócio nulo. Condições de nulidade. Simulação. Negócio anulável. Condições de anulabilidade. Convalidação. Requisitos. Prova dos fatos jurídicos. Interesse público e estrutura do negócio jurídico. A função negocial nas relações jurídicas contemporâneas."},{"id":"tjrs:civil:8","n":"8","lvl":0,"t":"Dos atos jurídicos lícitos e dos atos jurídicos ilícitos. Requisitos de configuração do ato ilícito. Excludentes do ato ilícito."},{"id":"tjrs:civil:9","n":"9","lvl":0,"t":"Prescrição e decadência. Regime jurídico do Código Civil. Disposições gerais. Prescrição. Exceção, renúncia, oportunidade de alegação, reconhecimento ex officio e iniciativa do interessado. Interrupção e suspensão da prescrição. Fato com origem criminal. Termo legal da prescrição. Solidariedade. Aproveitamento da prescrição. Condições. Prazos de prescrição. Decadência Legal e convencional. Renúncia. Prazos de decadência."},{"id":"tjrs:civil:10","n":"10","lvl":0,"t":"Da prova"},{"id":"tjrs:civil:11","n":"11","lvl":0,"t":"Das Obrigações. Características. Elementos. Princípios. Boa-fé. Modalidades das obrigações. Obrigação complexa (a obrigação como um processo). Obrigações de dar. Obrigações de fazer e de não fazer. Obrigação natural. Obrigações alternativas e facultativas. Obrigações divisíveis e indivisíveis. Obrigações solidárias. Obrigações civis e naturais, de meio, de resultado e de garantia. Obrigações de execução instantânea, diferida e continuada. Obrigações puras e simples, condicionais, a termo e modais. Obrigações propter rem. Obrigações líquidas e ilíquidas. Obrigações principais e acessórias. Da Transmissão das obrigações. Cessão de Crédito. Assunção de dívida. Cessão de posição contratual. Do Adimplemento e Extinção das obrigações. Do Pagamento. Quem deve pagar e daqueles a quem se deve pagar. Objeto do pagamento e sua prova. Lugar e tempo do pagamento. Pagamentos especiais. Pagamento por consignação e com sub-rogação. Imputação do pagamento. Dação em pagamento. Extinção da obrigação sem pagamento: novação, compensação, confusão e remissão. Inadimplemento. Disposições gerais. Mora e inadimplemento absoluto: caracterização, distinção e efeitos. Adimplemento substancial. Inadimplemento antecipado. Violação positiva do contrato. Perdas e danos. Juros legais, convencionais e atualização monetária, inclusive à luz da Lei nº 14.905/2024. Honorários de advogado. Excludentes de responsabilidade. Cláusula penal. Arras. Preferências e privilégios creditórios."},{"id":"tjrs:civil:12","n":"12","lvl":0,"t":"Contratos em geral. Teoria geral dos negócios jurídicos e dos contratos. Negócios jurídicos unilaterais, bilaterais e plurilaterais. Conceito, elementos e características. Princípios do direito contratual. Cláusulas gerais. Autonomia da vontade. Força obrigatória dos contratos. Função social do contrato. Equilíbrio econômico contratual, onerosidade excessiva. Boa-fé objetiva e suas funções. Interpretação e qualificação dos contratos. Intervenção do Estado e a função social do contrato. Contrato e propriedade. Pós-eficácia contratual. Lei de Liberdade Econômica (Lei nº 13.874/2019). Classificação dos contratos. Contrato preliminar e contratos aleatórios. Contratos coligados. Formação dos contratos. Formação progressiva dos contratos. Elementos constitutivos, pressupostos de validade e fatores de eficácia dos contratos. Contratos e terceiros. Estipulação em favor de terceiro. Promessa de fato de terceiro. Contrato com pessoa a declarar. Cessão da posição contratual e subcontrato. Vícios redibitórios. Evicção. Extinção dos contratos. Distrato e resilição unilateral. Resolução por inadimplemento. Cláusulas resolutivas tácita e expressa. Exceção do contrato não cumprido. Revisão contratual. Teorias subjetivas e objetivas. Imprevisão. Resolução por onerosidade excessiva. Teoria da quebra da base do negócio jurídico. Revisão do contrato e suas modalidades. Frustração do contrato. Classificação dos contratos: unilaterais e bilaterais; típicos, atípicos e mistos; consensuais e reais; gratuitos e onerosos; cumulativos e aleatórios; contratos solenes e não solenes; contratos personalíssimos; contratos preliminares. Contrato com pessoa a nomear. Gestão de negócios."},{"id":"tjrs:civil:13","n":"13","lvl":0,"t":"Contratos em espécie (típicos): Compra e venda. Modalidades especiais da compra e venda. Troca ou permuta. Contrato estimatório. Compromisso de compra e venda. Doação. Disposições gerais. Invalidade. Revogação. Locação de coisas. Empréstimo. Comodato. Mútuo. Prestação de serviço. Empreitada. Depósito. Mandato. Comissão. Agência e Distribuição. Corretagem. Transporte. Seguro. Disposições gerais. Seguro de dano e seguro de pessoa. Seguro de responsabilidade civil. Contratos referentes a planos e seguros privados de assistência à saúde. Mora em contratos de seguro. Constituição de renda. Do jogo e da aposta. Fiança. Transação. Compromisso. Contrato de administração fiduciária de garantias. Contratos atípicos. Contratos agrários. Parceria e arrendamento. Leis extravagantes."},{"id":"tjrs:civil:14","n":"14","lvl":0,"t":"Atos unilaterais. Promessa de recompensa. Gestão de negócios. Pagamento indevido. Enriquecimento sem causa."},{"id":"tjrs:civil:15","n":"15","lvl":0,"t":"Responsabilidade civil e da obrigação de indenizar. Do novo direito de danos e os reflexos na imputação e no nexo causal. Responsabilidade civil. Princípios da solidariedade, prevenção e reparação integral do dano. Teorias subjetiva e objetiva. Boa-fé objetiva e responsabilidade civil. Responsabilidade pré e pós contratual. Função social e responsabilidade civil. O terceiro ofensor e o terceiro ofendido. Funções da responsabilidade civil. Modalidades de responsabilidade civil. Responsabilidade civil e penal, e sua interferência. Responsabilidade contratual e aquiliana. Elementos da responsabilidade civil. O ilícito. A culpa. O risco. Modalidades de risco. Dano. Dano material e dano moral. Dano estético. Dano à imagem. Perda de uma chance. Liquidação do dano. Nexo causal e suas teorias. Excludentes de responsabilidade civil. Caso fortuito e força maior. Cláusula de não indenizar. Fato de terceiro. Fato exclusivo e concorrente da vítima. Excludentes de ilicitude civil. Responsabilidade civil por ato lícito. Responsabilidade civil por fato próprio e por fato de terceiro. Responsabilidade por fato da coisa. Responsabilidade civil da área médica e dos profissionais liberais. Responsabilidade civil digital. Marco civil da Internet. Responsabilidade dos incorporadores e construtores."},{"id":"tjrs:civil:16","n":"16","lvl":0,"t":"Posse. Conceito e classificação. Detenção. Modos de Aquisição e Perda. Efeitos da posse. Posse justa, violenta, clandestina e precária. Posse de boa-fé. Constituto possessório. Aquisição, efeitos, desforço próprio. Direitos do possuidor de boa-fé. Obrigações e direitos do possuidor de má-fé. Exceptio proprietatis. Proteção possessória: dos interditos proibitórios. Reintegração de posse. Manutenção de posse. Interdito proibitório. Proteção da posse: ação de imissão na posse, ação de nunciação de obra nova, embargos de terceiro. Percepção de frutos pelo possuidor. Responsabilização do possuidor pela perda ou deterioração da coisa. Indenização por benfeitorias. Perda da posse. Posse coletiva. Resolução nº 510, de 26 de junho de 2023, do CNJ."},{"id":"tjrs:civil:17","n":"17","lvl":0,"t":"Direitos reais. Disposições gerais. Da Propriedade. Da propriedade em geral. Função social da propriedade. Fundamentos do direito de propriedade. Natureza jurídica do direito de propriedade. Limitações ao direito de propriedade. Extensão vertical da propriedade imóvel. Direito real de laje. Os direitos oriundos da imissão provisória na posse, quando concedida à União, aos Estados, ao Distrito Federal, aos Municípios ou às suas entidades delegadas e a respectiva cessão e promessa de cessão. Da Aquisição da propriedade imóvel. Da usucapião. Usucapião extraordinária (CC, art. 1.238). Usucapião ordinária (CC, art. 1.242). Usucapião especial. Usucapião familiar. Usucapião indígena. Usucapião extrajudicial (CPC) e usucapião administrativa. Aquisição pelo registro. Retificação ou anulação do registro. Dos livros obrigatórios. Momento do registro, matrícula e averbação. Dos atos sujeitos a registro. Acessão. Da formação de ilhas. Aluvião. Avulsão. Álveo abandonado. Construções e plantações. Da Aquisição da propriedade móvel. Usucapião. Ocupação. Achado do tesouro. Tradição. Especificação. Confusão, Comissão e Adjunção. Perda da propriedade. Dos Direitos de vizinhança. Do Condomínio Geral. Do Condomínio edilício. Do condomínio em multipropriedade. Disposições Específicas Relativas às Unidades Autônomas de Condomínios Edilícios. Da propriedade resolúvel. Da propriedade fiduciária. Do fundo de investimento. Direito real de Superfície. Servidões. Usufruto. Uso. Habitação. Direito do promitente comprador."},{"id":"tjrs:civil:18","n":"18","lvl":0,"t":"Direitos reais de garantia. Características. Princípios. Penhor, hipoteca e anticrese."},{"id":"tjrs:civil:19","n":"19","lvl":0,"t":"Direito das famílias. Conceito e modalidades de família. Princípios do direito de família. Famílias paralelas. Direitos pessoais. Casamento. Formas, pressupostos, capacidade, impedimentos, causas suspensivas, habilitação, celebração, provas, nulidade, anulabilidade e eficácia. Dissolução do casamento. Dissolução da sociedade conjugal e do vínculo conjugal. Formas, causas, hipóteses de impossibilidade de vida em comum. Da proteção da pessoa dos filhos. Direito Parental. Relações de Parentesco. Paternidade e filiação. Paternidade post mortem. Filiação por reprodução assistida. Reconhecimento da paternidade voluntário e judicial. Filiação biológica e socioafetiva. Ação investigatória e negatória. Multiparentalidade. Danos morais nas relações familiares. Reconhecimento dos filhos, adoção, poder familiar e bem de família. Investigação de paternidade. Fundamentos biologistas e bases socioafetivas da filiação e do parentesco. Filiação matrimonial. Filiação havida fora do casamento. Posse de estado de filho. Filiação e descendência genética. Guarda compartilhada (Lei nº 13.058/2014). Direitos patrimoniais. Regimes de bens no casamento, usufruto e administração dos bens dos filhos menores. Alimentos. Conceito, abrangência, finalidade, pressupostos, critérios e características da obrigação. Bem de família. Da União Estável. Conceito, condições, impedimentos, deveres, causas suspensivas do casamento e a união estável, regime patrimonial. Concubinato. Conceito e reconhecimento judicial. Do casamento e da União Homoafetiva. Da Tutela, da Curatela e da Tomada de Decisão Apoiada."},{"id":"tjrs:civil:20","n":"20","lvl":0,"t":"Do Direito das Sucessões. Da sucessão em geral. Herança e administração. Vocação hereditária. Aceitação e renúncia. Exclusão da sucessão. Herança jacente. Petição de herança. Sucessão legítima. Ordem de vocação hereditária. Herdeiros necessários. Direito de representação. Sucessão testamentária. Testamento em geral. Capacidade de testar. Testamentos público, cerrado e particular. Codicilo. Legados e sua caducidade. Testamentos especiais. Direito de acrescer entre herdeiros e legatários. Substituições. Deserdação. Redução das disposições testamentárias. Revogação e rompimento do testamento. Inventário e partilha. Sonegados. Pagamento de dívidas. Colação de bens. Garantia dos quinhões hereditários. Anulação de partilha. Das disposições finais e transitórias do Código Civil Brasileiro, artigos 2.028 a 2.046. Direito Sucessório Digital e herança de ativos digitais intangíveis, inclusive ativos patrimoniais digitais, criptomoedas, milhas, contas e perfis digitais, acervos digitais e dados armazenados em serviços de nuvem, considerando os direitos sucessórios, a privacidade, a intimidade e os termos de serviço das plataformas."},{"id":"tjrs:civil:21","n":"21","lvl":0,"t":"Registros Públicos. Lei nº 6.015, de 31 de dezembro de 1973 (Provimento nº 149/2023 e nº 195/2025 do Conselho Nacional de Justiça). Natureza dos serviços. Delegação. Fé pública. Lei nº 8.935/94. Registro de imóveis. Princípios de regência do registro imobiliário. Atos sujeitos a registro. Averbações. Registro de Títulos e Documentos. Procedimento de dúvida. Atos sujeitos a registro. Sociedades religiosas e partidos políticos. Competência para registro dos atos constitutivos e estatutos. Registro Civil das Pessoas Naturais. Atos sujeitos a registro. Tabelionatos de Notas e Tabelionatos de Protestos Cambiais. Competência dos titulares."},{"id":"tjrs:civil:22","n":"22","lvl":0,"t":"Da alienação fiduciária (Decreto-Lei nº 911, de 01/10/1969). Lei nº 9.514, de 20/11/1997. Do condomínio em edificações e as incorporações imobiliárias (Lei nº 4.591, de 16/12/1964), Lei nº 10.931, de 02/08/2004. Direito Autoral (Lei nº 9.610, de 19/02/1998); Do Estatuto do Idoso (Lei nº 10.741, de 01/10/2003). Da locação de imóveis urbanos (Lei nº 8.245, de 18/10/1991). Estatuto da Pessoa com Deficiência (Lei nº 13.146, de 06/07/2015). Lei nº 14.382, de 27/06/2022. Regime Jurídico Emergencial e Transitório das relações jurídicas de Direito Privado (Lei nº 14.010, de 10/06/2020). Resolução CNJ nº 452, de 22/4/2022. Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709, de 14/08/2018). Marco Civil da Internet (Lei nº 12.965, de 23/04/2014). Lei Federal de Parcelamento do Solo Urbano (Lei nº 6.766, de 19/12/1979). Convenção sobre a Cobrança Internacional de Alimentos para Crianças e outros membros da família (Decreto nº 9.176, de 19/10/2017). Convenção sobre os Aspectos Civis do Sequestro Internacional de Crianças (Decreto nº 3.413, de 14/04/2000)"},{"id":"tjrs:civil:23","n":"23","lvl":0,"t":"Súmulas e precedentes do Supremo Tribunal Federal, do Superior Tribunal de Justiça e do Tribunal de Justiça do Estado do Rio Grande do Sul."}],"pcivil":[{"id":"tjrs:pcivil:1","n":"1","lvl":0,"t":"Fontes do Direito Processual Civil. A lei processual no tempo e no espaço. Interpretação das leis processuais. Princípios e normas fundamentais do processo civil. Aplicação das normas processuais."},{"id":"tjrs:pcivil:2","n":"2","lvl":0,"t":"Jurisdição. Característica. Objetivo. Princípios. Espécies. Substitutivos. Jurisdição estatal e arbitral. Poderes e deveres procedimentais do juiz. Impedimento. Suspeição. Código de Organização Judiciária do Estado do Rio Grande do Sul (Lei Estadual nº 7.356/1980) e legislação pertinente."},{"id":"tjrs:pcivil:3","n":"3","lvl":0,"t":"Competência. Critérios de determinação e de modificação. Competência absoluta e relativa. Declaração de incompetência. Conflito de competência. Cooperação nacional. Cooperação internacional."},{"id":"tjrs:pcivil:4","n":"4","lvl":0,"t":"A ação. Teorias da ação. Condições da ação. Elementos da ação. Classificação das ações. Cumulação de ações. Processo: conceito, espécies, pressupostos processuais, relação jurídica processual e procedimento."},{"id":"tjrs:pcivil:5","n":"5","lvl":0,"t":"Sujeitos do processo. Partes e procuradores. Capacidade processual. Deveres processuais e responsabilidade. Litigância de má-fé e atos atentatórios à dignidade da justiça. Despesas processuais, honorários de sucumbência e multas. Gratuidade da justiça. Sucessão e substituição. Curador especial. Litisconsórcio, assistência e modalidades de intervenção de terceiros. Amicus curiae. Incidente de desconsideração da personalidade jurídica. Auxiliares da Justiça. Ministério Público. Advocacia Pública. Defensoria Pública."},{"id":"tjrs:pcivil:6","n":"6","lvl":0,"t":"Atos processuais. Forma, tempo e lugar. Negócio jurídico processual e convenção processual. Invalidade dos atos processuais. Preclusões. Comunicação dos atos processuais. Atos processuais eletrônicos. Distribuição e registro. Valor da causa."},{"id":"tjrs:pcivil:7","n":"7","lvl":0,"t":"Tutela provisória. Tutela de urgência e tutela de evidência. Estabilização da tutela antecipada. Decisão e cumprimento das medidas provisórias. Medidas cautelares nominadas."},{"id":"tjrs:pcivil:8","n":"8","lvl":0,"t":"Procedimento comum. Formação, suspensão e extinção do Processo. Petição inicial: requisitos e documentos indispensáveis. Aditamento e modificação do pedido. Hipóteses de indeferimento da petição inicial. Improcedência liminar do pedido. Recursos. Retratação. Audiência de conciliação ou de mediação. Defesa do réu. Contestação e reconvenção. Revelia e reconhecimento do pedido. Providências preliminares. Julgamento conforme o estado do processo. Julgamento parcial do mérito. Audiência de saneamento e organização do processo."},{"id":"tjrs:pcivil:9","n":"9","lvl":0,"t":"Provas. Objeto e meios. Direito à prova. Prova atípica e prova ilícita. Ônus da prova. Distribuição estática e distribuição dinâmica do ônus da prova. Iniciativa probatória do juiz. Inversão do ônus da prova. Convenção sobre ônus da prova. Antecipação da prova. Provas em espécie e sua produção. Valoração da prova. Standards probatórios. Audiência de instrução e julgamento."},{"id":"tjrs:pcivil:10","n":"10","lvl":0,"t":"Sentença. Classificação e elementos. Princípio da congruência. Vícios das sentenças. Fato superveniente. Julgamento das ações relativas às prestações de fazer, de não fazer e de entregar coisa. Efeitos da sentença. Remessa necessária. Coisa julgada formal e material. Limites subjetivos, objetivos e temporais. Coisa julgada e resolução de questão prejudicial. Eficácia preclusiva da coisa julgada. Coisa julgada nas ações coletivas. Relativização da coisa julgada. Liquidação de sentença. Linguagem simples, Visual Law e Legal Design na comunicação dos atos e decisões judiciais, com ênfase no dever de clareza, acessibilidade, transparência e compreensão da decisão judicial."},{"id":"tjrs:pcivil:11","n":"11","lvl":0,"t":"Cumprimento de Sentença. Disposições gerais. Cumprimento de sentença que reconheça a exigibilidade de obrigação de pagar quantia certa; de prestar alimentos, provisórios ou definitivos; de pagar quantia certa pela Fazenda Pública; de fazer, de não fazer e de entregar coisa. Defesa. Cumprimento de sentença provisório e definitivo."},{"id":"tjrs:pcivil:12","n":"12","lvl":0,"t":"Procedimentos especiais. Ação de consignação em pagamento, ação de exigir contas, ações possessórias, inventário e partilha, ações de família, embargos de terceiro, oposição, habilitação, ação monitória, da homologação do penhor legal; restauração de autos."},{"id":"tjrs:pcivil:13","n":"13","lvl":0,"t":"Procedimentos de jurisdição voluntária. Disposições gerais. Notificação e interpelação, alienação judicial. Divórcio e separação consensuais, extinção consensual de união estável e alteração do regime de bens do matrimônio. Testamentos e codicilos. Herança jacente. Bens dos ausentes. Coisas vagas. Interdição e tutela. Organização e fiscalização das fundações."},{"id":"tjrs:pcivil:14","n":"14","lvl":0,"t":"Mandado de segurança. Ação Popular. Habeas data. Ação de improbidade administrativa. Suspensão de segurança. Execução fiscal e execução contra a Fazenda Pública."},{"id":"tjrs:pcivil:15","n":"15","lvl":0,"t":"Procedimento do Juizado Especial Cível Estadual, Juizado Especial Federal Cível e Juizado Especial da Fazenda Pública."},{"id":"tjrs:pcivil:16","n":"16","lvl":0,"t":"Processo coletivo. Princípios. Tutela jurisdicional coletiva. Microssistema coletivo. Espécies de processo coletivo. Legitimados ativos. Processos estruturais"},{"id":"tjrs:pcivil:17","n":"17","lvl":0,"t":"Ações locatícias: ação de despejo, ação consignatória, ação renovatória e ação revisional. Ações decorrentes de leasing e alienação fiduciária. O processo da recuperação judicial e da falência."},{"id":"tjrs:pcivil:18","n":"18","lvl":0,"t":"Processo de execução: princípios, disposições gerais, partes, competência, requisitos. Títulos executivos. Responsabilidade patrimonial. Espécies de execução. Execução para entrega de coisa. Execução das obrigações de fazer e não fazer. Execução por quantia certa. Execução de alimentos. Embargos à execução. Suspensão e extinção do processo de execução."},{"id":"tjrs:pcivil:19","n":"19","lvl":0,"t":"Ordem dos processos nos tribunais e competência originária. Disposições gerais. Incidente de assunção de competência. Incidente de arguição de inconstitucionalidade. Conflito de competência. Homologação de sentença estrangeira e concessão de exequatur à carta rogatória. Ação rescisória. Incidente de resolução de demandas repetitivas. Reclamação. Precedentes judiciais."},{"id":"tjrs:pcivil:20","n":"20","lvl":0,"t":"Recursos. Princípios. Classificação. Efeitos. Juízo de admissibilidade e juízo de mérito. Apelação. Agravo de instrumento. Embargos de declaração. Recursos extraordinário e especial. Embargos de divergência. Agravo interno."}],"consumidor":[{"id":"tjrs:consumidor:1","n":"1","lvl":0,"t":"Fundamentos Constitucionais e infraconstitucionais do Direito do Consumidor. Campo de Aplicação do Código de Defesa do Consumidor (CDC)."},{"id":"tjrs:consumidor:2","n":"2","lvl":0,"t":"Relação de Consumo. Conceitos de consumidor, fornecedor, produto e serviço. Correntes e posicionamento do STJ."},{"id":"tjrs:consumidor:3","n":"3","lvl":0,"t":"Principiologia e Direitos Básicos no CDC. Boa-fé objetiva. Inversão do ônus da prova."},{"id":"tjrs:consumidor:4","n":"4","lvl":0,"t":"Responsabilidade pelo fato e do produto e do serviço no CDC. Responsabilidade pelo. Vício do produto e do serviço no CDC. Prazos. Garantia Contratual e Legal. Decadência e Prescrição. Desconsideração da Personalidade Jurídica no CDC."},{"id":"tjrs:consumidor:5","n":"5","lvl":0,"t":"Oferta e Publicidade. Práticas Comerciais Abusivas. Cobrança de Dívidas e cadastros de Inadimplentes. Contratação no comércio eletrônico (Decreto nº 7.962, de 15/03/2013)."},{"id":"tjrs:consumidor:6","n":"6","lvl":0,"t":"Proteção Contratual no CDC. Cláusulas Abusivas. Contratos de Adesão. Financiamentos. Ações de revisão de contrato. Prevenção e tratamento do superendividamento."},{"id":"tjrs:consumidor:7","n":"7","lvl":0,"t":"Sanções administrativas. O Sistema Nacional de Defesa do Consumidor."},{"id":"tjrs:consumidor:8","n":"8","lvl":0,"t":"Defesa dos Direitos do Consumidor em Juízo. Ações Coletivas para defesa de interesses difusos, coletivos e individuais homogêneos em matéria de consumo. Conciliação no superendividamento."},{"id":"tjrs:consumidor:9","n":"9","lvl":0,"t":"Lei do Cadastro Positivo e seu regulamento (Lei nº 12.414, de 09/06/2011, e Decreto nº 9.936, de 24/07/2019)."},{"id":"tjrs:consumidor:10","n":"10","lvl":0,"t":"Regulamento Geral de Direitos do Consumidor de Serviços de Telecomunicações (Resolução nº 765 ANATEL, de 06/11/2023)."},{"id":"tjrs:consumidor:11","n":"11","lvl":0,"t":"Regras de Prestação do Serviço Público de Distribuição de Energia Elétrica (Resolução Normativa ANEEL nº 1.000, de 07/12/2021)."},{"id":"tjrs:consumidor:12","n":"12","lvl":0,"t":"Lei dos planos e seguros privados de assistência à saúde (Lei nº 9.656, de 03/06/1998)."},{"id":"tjrs:consumidor:13","n":"13","lvl":0,"t":"Súmulas e precedentes do Supremo Tribunal Federal, do Superior Tribunal de Justiça e do Tribunal de Justiça do Estado do Rio Grande do Sul."}],"eca":[{"id":"tjrs:eca:1","n":"1","lvl":0,"t":"Estatuto da Criança e do Adolescente (Lei nº 8069/90). Da proteção à criança e ao adolescente. Conceitos, direitos, deveres, garantias e prioridades. Da interpretação da norma estatutária. Dos direitos fundamentais. Direito à convivência familiar. Das medidas de proteção. Do direito à educação, à cultura, ao esporte e ao lazer. Da prevenção. Da prevenção especial. Da política de atendimento. Dos atos infracionais. Das medidas pertinentes aos pais ou responsável. Do Conselho Tutelar. Do Conselho dos Direitos da Criança e do Adolescente. Da Justiça da Infância e da Juventude. Competência. Dos processos e procedimentos. Dos recursos. Do Ministério Público. Da proteção judicial dos interesses individuais, difusos e coletivos. Das infrações administrativas."},{"id":"tjrs:eca:2","n":"2","lvl":0,"t":"Violência doméstica e familiar contra a criança o adolescente (Lei nº 14.344/2022)."},{"id":"tjrs:eca:3","n":"3","lvl":0,"t":"Estatuto Digital da Criança e do Adolescente (Lei nº 15.211/2025, com suas alterações)."},{"id":"tjrs:eca:4","n":"4","lvl":0,"t":"Abandono afetivo e responsabilidade civil nas relações familiares, especialmente à luz da Lei nº 15.240/2025."}],"penal":[{"id":"tjrs:penal:1","n":"1","lvl":0,"t":"Conceito, funções e características do Direito Penal. Evolução do Direito Penal e do Direito Penal brasileiro. Fontes e princípios do Direito Penal. Doutrinas, escolas e tendências penais. Abolicionismo. Garantismo. Direito penal mínimo e máximo. Direito penal do fato e do autor. Direito penal do inimigo. Justiça Restaurativa. Política criminal. Criminologia. Vitimologia. Sistemas penitenciários."},{"id":"tjrs:penal:2","n":"2","lvl":0,"t":"Teoria da norma penal. Lei penal: fontes, características, interpretação, integração, vigência e aplicação. A lei penal no tempo e no espaço. A lei penal em relação às pessoas. Conflito aparente de normas. O Título I da Parte Geral do Código Penal brasileiro."},{"id":"tjrs:penal:3","n":"3","lvl":0,"t":"Teoria do crime: conceito de crime, evolução histórica e principais sistemas. Bem jurídico. Dano e perigo. Teoria da conduta. Condutas comissivas e omissivas. Teoria do tipo penal. Classificações. Tipos dolosos e culposos. Relação de causalidade. Imputação. Imputação objetiva. Ilicitude e causas excludentes. Culpabilidade e dirimentes. Erro de tipo e de proibição. Iter criminis. Consumação e tentativa. Exaurimento. Desistência voluntária, arrependimento eficaz e arrependimento posterior. Crime impossível. Imputabilidade penal. Concurso de pessoas. Os Títulos II, III e IV da Parte Geral do Código Penal brasileiro."},{"id":"tjrs:penal:4","n":"4","lvl":0,"t":"Teoria geral das penas. Penas em espécie e medidas de segurança. Aplicação, dosimetria e regime de cumprimento das penas. Concurso de crimes. Erro na execução e resultado diverso do pretendido. Limites das penas. Execução penal. Suspensão condicional da Pena. Livramento condicional. Efeitos da condenação. Reabilitação. Medidas de segurança. Ação penal. Extinção da punibilidade. Os Títulos V, VI, VII e VIII da Parte Geral do Código Penal brasileiro."},{"id":"tjrs:penal:5","n":"5","lvl":0,"t":"Crimes em espécie contidos nos Títulos I a XII da Parte Especial do Código Penal brasileiro."},{"id":"tjrs:penal:6","n":"6","lvl":0,"t":"Disposições penais da Constituição da República Federativa do Brasil. Lei de Execução Penal (Lei nº 7.210/1984). Crimes hediondos (Lei nº 8.072/1990). Organizações criminosas (Lei nº 12.694/2012 e Lei nº 12.850/2013). Contravenções penais (Decreto-Lei nº 3.688/1941). Lei nº 9.099/1995 (Juizados Especiais)."},{"id":"tjrs:penal:7","n":"7","lvl":0,"t":"Crimes e disposições penais das seguintes leis: abuso de autoridade (Lei nº 13.869/2019); armas (Lei nº 10.826/2003); consumidor (Lei nº 8.078/1990); criança e adolescente (Lei nº 8.069/1990 e Lei nº 13.431/2017); drogas (Lei nº 11.343/2006); economia popular (Lei nº 1.521/1951); eleitoral (Lei nº 4.737/1965 e Lei nº 9.504/97); idoso (Lei nº 10.741/2003); falência (Lei nº 11.101/2005); lavagem ou ocultação de bens, direitos e valores (Lei nº 9.613/1998 e Lei nº 12.683/2012); meio ambiente (Lei nº 9.605/1998); mulher (Lei nº 11.340/2006); ordem econômica (Lei nº 8.176/1991); ordem tributária (Lei nº 8.137/1990); portador de HIV (Lei nº 12.984/2014); preconceito de raça ou cor (Lei nº 7.716/1989); responsabilidade de prefeitos e vereadores (Decreto-Lei nº 201/1967); torcedor (Lei nº 10.671/2003); tortura (Lei nº 9.455/1997); trânsito (Lei nº 9.503/1997)."},{"id":"tjrs:penal:8","n":"8","lvl":0,"t":"Súmulas e jurisprudência do Superior Tribunal de Justiça e do Supremo Tribunal Federal."}],"ppenal":[{"id":"tjrs:ppenal:1","n":"1","lvl":0,"t":"Processo penal em geral. Fontes e princípios do direito processual penal. Sistemas processuais."},{"id":"tjrs:ppenal:2","n":"2","lvl":0,"t":"Norma processual penal. Interpretação, integração, aplicação e eficácia temporal, espacial e subjetiva da lei processual penal."},{"id":"tjrs:ppenal:3","n":"3","lvl":0,"t":"Investigação criminal. Sistemas de investigação, poderes, deveres, metodologias e atos investigatórios. A Polícia judiciária. O inquérito policial."},{"id":"tjrs:ppenal:4","n":"4","lvl":0,"t":"Ação penal. Ação civil ex delicto. Jurisdição e competência. Sujeitos processuais."},{"id":"tjrs:ppenal:5","n":"5","lvl":0,"t":"Medidas cautelares pessoais. Prisão. Liberdade provisória. Audiência de custódia. Medidas cautelares reais. Questões e processos incidentes. Prisão especial."},{"id":"tjrs:ppenal:6","n":"6","lvl":0,"t":"Comunicação dos atos processuais. As provas no direito processual penal. Prazos processuais. Defeitos processuais. Nulidades. Prova digital. Valoração da prova digital e cadeia de custódia em meios eletrônicos. Integridade, autenticidade e admissibilidade da prova digital."},{"id":"tjrs:ppenal:7","n":"7","lvl":0,"t":"Atos jurisdicionais. Despachos. Decisões. Sentenças. Acórdãos. Decisões monocráticas. Trânsito em julgado. Coisa julgada."},{"id":"tjrs:ppenal:8","n":"8","lvl":0,"t":"Recursos em geral. Remédios autônomos. Habeas corpus. Revisão Criminal. Mandado de segurança criminal. Reclamação. Correição parcial."},{"id":"tjrs:ppenal:9","n":"9","lvl":0,"t":"Processos e procedimentos em espécie, do Código de Processo Penal. Disposições processuais penais da Constituição da República Federativa do Brasil e do Código Penal brasileiro. Disposições do Código de Processo Civil brasileiro aplicáveis ao processo penal (Lei nº 13.105/2015)."},{"id":"tjrs:ppenal:10","n":"10","lvl":0,"t":"Disposições processuais penais contidas na legislação especial: depoimento especial (Lei nº 13.431/2017); drogas (Lei nº 11.343/2006); eleitoral (Lei nº 4.737/1965); falência (Lei nº 11.101/2005); interceptação telefônica (Lei nº 9.296/1996); Juizados Especiais (Lei nº 9.099/1995); organizações criminosas (Lei nº 12.694/2012 e Lei nº 12.850/2013); prisão temporária (Lei nº 7.960/1989); proteção a testemunhas (Lei nº 9.807/1999); responsabilidade de prefeitos e vereadores (Decreto-Lei nº 201/1967); violência doméstica (Lei nº 11.340/2006). Lei de Execução Penal (Lei nº 7.210/1984)."},{"id":"tjrs:ppenal:11","n":"11","lvl":0,"t":"Súmulas e jurisprudência do Superior Tribunal de Justiça e do Supremo Tribunal Federal."}],"constitucional":[{"id":"tjrs:constitucional:1","n":"1","lvl":0,"t":"Constitucionalismo e teoria da constituição. Constituição e neoconstitucionalismo. Estado de Direito Democrático."},{"id":"tjrs:constitucional:2","n":"2","lvl":0,"t":"Poder constituinte. Supremacia da Constituição. Normas constitucionais: hermenêutica e filosofia constitucional. Métodos de interpretação. Aplicabilidade e eficácia. Mutação constitucional."},{"id":"tjrs:constitucional:3","n":"3","lvl":0,"t":"Controle da constitucionalidade: lineamentos gerais e modalidades. Controle da constitucionalidade no âmbito da Constituição do Estado do Rio Grande do Sul. Ação Direta de Inconstitucionalidade. Ação Declaratória de Constitucionalidade. Arguição de Descumprimento de Preceito Fundamental. Mandado de Injunção. Ação Direta de Inconstitucionalidade por Omissão. Ação Direta de Inconstitucionalidade Interventiva. Do controle de convencionalidade."},{"id":"tjrs:constitucional:4","n":"4","lvl":0,"t":"Preâmbulo da Constituição. Princípios fundamentais. Direitos e Garantias fundamentais. Direitos Humanos. Tratados Internacionais de Direitos Humanos. Direitos sociais. Nacionalidade. Direitos Políticos."},{"id":"tjrs:constitucional:5","n":"5","lvl":0,"t":"Da Organização do Estado. Da intervenção. Organização dos poderes: Executivo, Legislativo e Judiciário. Das atribuições."},{"id":"tjrs:constitucional:6","n":"6","lvl":0,"t":"Poder Executivo. Atribuições e competências. Administração Pública. Servidores Públicos."},{"id":"tjrs:constitucional:7","n":"7","lvl":0,"t":"Poder Legislativo. Atribuições e competências. Do processo legislativo."},{"id":"tjrs:constitucional:8","n":"8","lvl":0,"t":"Poder Judiciário. Estatuto da Magistratura: direitos, garantias e deveres. Autonomia administrativa e financeira dos Tribunais. Supremo Tribunal Federal, Conselho Nacional de Justiça. Superior Tribunal de Justiça. Tribunais Regionais Federais e Juízes Federais. Tribunais e Juízes do Trabalho. Tribunais e Juízes Eleitorais. Tribunais e Juízes Militares. Tribunais e Juízes dos Estados. Das funções essenciais à Justiça: Ministério Público, Advocacia Pública, Advocacia e Defensoria Pública."},{"id":"tjrs:constitucional:9","n":"9","lvl":0,"t":"Defesa do Estado e das Instituições Democráticas."},{"id":"tjrs:constitucional:10","n":"10","lvl":0,"t":"Tributação e Orçamento: sistema tributário nacional (princípios gerais e limitações ao poder de tributar) e finanças públicas (normas gerais e orçamentos)."},{"id":"tjrs:constitucional:11","n":"11","lvl":0,"t":"Ordem Econômica e Financeira: princípios gerais da atividade econômica, política urbana, política agrícola, minerária e fundiária e da reforma agrária."},{"id":"tjrs:constitucional:12","n":"12","lvl":0,"t":"Ordem Social: seguridade social, saúde, previdência social e assistência social; educação, cultura e desporto; meio ambiente; família, criança e adolescente, jovem e idoso; índios."}],"eleitoral":[{"id":"tjrs:eleitoral:1","n":"1","lvl":0,"t":"Estado Democrático de Direito. Cidadania. Sistema representativo. Soberania popular. Política."},{"id":"tjrs:eleitoral:2","n":"2","lvl":0,"t":"Direitos políticos. Conceito. Classificação. Perda. Suspensão. Sufrágio universal. Voto."},{"id":"tjrs:eleitoral:3","n":"3","lvl":0,"t":"Partidos políticos. Conceito. História. Disciplina constitucional e legal no Direito Brasileiro."},{"id":"tjrs:eleitoral:4","n":"4","lvl":0,"t":"Direito eleitoral. Conceito. Fontes. Princípios. Aplicação. Interpretação."},{"id":"tjrs:eleitoral:5","n":"5","lvl":0,"t":"Justiça Eleitoral. Organização. Competência."},{"id":"tjrs:eleitoral:6","n":"6","lvl":0,"t":"Ministério Público Eleitoral. Organização. Atribuições."},{"id":"tjrs:eleitoral:7","n":"7","lvl":0,"t":"Alistamento eleitoral. Regras constitucionais, legais e regulamentares."},{"id":"tjrs:eleitoral:8","n":"8","lvl":0,"t":"Elegibilidade. Conceito. Condições de elegibilidade. Inelegibilidade. Incompatibilidade. Regras constitucionais, legais e regulamentares."},{"id":"tjrs:eleitoral:9","n":"9","lvl":0,"t":"Sistemas eleitorais. Classificações. Modelo brasileiro. Outros modelos."},{"id":"tjrs:eleitoral:10","n":"10","lvl":0,"t":"Processo Eleitoral. Convenções partidárias. Registro de candidatos. A proporcionalidade de candidatos por gênero nas eleições proporcionais."},{"id":"tjrs:eleitoral:11","n":"11","lvl":0,"t":"Campanha eleitoral. Conceito. Financiamento. Abuso de poder político e econômico: caracterização e efeitos."},{"id":"tjrs:eleitoral:12","n":"12","lvl":0,"t":"Propaganda política e suas modalidades. Propaganda eleitoral. Regras legais e regulamentares."},{"id":"tjrs:eleitoral:13","n":"13","lvl":0,"t":"Eleição, apuração e diplomação dos eleitos."},{"id":"tjrs:eleitoral:14","n":"14","lvl":0,"t":"Ações judiciais eleitorais. Crimes eleitorais. Tipos penais e sanções. Processo por crimes eleitorais. Jurisprudência dos tribunais eleitorais."},{"id":"tjrs:eleitoral:15","n":"15","lvl":0,"t":"Dos crimes eleitorais em espécie (artigos nº 290 a nº 354 do Código Eleitoral)."},{"id":"tjrs:eleitoral:16","n":"16","lvl":0,"t":"Dos crimes previstos pela Lei nº 9.504/1997."},{"id":"tjrs:eleitoral:17","n":"17","lvl":0,"t":"Dos crimes eleitorais previstos na Lei nº 6.091/1974 e na Lei nº 6.996/1982."},{"id":"tjrs:eleitoral:18","n":"18","lvl":0,"t":"Dos crimes previstos na lei de inelegibilidade (Lei Complementar nº 64/1990)."},{"id":"tjrs:eleitoral:19","n":"19","lvl":0,"t":"Dos recursos eleitorais."},{"id":"tjrs:eleitoral:20","n":"20","lvl":0,"t":"Propaganda eleitoral e tecnologia contemporânea (desinformação, inteligência artificial, deepfakes e redes sociais)."}],"empresarial":[{"id":"tjrs:empresarial:1","n":"1","lvl":0,"t":"Origens e história do Direito Comercial/Empresarial. Ordem econômica na Constituição de 1988. Princípios reguladores. Teoria do Direito Empresarial. Teoria Jurídica da Empresa. Teoria Jurídica do Mercado. Interpretação do direito empresarial. Características do direito empresarial."},{"id":"tjrs:empresarial:2","n":"2","lvl":0,"t":"Empresário. Conceito e caracterização. Capacidade. Deveres. Empresário individual e sociedade empresária. Sociedade não empresária. Pequeno empresário. Empresário Rural. Empresa Individual de Responsabilidade Ltda. Microempresa e Empresa de Pequeno Porte. Registro Público das Empresas Mercantis. Lei nº 8.934/1994. Institutos complementares. Nome empresarial. Prepostos. Contabilistas. Auxiliares da empresa. Escrituração. Livros obrigatórios e facultativos. Força probante. Demonstrações dos resultados econômicos da Empresa."},{"id":"tjrs:empresarial:3","n":"3","lvl":0,"t":"Teoria Geral das Sociedades. Sociedades. Conceito. Elementos. Classificação. Princípios. Personalidade jurídica. Desconsideração da personalidade jurídica. Sócio e acionista. Direitos. Deveres. Responsabilidades. Capital Social. Classificação das sociedades. Sociedades no Código Civil. Sociedade em Comum. Sociedade em Conta de Participação. Sociedade Simples. Sociedade em nome coletivo. Sociedade em comandita simples. Sociedade Limitada. Sociedade em comandita por ações. Sociedade cooperativa. Sociedades Coligadas. Liquidação da sociedade. Transformação, incorporação, Fusão e Cisão das Sociedades. Sociedade dependente de autorização. Sociedade nacional e estrangeira. Sociedade anônima no Código Civil e Lei nº 6.404/1976 e suas alterações. Sociedades de economia mista. Sociedades controladoras e controladas. Mercado de Capitais. Valores Mobiliários. Dissolução. Retirada e exclusão do sócio. Apuração de haveres. Liquidação. Partilha. Processo."},{"id":"tjrs:empresarial:4","n":"4","lvl":0,"t":"Teoria do Estabelecimento Comercial. Estabelecimento comercial no Código Civil e no Código de Processo Civil. Estabelecimento Virtual. Aviamento. Clientela. Locação em Shopping Centers. Ação renovatória de locação. Propriedade industrial. Lei nº 9.279, de 14/05/1996. Lei nº 9.609, de 19/02/1998."},{"id":"tjrs:empresarial:5","n":"5","lvl":0,"t":"Teoria geral da Concorrência Empresarial. Fundamento constitucional. Disciplina legal e contratual. Concorrência desleal. Sistema Brasileiro da Concorrência. Lei nº 12.529, de 30/11/2011. Empresário e o Direito do Consumidor. Fornecimento de bens e serviços. Teoria da qualidade. Relações interempresariais decorrentes de vícios do fornecimento de bens e serviços. Publicidade e tutela do consumidor. Responsabilidade civil em razão da publicidade empresarial."},{"id":"tjrs:empresarial:6","n":"6","lvl":0,"t":"Teoria geral do contrato e contratos mercantis. Função social do contrato e contratos empresariais. Unificação das obrigações. Caracterização do contrato mercantil. Princípios. Contrato tipo e contrato de adesão. Dependência empresarial e tutela do contratante empresarial mais fraco. Contratos eletrônicos."},{"id":"tjrs:empresarial:7","n":"7","lvl":0,"t":"Compra e venda mercantil. Elementos essenciais. Direitos e obrigações das partes. Responsabilidade pelos vícios. Responsabilidade pela evicção. Compra e venda no comércio exterior. Incoterms. Modalidade de compras e venda. Contrato de fornecimento. Contrato de Distribuição. Comissão mercantil. Mandato mercantil. Contrato de Agência. Lei nº 4.886, de 09/12/1965 (Representação comercial). Contrato de Concessão Mercantil. Contrato de Consignação. Contrato de Franquia. Contrato de corretagem. Contrato de transporte. Contrato de depósito. Contrato de know-how. Locação mercantil."},{"id":"tjrs:empresarial:8","n":"8","lvl":0,"t":"Teoria jurídica da atividade bancária. Contratos bancários. Contrato de conta corrente bancária. Mútuo bancário. Depósito. Desconto. Abertura de crédito. Crédito documentário. Antecipação. Cobrança. Fomento mercantil. Arrendamento mercantil. Repasse financiamento. Penhor mercantil. Alienação Fiduciária em Garantia. Alienação fiduciária de bem móvel. Alienação fiduciária de bem imóvel. Alienação fiduciária no âmbito do mercado de valores mobiliários. Contrato de seguro. Resseguro. Cartões de Crédito. Encargos nos contratos de crédito bancário. Garantias nos contratos de crédito bancário."},{"id":"tjrs:empresarial:9","n":"9","lvl":0,"t":"Teoria geral dos títulos de crédito. Títulos de crédito no Código Civil. Constituição do crédito. Exigibilidade. Títulos de crédito em espécie. Letra de Câmbio. Nota promissória. Cheque. Duplicata. Títulos de créditos vinculados ao crédito rural, ao crédito industrial, ao comercial e à exportação. Cédulas de crédito bancário. Títulos de créditos vinculados ao financiamento imobiliário. Conhecimento de depósito. Warrant. Conhecimento de transporte. Títulos do agronegócio. Certificado de Depósitos Bancários. Letras de câmbio financeiras. Letras de Arrendamento mercantil. Letras Financeiras. Ações cambiárias."},{"id":"tjrs:empresarial:10","n":"10","lvl":0,"t":"Recuperação judicial, extrajudicial falência do empresário e da sociedade empresária (Lei nº 11.101, de 09/02/2005, e suas alterações). Crise econômica e financeira e cessação do pagamento; causas macro e microeconômicas da crise da empresa. Disposições preliminares e comuns à recuperação judicial e à falência: a) verificação e da habilitação de créditos; b) administrador judicial e comitê de credores; c) assembleia geral de credores. Recuperação judicial: a) objetivo; b) legitimidade ativa; c) requisitos; d) créditos abrangidos e exceções; e) meios para a obtenção da recuperação da empresa; f) pedido e processamento da recuperação judicial; g) plano de recuperação judicial; h) consolidação processual e patrimonial/substancial; i) plano alternativo; j) concessão da recuperação e seus efeitos; k) encerramento da recuperação. Recuperação judicial das Microempresas e Empresas de Pequeno Porte: plano especial. Conteúdo e aprovação. Das Conciliações e das Mediações Antecedentes ou Incidentais aos Processos de Recuperação Judicial. Recuperação extrajudicial. Convolação da recuperação judicial em falência. Falência: a) objetivo; b) juízo universal; c) habilitação e verificação dos créditos; d) classificação dos créditos e ordem de preferência; e) incidente de classificação de créditos de direito público. Procedimento pré-falimentar e decretação da falência; a) direitos e deveres do falido; b) autofalência; c) efeitos da decretação da falência sobre as obrigações do devedor; suas obrigações, bens, contratos e atos praticados antes da falência; d) ações falimentares. Crimes em espécie na falência, na recuperação judicial e na recuperação extrajudicial: a) competência; b) natureza da ação penal; c) procedimento penal; d) prescrição; e) efeitos da sentença condenatória; f) legitimação passiva; g) condição objetiva de punibilidade."},{"id":"tjrs:empresarial:11","n":"11","lvl":0,"t":"Lei nº 14.193, de 06/08/2021 - SAF (Sociedade Anônima do Futebol)."},{"id":"tjrs:empresarial:12","n":"12","lvl":0,"t":"Lei Complementar nº 182, de 01/06/2021(Marco Legal das Startups)."},{"id":"tjrs:empresarial:13","n":"13","lvl":0,"t":"Súmulas e precedentes do Supremo Tribunal Federal, do Superior Tribunal de Justiça e do Tribunal de Justiça do Estado do Rio Grande do Sul."}],"tributario":[{"id":"tjrs:tributario:1","n":"1","lvl":0,"t":"O sistema Tributário Nacional. Princípios gerais. Carga tributária. Conceito de tributo. Fiscalidade, extrafiscalidade e parafiscalidade. Competência tributária. Tributos dos Estados e dos Municípios. Imunidades tributárias. Repartição das receitas tributárias. Limitações do poder de tributar."},{"id":"tjrs:tributario:2","n":"2","lvl":0,"t":"Fontes do Direito Tributário. Legislação tributária: vigência, aplicação, interpretação e integração."},{"id":"tjrs:tributario:3","n":"3","lvl":0,"t":"Espécies tributárias. Impostos. Taxas. Taxas e preços públicos. O pedágio. Contribuição de melhoria e outras contribuições. Empréstimos compulsórios. Classificação doutrinária dos tributos."},{"id":"tjrs:tributario:4","n":"4","lvl":0,"t":"Obrigação tributária. Obrigações principais e acessórias. Hipótese de incidência. Teoria do fato gerador. Elementos subjetivos da obrigação tributária. Solidariedade. Capacidade tributária passiva. Domicílio tributário."},{"id":"tjrs:tributario:5","n":"5","lvl":0,"t":"Responsabilidade tributária. Contribuinte. Responsável tributário. Substituto tributário. Responsabilidade dos sucessores. Responsabilidade de terceiros. Infrações e sanções tributárias. Responsabilidade por infração à legislação tributária. Denúncia espontânea."},{"id":"tjrs:tributario:6","n":"6","lvl":0,"t":"Crédito tributário. Natureza. Constituição. Lançamento. Suspensão da exigibilidade do crédito tributário. Exclusão do crédito tributário. Extinção do crédito tributário. Garantias e privilégios do crédito tributário."},{"id":"tjrs:tributario:7","n":"7","lvl":0,"t":"Administração tributária. Atividade da administração tributária. A fiscalização do cumprimento das prestações tributárias. Acesso à informação e dever de sigilo. Dívida ativa e certidões de situação fiscal."},{"id":"tjrs:tributario:8","n":"8","lvl":0,"t":"Processo administrativo fiscal (Lei nº 6.537/1973). Processo judicial tributário. Ações de natureza tributária. Transação tributária."},{"id":"tjrs:tributario:9","n":"9","lvl":0,"t":"Reforma tributária do consumo. Emenda Constitucional nº 132/2023 e legislação complementar regulamentadora."},{"id":"tjrs:tributario:10","n":"10","lvl":0,"t":"Jurisprudência e Súmulas em matéria tributária."}],"ambiental":[{"id":"tjrs:ambiental:1","n":"1","lvl":0,"t":"A Constituição Federal e o meio ambiente. O art. 225: objetivo, alcance e reflexos. Ambiente ecologicamente equilibrado como direito fundamental. Natureza pública da proteção ambiental."},{"id":"tjrs:ambiental:2","n":"2","lvl":0,"t":"Fontes do Direito Ambiental. Princípios do Direito Ambiental. Legislação. Interpretação. O Direito Ambiental na visão dos Tribunais."},{"id":"tjrs:ambiental:3","n":"3","lvl":0,"t":"Competências administrativa, legislativa e jurisdicional em matéria ambiental."},{"id":"tjrs:ambiental:4","n":"4","lvl":0,"t":"Tutela do meio ambiente e seus agentes. Instrumentos processuais da tutela ambiental. Inquérito Civil. Compromisso de Ajustamento de Conduta. Ação civil pública. Ação popular constitucional. Mandado de segurança coletivo. Mandado de injunção. Ação penal pública ambiental."},{"id":"tjrs:ambiental:5","n":"5","lvl":0,"t":"Responsabilidades administrativa, civil e penal ambiental. Responsabilidade da pessoa jurídica em matéria ambiental."},{"id":"tjrs:ambiental:6","n":"6","lvl":0,"t":"Espaços protegidos. Unidades de conservação."},{"id":"tjrs:ambiental:7","n":"7","lvl":0,"t":"Lei Geral do Licenciamento Ambiental (Lei nº 15.190/2025). Lei nº 15.300/2025, que dispõe sobre o licenciamento ambiental especial e altera a Lei nº 15.190/2025."},{"id":"tjrs:ambiental:8","n":"8","lvl":0,"t":"Poluição atmosférica. Poluição Sonora. Poluição visual. Água. Fauna. Flora. Agrotóxicos."},{"id":"tjrs:ambiental:9","n":"9","lvl":0,"t":"Urbanismo. Meio ambiente urbano. Instrumentos urbanísticos de tutela do meio ambiente. A ética ambiental, o Estatuto da Cidade e o Estatuto da Metrópole. Regularização fundiária urbana e rural. Lei nº 13.465, de 11 de julho de 2017. Áreas de risco. Lei nº 12.608/12. Direito dos desastres e catástrofes."},{"id":"tjrs:ambiental:10","n":"10","lvl":0,"t":"Lei nº 12.651/2012 (Código Florestal)."},{"id":"tjrs:ambiental:11","n":"11","lvl":0,"t":"Política Nacional do Meio Ambiente. Recursos Hídricos. Resíduos Sólidos."},{"id":"tjrs:ambiental:12","n":"12","lvl":0,"t":"Mineração."},{"id":"tjrs:ambiental:13","n":"13","lvl":0,"t":"Políticas florestal e de proteção à biodiversidade no Estado do Rio Grande do Sul."},{"id":"tjrs:ambiental:14","n":"14","lvl":0,"t":"Mudanças climáticas. Lei nº 14.904/2024 e políticas de adaptação à mudança do clima."},{"id":"tjrs:ambiental:15","n":"15","lvl":0,"t":"Jurisprudência do Tribunal de Justiça do Estado do Rio Grande do Sul e dos Tribunais Superiores em matéria ambiental."}],"administrativo":[{"id":"tjrs:administrativo:1","n":"1","lvl":0,"t":"A Administração Pública. Atos administrativos próprios e impróprios das funções legislativas, executivas e judiciárias."},{"id":"tjrs:administrativo:2","n":"2","lvl":0,"t":"Organização da Administração Pública. Estrutura administrativa do Estado. Administração direta e indireta. Regime jurídico da administração indireta. Prerrogativas e sujeições. Desconcentração e descentralização. Pessoas de Direito Público e de Direito Privado. Decreto-Lei nº 200/1967. Consórcios públicos. Parcerias público-privadas."},{"id":"tjrs:administrativo:3","n":"3","lvl":0,"t":"Atos administrativos. Atividade administrativa. Sindicância. Processo administrativo. Convalidação, efeitos. Extinção dos atos administrativos. Discricionariedade e legalidade. Classificação dos atos administrativos. Espécies de atos administrativos. Validade, eficácia, aperfeiçoamento, efeitos e extinção dos atos administrativos. Prescrição administrativa. Governança algorítmica. Automação administrativa. Inteligência artificial na Administração Pública. Transparência, explicabilidade, não discriminação, proteção de dados e controle judicial de decisões administrativas automatizadas."},{"id":"tjrs:administrativo:4","n":"4","lvl":0,"t":"Atividade regulatória da Administração Pública. Poder de polícia. Competência regulatória. Competência econômica, social setorial, técnica/especializada. Agências reguladoras."},{"id":"tjrs:administrativo:5","n":"5","lvl":0,"t":"Controle da Administração Pública. Mandado de segurança coletivo. Ação civil pública e ação popular. Reclamação ao Supremo Tribunal Federal. Mandado de injunção. Ações coletivas. Habeas Data. Direito de petição."},{"id":"tjrs:administrativo:6","n":"6","lvl":0,"t":"Contratos administrativos. Contratação direta. Ordem de Serviços. Organizações sociais da sociedade civil de interesse público. Organizações não governamentais."},{"id":"tjrs:administrativo:7","n":"7","lvl":0,"t":"Licitações e contratos administrativos. Lei nº 14.133/2021 e suas alterações. Inexigibilidade e Dispensa. Modalidades. Fases do procedimento licitatório. Tipos de Licitação. Princípios da Licitação."},{"id":"tjrs:administrativo:8","n":"8","lvl":0,"t":"Agentes públicos: classificação e espécies de vínculos com o Estado. Sistema de remuneração. Vencimentos e subsídios. Vedações. Fixação, alteração e limites. Regime constitucional do servidor público. Direito de greve. Responsabilidade do servidor público (política, administrativa, civil e criminal)."},{"id":"tjrs:administrativo:9","n":"9","lvl":0,"t":"Bens públicos. Definição e classificação. A Constituição da República e o regime do Código Civil de 2002. Bens de domínio público e bens dominicais. A transferência de bens públicos: a alienação e o uso do bem público por particular. Bens públicos em espécie."},{"id":"tjrs:administrativo:10","n":"10","lvl":0,"t":"Concessão e permissão de serviços públicos. Conceitos. Modalidades de concessão. Reversibilidade de bens. Extinção e Direito dos concessionários e dos usuários."},{"id":"tjrs:administrativo:11","n":"11","lvl":0,"t":"Desapropriação. Modalidades. Desapropriação Direta e in
