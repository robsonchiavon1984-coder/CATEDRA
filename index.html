direta. Desapropriação por zona. Desapropriação urbanística. Atos expropriatórios por particulares. Hipóteses. Decreto Expropriatório. Prazo. Efeitos. Destinação dos bens. Reversão. Desapropriação por acordo e judicial. Indenização. Decreto-Lei nº 3365/41."},{"id":"tjrs:administrativo:12","n":"12","lvl":0,"t":"Responsabilidade Civil do Estado. Responsabilidade objetiva e subjetiva. Modalidades. Fundamentos. Causas excludentes e atenuantes. Reparação do dano."},{"id":"tjrs:administrativo:13","n":"13","lvl":0,"t":"Intervenção na propriedade e atuação no domínio econômico: servidão, requisição, ocupação temporária, tombamento e limitações administrativas."},{"id":"tjrs:administrativo:14","n":"14","lvl":0,"t":"Improbidade Administrativa (Lei nº 8.429/1992) com as alterações da Lei nº 14.230/2021 e legislação posterior"},{"id":"tjrs:administrativo:15","n":"15","lvl":0,"t":"Da Fazenda Pública. Conceito. Prerrogativas processuais. Controle externo e orçamento. Lei de Responsabilidade Fiscal."},{"id":"tjrs:administrativo:16","n":"16","lvl":0,"t":"Direito Administrativo em situações de emergência e calamidade pública."},{"id":"tjrs:administrativo:17","n":"17","lvl":0,"t":"Jurisprudência e súmulas sobre as matérias."}],"humanistica":[{"id":"tjrs:humanistica:A.1","n":"1","lvl":0,"sec":"A) Sociologia do Direito","t":"Introdução à sociologia da administração judiciária. Aspectos gerenciais da atividade judiciária (administração e economia). Gestão. Gestão de pessoas."},{"id":"tjrs:humanistica:A.2","n":"2","lvl":0,"sec":"A) Sociologia do Direito","t":"Relações sociais e relações jurídicas. Controle social e o Direito. Transformações sociais e Direito."},{"id":"tjrs:humanistica:A.3","n":"3","lvl":0,"sec":"A) Sociologia do Direito","t":"Direito, Comunicação Social e opinião pública."},{"id":"tjrs:humanistica:A.4","n":"4","lvl":0,"sec":"A) Sociologia do Direito","t":"Conflitos sociais e mecanismos de resolução. Sistemas não-judiciais de composição de litígios."},{"id":"tjrs:humanistica:B.1","n":"1","lvl":0,"sec":"B) Psicologia Judiciária","t":"Psicologia e Comunicação: relacionamento interpessoal, relacionamento do magistrado com a sociedade e a mídia."},{"id":"tjrs:humanistica:B.2","n":"2","lvl":0,"sec":"B) Psicologia Judiciária","t":"Problemas atuais da psicologia com reflexos no direito: assédio moral e assédio sexual."},{"id":"tjrs:humanistica:B.3","n":"3","lvl":0,"sec":"B) Psicologia Judiciária","t":"Teoria do conflito e os mecanismos autocompositivos. Técnicas de negociação e mediação. Procedimentos, posturas, condutas e mecanismos aptos a obter a solução conciliada dos conflitos."},{"id":"tjrs:humanistica:B.4","n":"4","lvl":0,"sec":"B) Psicologia Judiciária","t":"O processo psicológico e a obtenção da verdade judicial. O comportamento de partes e testemunhas."},{"id":"tjrs:humanistica:C.1","n":"1","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Regime jurídico da magistratura nacional: carreiras, ingresso, promoções, remoções."},{"id":"tjrs:humanistica:C.2","n":"2","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Direitos e deveres funcionais da magistratura."},{"id":"tjrs:humanistica:C.3","n":"3","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Código de Ética da Magistratura Nacional."},{"id":"tjrs:humanistica:C.4","n":"4","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Sistemas de controle interno do Poder Judiciário: Corregedorias, Ouvidorias, Conselhos Superiores e Conselho Nacional de Justiça"},{"id":"tjrs:humanistica:C.5","n":"5","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Responsabilidade administrativa, civil e criminal dos magistrados."},{"id":"tjrs:humanistica:C.6","n":"6","lvl":0,"sec":"C) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Administração judicial. Planejamento estratégico. Modernização da gestão."},{"id":"tjrs:humanistica:D.1","n":"1","lvl":0,"sec":"D) Filosofia do Direito","t":"O conceito de Justiça. Sentido lato de Justiça, como valor universal. Sentido estrito de Justiça, como valor jurídico-político. Divergências sobre o conteúdo do conceito."},{"id":"tjrs:humanistica:D.2","n":"2","lvl":0,"sec":"D) Filosofia do Direito","t":"O conceito de Direito. Equidade. Direito e Moral."},{"id":"tjrs:humanistica:D.3","n":"3","lvl":0,"sec":"D) Filosofia do Direito","t":"A interpretação do Direito. A superação dos métodos de interpretação mediante puro raciocínio lógico dedutivo. O método de interpretação pela lógica do razoável."},{"id":"tjrs:humanistica:E.1","n":"1","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Direito objetivo e direito subjetivo."},{"id":"tjrs:humanistica:E.2","n":"2","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Fontes do Direito objetivo. Princípios gerais de Direito. Jurisprudência. Súmula vinculante. Distinções e semelhanças dos regimes jurídicos de civil law e common law, inclusive quanto às fontes do Direito, precedentes judiciais, força vinculante, interpretação e formação da jurisprudência."},{"id":"tjrs:humanistica:E.3","n":"3","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Eficácia da lei no tempo. Conflito de normas jurídicas no tempo e o Direito brasileiro: Direito Penal, Direito Civil, Direito Constitucional e Direito do Trabalho."},{"id":"tjrs:humanistica:E.4","n":"4","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"O conceito de Política. Política e Direito."},{"id":"tjrs:humanistica:E.5","n":"5","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Ideologias."},{"id":"tjrs:humanistica:E.6","n":"6","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"A Declaração Universal dos Direitos do Homem (ONU);"},{"id":"tjrs:humanistica:E.7","n":"7","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Agenda 2030 e os 17 Objetivos de Desenvolvimento Sustentável;"},{"id":"tjrs:humanistica:E.8","n":"8","lvl":0,"sec":"E) Teoria Geral do Direito e da Política","t":"Gênero e Patriarcado. Gênero e Raça. Discriminação e Desigualdades de Gênero – questões centrais. Protocolo de julgamento com perspectiva de gênero. Protocolo para julgamento com perspectiva racial, instituído pela Resolução CNJ nº 598/2024. Igualdade de gênero e igualdade racial no âmbito do Poder Judiciário."},{"id":"tjrs:humanistica:F.1","n":"1","lvl":0,"sec":"F) Direito Digital e Tecnologia","t":"4ª Revolução industrial. Transformação Digital no Poder Judiciário. Tecnologia no contexto jurídico. Automação do processo. Inteligência Artificial e Direito. Audiências virtuais. Cortes remotas. Ciência de dados e Jurimetria. Resoluções do CNJ sobre inovações tecnológicas no Judiciário."},{"id":"tjrs:humanistica:F.2","n":"2","lvl":0,"sec":"F) Direito Digital e Tecnologia","t":"Persecução Penal e novas tecnologias. Crimes virtuais e cibersegurança. Deepweb e Darkweb. Provas digitais. Criptomoedas e Lavagem de dinheiro."},{"id":"tjrs:humanistica:F.3","n":"3","lvl":0,"sec":"F) Direito Digital e Tecnologia","t":"Noções gerais de contratos Inteligentes, Blockchain e Algoritmos."},{"id":"tjrs:humanistica:F.4","n":"4","lvl":0,"sec":"F) Direito Digital e Tecnologia","t":"LGPD e proteção de dados pessoais. Proteção de crianças e adolescentes em ambientes digitais e Estatuto Digital."},{"id":"tjrs:humanistica:G.1","n":"1","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Função judicial e pragmatismo. Antifundacionalismo. Contextualismo. Consequencialismo. Racionalismo e Empirismo. Dialética. Utilitarismo."},{"id":"tjrs:humanistica:G.2","n":"2","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Análise econômica do direito. Conceitos fundamentais. Racionalidade econômica. Eficiência processual. Métodos adequados de resolução de conflitos e acesso à Justiça. Demandas frívolas e de valor esperado negativo. Precedentes, estabilidade da jurisprudência e segurança jurídica. Coisa Julgada."},{"id":"tjrs:humanistica:G.3","n":"3","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Economia comportamental. Heurística e vieses cognitivos. A percepção de Justiça. Processo cognitivo de tomada de decisão."},{"id":"tjrs:humanistica:G.4","n":"4","lvl":0,"sec":"G) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Governança corporativa e Compliance no Brasil. Mecanismos de Combate às organizações criminosas e Lavagem de Dinheiro. Whistleblower."},{"id":"tjrs:humanistica:H.1","n":"1","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Conceitos Fundamentais do Direito da Antidiscriminação."},{"id":"tjrs:humanistica:H.2","n":"2","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Modalidades de Discriminação."},{"id":"tjrs:humanistica:H.3","n":"3","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Legislação antidiscriminação nacional e internacional."},{"id":"tjrs:humanistica:H.4","n":"4","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Conceitos Fundamentais do Racismo, Sexismo, Intolerância Religiosa, LGBTQIA+fobia."},{"id":"tjrs:humanistica:H.5","n":"5","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Ações Afirmativas."},{"id":"tjrs:humanistica:H.6","n":"6","lvl":0,"sec":"H) Direito da Antidiscriminação","t":"Direitos dos Povos indígenas e das comunidades tradicionais."}],"dh":[{"id":"tjrs:dh:1","n":"1","lvl":0,"t":"Teoria Geral dos Direitos Humanos."},{"id":"tjrs:dh:2","n":"2","lvl":0,"t":"Sistema global de proteção dos direitos humanos."},{"id":"tjrs:dh:3","n":"3","lvl":0,"t":"Sistema regional interamericano de proteção dos direitos humanos."},{"id":"tjrs:dh:4","n":"4","lvl":0,"t":"Controle de convencionalidade."},{"id":"tjrs:dh:5","n":"5","lvl":0,"t":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro."},{"id":"tjrs:dh:6","n":"6","lvl":0,"t":"Os direitos humanos na Constituição Federal de 1988."},{"id":"tjrs:dh:7","n":"7","lvl": const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const nfmt = (n) => Number(n || 0).toLocaleString('pt-BR');

function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'bad' ? ' bad' : '');

}

/* ---------- sanitização de HTML (conteúdo vindo da IA, de arquivos ou de backups) ---------- */
const TAGS_OK = new Set(['P','BR','EM','I','STRONG','B','U','MARK','UL','OL','LI','BLOCKQUOTE','TABLE','THEAD','TBODY','TR','TD','TH','SUB','SUP','S','H5','H6','SPAN','DIV']);
function limpaHTML(html, opts = {}) {
  const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const walk = (node) => {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 1) {
        if (!TAGS_OK.has(ch.tagName)) {
          if (['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(ch.tagName)) { ch.remove(); continue; }
          walk(ch); ch.replaceWith(...ch.childNodes); continue;
        }
        const align = ch.style && ch.style.textAlign;
        const bg = ch.style && ch.style.backgroundColor;
        for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
        if (align && ['left','right','center','justify'].includes(align)) ch.style.textAlign = align;
        if (ch.tagName === 'SPAN' && bg) { const m = document.createElement('mark'); m.append(...ch.childNodes); ch.replaceWith(m); walk(m); continue; }
        if (opts.semNegrito && (ch.tagName === 'STRONG' || ch.tagName === 'B')) { walk(ch); ch.replaceWith(...ch.childNodes); continue; }
        if (ch.tagName === 'I') { const e = document.createElement('em'); e.append(...ch.childNodes); ch.replaceWith(e); walk(e); continue; }
        if (ch.tagName === 'DIV') { const p = document.createElement('p'); p.append(...ch.childNodes); ch.replaceWith(p); walk(p); continue; }
        walk(ch);
      } else if (ch.nodeType !== 3) ch.remove();
    }
  };
  const root = doc.body.firstChild; walk(root);
  let out = root.innerHTML.trim();
  if (out && !/^<(p|ul|ol|blockquote|table|h5|h6)/i.test(out)) out = '<p>' + out + '</p>';
  return out;
}
const textoPlano = (html) => { const d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('catedra', 1);
      rq.onupgradeneeded = () => {
        const d = rq.result;
        for (const s of ['itens', 'notas', 'lotes', 'kv']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' });
      };
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); },
  all(store) { return new Promise((res, rej) => { const r = this.tx(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  put(store, obj) { return new Promise((res, rej) => { const r = this.tx(store, 'readwrite').put(obj); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  putMany(store, arr) { return new Promise((res, rej) => { const t = this.db.transaction(store, 'readwrite'); const s = t.objectStore(store); arr.forEach(o => s.put(o)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  del(store, id) { return new Promise((res, rej) => { const r = this.tx(store, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  clear(store) { return new Promise((res, rej) => { const r = this.tx(store, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  async kv(k, v) { if (v === undefined) { return new Promise(res => { const r = this.tx('kv').get(k); r.onsuccess = () => res(r.result ? r.result.v : undefined); r.onerror = () => res(undefined); }); } return this.put('kv', { k, v }); },
};

/* ---------- busca local (TF-IDF simples) para detectar repetições ---------- */
const STOP = new Set('a o e de da do das dos em no na nos nas um uma uns umas por para com sem que se ao aos as os ou nao sao ser foi como mais pelo pela pelos pelas sua seu suas seus este esta isso esse essa entre sobre ate quando qual quais tambem ja ha art lei n nº sob pode deve seja sera tem ter apos antes cada outro outra'.split(' '));
function tokens(t) {
  return semAcento(t).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.length > 7 ? w.slice(0, 7) : w);
}
function vetor(t) { const v = new Map(); for (const w of tokens(t)) v.set(w, (v.get(w) || 0) + 1); return v; }
function indiceSimilaridade(itens) {
  const df = new Map(); const vs = [];
  for (const it of itens) { const v = vetor((it.titulo || '') + ' ' + (it.ref || '') + ' ' + (it.assunto || '') + ' ' + textoPlano(it.html)); vs.push(v); for (const w of v.keys()) df.set(w, (df.get(w) || 0) + 1); }
  const N = itens.length + 1;
  const idf = (w) => Math.log(N / (1 + (df.get(w) || 0))) + 1;
  const pesa = (v) => { const o = new Map(); let n = 0; for (const [w, c] of v) { const x = (1 + Math.log(c)) * idf(w); o.set(w, x); n += x * x; } return { o, n: Math.sqrt(n) || 1 }; };
  const pv = vs.map(pesa);
  return {
    consulta(texto, k = 25) {
      const q = pesa(vetor(texto));
      const sc = pv.map((d, i) => { let s = 0; const [a, b] = q.o.size < d.o.size ? [q.o, d.o] : [d.o, q.o]; for (const [w, x] of a) { const y = b.get(w); if (y) s += x * y; } return [s / (q.n * d.n), i]; });
      return sc.filter(x => x[0] > 0.04).sort((a, b) => b[0] - a[0]).slice(0, k).map(([s, i]) => ({ item: itens[i], score: s }));
    },
  };
}
/** normaliza referências tipo "Súmula 479 do STJ" -> "sumula 479 stj" para comparação */
function chaveRef(ref) {
  const s = semAcento(ref || '').replace(/[ºª°.,/()\-–]/g, ' ').replace(/\b(n|no|numero|do|da|de)\b/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}
const semPontoNum = (s) => semAcento(s).replace(/(\d)\.(?=\d{3})/g, '$1');
function refsNoTexto(t) {
  const s = semPontoNum(t); const out = new Set();
  const re = /(sumula vinculante|sumula|tema|enunciado)\s*(?:n[º°o.]*\s*)?(\d{1,4})/g; let m;
  while ((m = re.exec(s))) out.add(m[1] + ' ' + m[2]);
  return out;
}

/* =========================================================
   IA — Claude (Anthropic) e Gemini (Google), chamadas diretas do navegador
   ========================================================= */
const IA = {
  chave(p) { return LS.get('chave.' + p, ''); },
  setChave(p, v) { LS.set('chave.' + p, v); },
  provedor() { return S.cfg.provedor; },
  pronto() { return !!this.chave(this.provedor()); },

  async listarModelos(p = this.provedor()) {
    const k = this.chave(p); if (!k) throw new Error('Informe a chave de API primeiro.');
    if (p === 'claude') {
      const r = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers: { 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } });
      if (!r.ok) throw new Error('Anthropic: ' + (await this._erro(r)));
      const j = await r.json();
      return (j.data || []).map(m => ({ id: m.id, nome: m.display_name || m.id, data: m.created_at || '' })).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    }
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(k));
    if (!r.ok) throw new Error('Gemini: ' + (await this._erro(r)));
    const j = await r.json();
    return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/i.test(m.name))
      .map(m => ({ id: m.name.replace(/^models\//, ''), nome: m.displayName || m.name, data: m.version || '' }))
      .sort((a, b) => b.id.localeCompare(a.id, undefined, { numeric: true }));
  },
  async modelo(p = this.provedor()) {
    const campo = p === 'claude' ? 'modeloClaude' : 'modeloGemini';
    if (S.cfg[campo]) return S.cfg[campo];
    // "automático": escolhe o mais recente disponível na conta
    const lista = await this.listarModelos(p);
    let m;
    if (p === 'claude') m = lista.find(x => /sonnet/i.test(x.id)) || lista[0];
    else m = lista.find(x => /pro/i.test(x.id) && !/vision|tts|image|embed/i.test(x.id)) || lista[0];
    if (!m) throw new Error('Nenhum modelo disponível para esta chave.');
    return m.id;
  },
  async _erro(r) { try { const j = await r.json(); return j.error?.message || j.error?.status || JSON.stringify(j).slice(0, 300); } catch { return r.status + ' ' + r.statusText; } },

  /**
   * Chamada com streaming. partes: [{texto}|{pdfBase64}]
   * onTok(n) recebe a quantidade aproximada de caracteres gerados.
   */
  async gerar({ sistema, partes, maxTokens = 16000, onTok, sinal, json = true }) {
    const p = this.provedor(); const k = this.chave(p);
    if (!k) throw new Error('Chave de API não configurada (Configurações).');
    const modelo = await this.modelo(p);
    let saida = '';
    if (p === 'claude') {
      const content = partes.map(x => x.pdfBase64
        ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: x.pdfBase64 } }
        : { type: 'text', text: x.texto });
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', signal: sinal,
        headers: { 'content-type': 'application/json', 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: modelo, max_tokens: maxTokens, system: sistema, stream: true, temperature: 0.1, messages: [{ role: 'user', content }] }),
      });
      if (!r.ok) {
        const msg = await this._erro(r);
        if (/temperature/i.test(msg)) { // alguns modelos não aceitam temperature
          return this._semTemp({ sistema, content, maxTokens, onTok, sinal, modelo, k });
        }
        throw new Error('Claude: ' + msg);
      }
      let parou = '';
      await this._sse(r, (ev) => {
        if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { saida += ev.delta.text; onTok && onTok(saida.length); }
        else if (ev.type === 'message_delta' && ev.delta?.stop_reason) parou = ev.delta.stop_reason;
        else if (ev.type === 'error') throw new Error('Claude: ' + (ev.error?.message || 'erro no fluxo'));
      });
      if (parou === 'max_tokens') saida += '\n/*TRUNCADO*/';
    } else {
      const parts = partes.map(x => x.pdfBase64 ? { inline_data: { mime_type: 'application/pdf', data: x.pdfBase64 } } : { text: x.texto });
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelo)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(k)}`;
      const r = await fetch(url, {
        method: 'POST', signal: sinal, headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: sistema }] }, contents: [{ role: 'user', parts }], generationConfig: Object.assign({ maxOutputTokens: Math.max(maxTokens, 8192), temperature: 0.1 }, json ? { responseMimeType: 'application/json' } : {}) }),
      });
      if (!r.ok) throw new Error('Gemini: ' + (await this._erro(r)));
      let fim = '';
      await this._sse(r, (ev) => {
        const c = ev.candidates?.[0];
        const t = (c?.content?.parts || []).map(x => x.text || '').join('');
        if (t) { saida += t; onTok && onTok(saida.length); }
        if (c?.finishReason) fim = c.finishReason;
        if (ev.error) throw new Error('Gemini: ' + ev.error.message);
      });
      if (fim === 'MAX_TOKENS') saida += '\n/*TRUNCADO*/';
    }
    return saida;
  },
  async _semTemp({ sistema, content, maxTokens, onTok, sinal, modelo, k }) {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: sinal,
      headers: { 'content-type': 'application/json', 'x-api-key': k, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: modelo, max_tokens: maxTokens, system: sistema, stream: true, messages: [{ role: 'user', content }] }),
    });
    if (!r.ok) throw new Error('Claude: ' + (await this._erro(r)));
    let saida = '', parou = '';
    await this._sse(r, (ev) => {
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { saida += ev.delta.text; onTok && onTok(saida.length); }
      else if (ev.type === 'message_delta' && ev.delta?.stop_reason) parou = ev.delta.stop_reason;
    });
    return parou === 'max_tokens' ? saida + '\n/*TRUNCADO*/' : saida;
  },
  async _sse(resp, cb) {
    const rd = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const linha = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!linha.startsWith('data:')) continue;
        const d = linha.slice(5).trim(); if (!d || d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch { continue; }
        cb(ev);
      }
    }
  },
};

/** extrai JSON robustamente de uma resposta */
function extraiJSON(txt) {
  let t = String(txt || '').replace(/\/\*TRUNCADO\*\/\s*$/, '').trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const a = t.indexOf('{'); if (a < 0) throw new Error('A IA não devolveu JSON.');
  t = t.slice(a);
  try { return JSON.parse(t); } catch {}
  const b = t.lastIndexOf('}'); if (b > 0) { try { return JSON.parse(t.slice(0, b + 1)); } catch {} }
  // tentativa de salvar resposta truncada: fecha a última unidade completa
  const k = t.lastIndexOf('},'); if (k > 0) { try { return JSON.parse(t.slice(0, k + 1) + ']}'); } catch {} }
  throw new Error('Não foi possível interpretar o JSON devolvido pela IA.');
}

/* ---------- divisão do texto em trechos ---------- */
function divideTexto(txt, alvo) {
  const pars = txt.replace(/\r/g, '').split(/\n\s*\n/);
  const out = []; let cur = '';
  for (let p of pars) {
    p = p.trim(); if (!p) continue;
    while (p.length > alvo * 1.3) { // parágrafo gigante: quebra por frases
      const corte = p.lastIndexOf('. ', alvo) > alvo * 0.5 ? p.lastIndexOf('. ', alvo) + 1 : alvo;
      if (cur) { out.push(cur); cur = ''; }
      out.push(p.slice(0, corte)); p = p.slice(corte).trim();
    }
    if ((cur + '\n\n' + p).length > alvo && cur) { out.push(cur); cur = p; }
    else cur = cur ? cur + '\n\n' + p : p;
  }
  if (cur) out.push(cur);
  return out;
}

const libs = {};
function carregaScript(src) {
  if (libs[src]) return libs[src];
  libs[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete libs[src]; rej(new Error('Não foi possível carregar ' + src + '. Verifique se a pasta lib/ está junto do index.html.')); }; document.head.appendChild(s); });
  return libs[src];
}
async function lePDF(file, de, ate, onPag) {
  await carregaScript('lib/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const ini = Math.max(1, de || 1), fim = Math.min(pdf.numPages, ate || pdf.numPages);
  const paginas = [];
  for (let n = ini; n <= fim; n++) {
    const pg = await pdf.getPage(n); const tc = await pg.getTextContent();
    let linhas = [], ultY = null, linha = '';
    for (const it of tc.items) {
      const y = Math.round(it.transform[5]);
      if (ultY !== null && Math.abs(y - ultY) > 2) { linhas.push(linha); linha = ''; }
      linha += it.str + (it.hasEOL ? '' : ''); ultY = y;
      if (it.hasEOL) { linhas.push(linha); linha = ''; ultY = null; }
    }
    if (linha) linhas.push(linha);
    paginas.push(linhas.map(l => l.trim()).filter(Boolean).join('\n'));
    onPag && onPag(n - ini + 1, fim - ini + 1);
  }
  // remove cabeçalhos/rodapés repetidos (linhas que aparecem em >40% das páginas)
  const cont = new Map();
  for (const p of paginas) for (const l of new Set(p.split('\n').map(x => x.trim()).filter(x => x.length > 3 && x.length < 120))) cont.set(l, (cont.get(l) || 0) + 1);
  const ruido = new Set([...cont].filter(([l, c]) => paginas.length >= 4 && c / paginas.length > 0.4).map(([l]) => l));
  const texto = paginas.map(p => p.split('\n').filter(l => !ruido.has(l.trim()) && !/^\d{1,4}$/.test(l.trim())).join('\n')).join('\n\n');
  // junta linhas quebradas no meio da frase
  const junto = texto.replace(/-\n(?=[a-zà-ú])/g, '').replace(/([^\n.:;!?])\n(?=[a-zà-ú(])/g, '$1 ');
  return { texto: junto, paginas: pdf.numPages, lidas: fim - ini + 1, buf };
}
async function leDOCX(file) {
  await carregaScript('lib/mammoth.browser.min.js');
  const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
  const d = document.createElement('div'); d.innerHTML = r.value;
  d.querySelectorAll('p,li,h1,h2,h3,h4,h5,h6,tr').forEach(e => e.append('\n\n'));
  return d.textContent.replace(/\n{3,}/g, '\n\n');
}
async function leArquivo(file, opts = {}) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.pdf')) return lePDF(file, opts.de, opts.ate, opts.onPag);
  if (n.endsWith('.docx')) return { texto: await leDOCX(file) };
  if (n.endsWith('.html') || n.endsWith('.htm')) { const d = document.createElement('div'); d.innerHTML = await file.text(); d.querySelectorAll('p,li,h1,h2,h3,h4,tr,div').forEach(e => e.append('\n\n')); return { texto: d.textContent.replace(/\n{3,}/g, '\n\n') }; }
  return { texto: await file.text() };
}

      if (/\/\*TRUNCADO\*\/\s*$/.test(resp)) logP('  Aviso: resposta cortada pelo limite de saída; reduza o tamanho do trecho se faltar conteúdo.');
      let js;
      try { js = extraiJSON(resp); } catch (e) { logP('  Falha ao interpretar resposta: ' + e.message); continue; }
      const uns = (js.unidades || []).map(u => normalizaUnidade(u, discs, tr.nome));
      lote.propostas.push(...uns);
      logP(`  ${uns.length} unidade(s) em ${Math.round((Date.now() - t0) / 1000)} s — ${contaStatus(uns)}`);
      await salvaLote(lote); // salva progressivamente
    }
    dedupInterna(lote.propostas);
    $('#progB').style.width = '100%';
    if (!lote.propostas.length) { await removeLote(lote.id); throw new Error('Nenhuma unidade foi produzida.'); }
    await salvaLote(lote);
    await registraHistorico({ fonte, tipo: 'lote', n: lote.propostas.length, resumo: contaStatus(lote.propostas) });
    toast(`Análise concluída: ${lote.propostas.length} unidades para triagem.`);
    abreLote(lote.id);
  } catch (e) {
    if (e.name === 'AbortError') logP('Análise interrompida. O que já foi analisado ficou salvo na triagem.');
    else { logP('Erro: ' + e.message); toast(e.message, 'bad'); }
  } finally {
    Ingest.rodando = null;
    const a = $('#goIA'), b = $('#goManual'); if (a) a.disabled = !IA.pronto(); if (b) b.disabled = false;
  }
}
async function comRetentativa(fn, sinal) {
  for (let t = 0; ; t++) {
    try { return await fn(); }
    catch (e) {
      if (e.name === 'AbortError' || t >= 2 || !/overload|rate|429|529|500|502|503|timeout|network|Failed to fetch/i.test(e.message)) throw e;
      logP(`  Serviço ocupado (${e.message.slice(0, 80)}); nova tentativa em ${5 * (t + 1)} s…`);
      await sleep(5000 * (t + 1));
      if (sinal?.aborted) throw e;
    }
  }
}

async function aplicaDecisoes() {
  const l = Tri.lote; let inc = 0, mes = 0, sub = 0, desc = 0;
  const resta = [];
  for (const p of l.propostas) {
    const d = p.decisao || DEC_PADRAO[p.status];
    const html = limpaHTML(p.html, { semNegrito: S.cfg.semNegrito });
    if (d === 'descartar') { desc++; continue; }
    if (d === 'incluir' || ((d === 'mesclar' || d === 'substituir') && !(p.relacionado && S.itens.get(p.relacionado) && !S.itens.get(p.relacionado).del))) {
      const it = { id: uid(), disc: p.disc, tipo: p.tipo, titulo: p.titulo, ref: p.ref, assunto: p.assunto, html, pontos: p.pontos, fontes: p.fonte ? [p.fonte] : [], criado: now() };
      if (p.status === 'divergente' && p.relacionado) { it.divergeDe = p.relacionado; it.notaDiv = p.nota; }
      await salvaItem(it, { silencioso: true }); inc++; continue;
    }
    const ex = S.itens.get(p.relacionado);
    if (d === 'mesclar') {
      const add = limpaHTML(p.acrescimo || p.html, { semNegrito: S.cfg.semNegrito });
      ex.html = (ex.html || '') + add;
      mes++;
    } else { ex.html = html; ex.tipo = p.tipo; if (p.titulo) ex.titulo = p.titulo; if (p.ref) ex.ref = p.ref; sub++; }
    ex.pontos = [...new Set([...(ex.pontos || []), ...p.pontos])];
    if (p.assunto && !ex.assunto) ex.assunto = p.assunto;
    if (p.fonte) ex.fontes = [...new Set([...(ex.fontes || []), p.fonte])];
    await salvaItem(ex, { silencioso: true });
  }
  await removeLote(l.id);
  await registraHistorico({ fonte: l.fonte, tipo: 'aplicado', resumo: `${inc} incluído(s), ${mes} mesclado(s), ${sub} substituído(s), ${desc} descartado(s)` });
  Sync.agenda();
  toast(`${inc} incluído(s), ${mes} mesclado(s), ${sub} substituído(s), ${desc} descartado(s).`);
  desenhaDisciplinas();
  const d = l.propostas.find(p => p.decisao !== 'descartar')?.disc;
  d ? abreDisciplina(d) : navega('triagem');
}

function modal({ titulo, corpo, botoes = [], largo = false, aoAbrir }) {

  const fecha = () => { ov.remove(); document.removeEventListener('keydown', esc); };
  const esc = (e) => { if (e.key === 'Escape') fecha(); };
  document.addEventListener('keydown', esc);
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) fecha(); });
  $('[data-x]', ov).onclick = fecha;
  botoes.forEach((b, i) => $(`[data-b="${i}"]`, ov).onclick = async () => { const r = b.fn ? await b.fn(ov) : true; if (r !== false) fecha(); });
  document.body.appendChild(ov);

  return { ov, fecha };
}

function numRef(it) { const m = String(it.ref || it.titulo || '').replace(/(\d)\.(?=\d{3})/g, '$1').match(/\d+/); return m ? +m[0] : 1e9; }

function modeloDoc(disc, lente, { pontos: filtroPontos = null, tipos = null } = {}) {
  const ps = pontosDaDisc(lente, disc);
  const ids = new Set(ps.map(p => p.id));
  const todos = itensVivos().filter(i => !tipos || tipos.includes(i.tipo));
  const porPonto = new Map(ps.map(p => [p.id, []]));
  for (const it of todos) for (const pid of it.pontos || []) if (porPonto.has(pid)) porPonto.get(pid).push(it);
  const semPonto = todos.filter(i => i.disc === disc && !(i.pontos || []).some(pid => ids.has(pid)));
  let secoes = ps.map(p => ({ ponto: p, itens: porPonto.get(p.id).sort(ordenaItens) }));
  if (filtroPontos) secoes = secoes.filter(s => filtroPontos.includes(s.ponto.id));
  return { secoes, semPonto: filtroPontos && !filtroPontos.includes('__sem') ? [] : semPonto.sort(ordenaItens) };
}
function agrupa(itens) {

  const k2 = modo === 'tipo' ? (i) => i.assunto || '' : (i) => i.tipo;
  const m1 = new Map();
  for (const it of itens) { const a = k1(it); if (!m1.has(a)) m1.set(a, []); m1.get(a).push(it); }
  let chaves = [...m1.keys()];
  chaves.sort(modo === 'tipo' ? (a, b) => TIPO_ORD[a] - TIPO_ORD[b] : (a, b) => (a === 'Aspectos gerais' ? -1 : b === 'Aspectos gerais' ? 1 : a.localeCompare(b, 'pt')));
  return chaves.map(c => {
    const m2 = new Map();
    for (const it of m1.get(c)) { const b = k2(it); if (!m2.has(b)) m2.set(b, []); m2.get(b).push(it); }
    let c2 = [...m2.keys()];
    c2.sort(modo === 'tipo' ? (a, b) => (a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'pt')) : (a, b) => TIPO_ORD[a] - TIPO_ORD[b]);

  });
}

function htmlDocumento(disc, lente, opts = {}) {

function opcoesEscopo(escopo, ids) {

  if (escopo === 'lista') return { pontos: ids };
  return {};
}
async function exporta(fmt, escopo, ids) {
  const opts = Object.assign({ tipos: Cad.tipos }, opcoesEscopo(escopo, ids));
  if (fmt === 'pdf') return imprime(Cad.disc, S.lente, opts);
  try { toast('Gerando o arquivo Word…'); await exportaDocx(Cad.disc, S.lente, opts); }
  catch (e) { console.error(e); toast('Falha ao gerar o Word: ' + e.message, 'bad'); }
}
function imprime(disc, lente, opts) {
  const pa = $('#printArea');
  pa.innerHTML = `<div class="page" style="${estiloPagina()}">${htmlDocumento(disc, lente, Object.assign({ editavel: false }, opts))}</div>`;
  document.title = `${discNome(disc)} — ${edital(lente).sigla}`;
  setTimeout(() => { window.print(); setTimeout(() => { document.title = 'Cátedra'; }, 500); }, 80);
}
function baixa(blob, nome) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
const nomeArq = (s) => s.replace(/[\\/:*?"<>|]/g, '-');

async function exportaDocx(disc, lente, opts) {
  await carregaScript('lib/docx.js');
  const D = docx; const e = edital(lente);
  const fonte = S.cfg.fonteDoc || 'Cambria';
  const linha = Math.round((S.cfg.entrelinha || 1.5) * 240);
  const tam = Math.round((S.cfg.tamDoc || 12) * 2);
  const J = D.AlignmentType.JUSTIFIED;
  let numInst = 0;

  /* ---- HTML -> parágrafos do Word ---- */
  function runs(node, f = {}) {
    const out = [];
    for (const ch of node.childNodes) {
      if (ch.nodeType === 3) { const t = ch.textContent.replace(/\s+/g, ' '); if (t) out.push(new D.TextRun({ text: t, italics: f.i, bold: f.b, underline: f.u ? {} : undefined, highlight: f.m ? 'yellow' : undefined, strike: f.s, superScript: f.sup, subScript: f.sub, font: fonte })); continue; }
      if (ch.nodeType !== 1) continue;
      const t = ch.tagName;
      if (t === 'BR') { out.push(new D.TextRun({ break: 1 })); continue; }
      const g = Object.assign({}, f);
      if (t === 'EM' || t === 'I') g.i = !f.i; if (t === 'STRONG' || t === 'B') g.b = true; if (t === 'U') g.u = true; if (t === 'MARK') g.m = true; if (t === 'S') g.s = true; if (t === 'SUP') g.sup = true; if (t === 'SUB') g.sub = true;
      out.push(...runs(ch, g));
    }
    return out;
  }
  function alinh(el) { const a = el.style && el.style.textAlign; return a === 'center' ? D.AlignmentType.CENTER : a === 'right' ? D.AlignmentType.RIGHT : a === 'left' ? D.AlignmentType.LEFT : J; }
  function blocos(html, extra = {}) {
    const d = document.createElement('div'); d.innerHTML = html || '';
    const out = []; let solto = [];
    const fechaSolto = () => { if (solto.length) { const w = document.createElement('p'); solto.forEach(n => w.appendChild(n.cloneNode(true))); out.push(new D.Paragraph(Object.assign({ children: runs(w), alignment: J }, extra))); solto = []; } };
    const lista = (el, nivel, numerada, inst) => {
      for (const li of el.children) {
        if (li.tagName !== 'LI') continue;
        const sub = [...li.children].filter(c => c.tagName === 'UL' || c.tagName === 'OL');
        const clone = li.cloneNode(true); clone.querySelectorAll('ul,ol').forEach(x => x.remove());
        out.push(new D.Paragraph(Object.assign({ children: runs(clone), alignment: J, spacing: { after: 60, line: linha } }, numerada ? { numbering: { reference: 'num', level: Math.min(nivel, 2), instance: inst } } : { bullet: { level: Math.min(nivel, 2) } }, extra.indent ? {} : {})));
        for (const s of sub) lista(s, nivel + 1, s.tagName === 'OL', s.tagName === 'OL' ? ++numInst : 0);
      }
    };
    for (const ch of d.childNodes) {
      if (ch.nodeType === 3 || (ch.nodeType === 1 && ['EM','I','STRONG','B','U','MARK','SPAN','S','SUP','SUB','BR'].includes(ch.tagName))) { solto.push(ch); continue; }
      fechaSolto();
      if (ch.nodeType !== 1) continue;
      const t = ch.tagName;
      if (t === 'P' || t === 'H5' || t === 'H6' || t === 'DIV') out.push(new D.Paragraph(Object.assign({ children: runs(ch, t.startsWith('H') ? { b: !S.cfg.semNegrito } : {}), alignment: alinh(ch) }, extra)));
      else if (t === 'BLOCKQUOTE') {
        const inner = ch.querySelector('p') ? blocos(ch.innerHTML, { style: 'Citacao' }) : [new D.Paragraph({ children: runs(ch), style: 'Citacao', alignment: J })];
        out.push(...inner);
      }
      else if (t === 'UL' || t === 'OL') lista(ch, 0, t === 'OL', t === 'OL' ? ++numInst : 0);
      else if (t === 'TABLE') {
        const rows = [...ch.querySelectorAll('tr')].map(tr => new D.TableRow({ children: [...tr.children].map(td => new D.TableCell({ children: [new D.Paragraph({ children: runs(td, td.tagName === 'TH' ? { b: !S.cfg.semNegrito } : {}), spacing: { after: 0, line: 276 } })], shading: td.tagName === 'TH' ? { type: D.ShadingType.CLEAR, fill: 'F3EFE6', color: 'auto' } : undefined, margins: { top: 60, bottom: 60, left: 100, right: 100 } })) }));
        if (rows.length) out.push(new D.Table({ rows, width: { size: 100, type: D.WidthType.PERCENTAGE }, borders: (() => { const b = { style: D.BorderStyle.SINGLE, size: 4, color: 'CFC8BA' }; return { top: b, bottom: b, left: b, right: b, insideHorizontal: b, insideVertical: b }; })() }), new D.Paragraph({ children: [], spacing: { after: 60 } }));
      }
      else out.push(new D.Paragraph(Object.assign({ children: runs(ch), alignment: J }, extra)));
    }
    fechaSolto();
    return out;
  }

  /* ---- documento ---- */
  const mod = modeloDoc(disc, lente, opts);
  const filhos = [];
  filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Caderno sistematizado · edital ' + e.sigla, smallCaps: true, color: '6B6457', size: 22 })], spacing: { before: 2400, after: 120 } }));
  filhos.push(new D.Paragraph({ text: discNome(disc), style: 'Title' }));
  filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: e.nome, color: '6B6457', size: 22 })], spacing: { after: 60 } }));
  filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Versão de ' + fmtData(now()), color: '6B6457', size: 22 })], spacing: { after: 600 } }));
  filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Sumário', smallCaps: true, size: 28, color: '1F2A44' })], spacing: { after: 120 } }));
  filhos.push(new D.TableOfContents('Sumário', { hyperlink: true, headingStyleRange: '1-2' }));
  filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Se o sumário aparecer vazio, clique nele com o botão direito e escolha "Atualizar campo".', italics: true, size: 18, color: '9A9386' })] }));
  filhos.push(new D.Paragraph({ children: [new D.PageBreak()] }));

  const blocoItens = (itens) => {
    for (const g of agrupa(itens)) {
      filhos.push(new D.Paragraph({ text: g.h3, heading: D.HeadingLevel.HEADING_2 }));
      for (const x of g.grupos) {
        if (x.h4) filhos.push(new D.Paragraph({ text: x.h4, heading: D.HeadingLevel.HEADING_3 }));
        for (const it of x.itens) {
          const tr = [new D.TextRun({ text: it.titulo || TIPO_CURTO[it.tipo], smallCaps: true })];
          if (!refRedundante(it)) tr.push(new D.TextRun({ text: '   ' + it.ref, color: '6B6457', size: tam - 3 }));
          if (it.estrela) tr.push(new D.TextRun({ text: '  ★', color: 'B8860B' }));
          if (it.divergeDe) tr.push(new D.TextRun({ text: '  [divergência' + (it.notaDiv ? ': ' + it.notaDiv : '') + ']', color: 'A2372B', size: tam - 4 }));
          filhos.push(new D.Paragraph({ children: tr, style: 'ItemTitulo' }));
          filhos.push(...blocos(it.html));
        }
      }
    }
  };
  let secAnt = null;
  for (const s of mod.secoes) {
    const p = s.ponto; const nota = S.notas.get(p.id); const temNota = nota && textoPlano(nota.html);
    if (opts.soComMaterial && !s.itens.length && !temNota) continue;
    if (p.sec && p.sec !== secAnt) { filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: p.sec, smallCaps: true, color: '6B6457', size: 26 })], spacing: { before: 480, after: 120 }, keepNext: true })); secAnt = p.sec; }
    filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Ponto ' + rotuloPonto(p) + '  ', smallCaps: true, color: e.cor.replace('#', '') }), new D.TextRun({ text: tituloPonto(p) })], heading: D.HeadingLevel.HEADING_1 }));
    if (semAcento(p.t).replace(/[.;:\s]+$/, '') !== semAcento(tituloPonto(p))) filhos.push(new D.Paragraph({ text: p.t, style: 'Ementa' }));
    if (!s.itens.length && !temNota) filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Nenhum material neste ponto.', italics: true, color: 'A39C8E' })] }));
    blocoItens(s.itens);
    if (temNota) { filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Anotações do ponto', smallCaps: true, color: '8A7B55' })], spacing: { before: 200, after: 60 }, keepNext: true })); filhos.push(...blocos(nota.html, { style: 'Nota' })); }
  }
  if (mod.semPonto.length) {
    filhos.push(new D.Paragraph({ children: [new D.TextRun({ text: 'Sem ponto  ', smallCaps: true, color: '8A8375' }), new D.TextRun({ text: 'Material sem correspondência no edital ' + e.sigla })], heading: D.HeadingLevel.HEADING_1 }));
    blocoItens(mod.semPonto);
  }

  const cor = '1F2A44';
  const doc = new D.Document({
    creator: 'Cátedra', title: discNome(disc) + ' — ' + e.sigla, description: 'Caderno sistematizado',
    features: { updateFields: true },
    styles: {
      default: {
        document: { run: { font: fonte, size: tam }, paragraph: { spacing: { after: 120, line: linha } } },
        title: { run: { font: fonte, size: 56, color: cor, smallCaps: true, bold: false }, paragraph: { spacing: { after: 160 } } },
        heading1: { run: { font: fonte, size: 30, color: cor, bold: false }, paragraph: { spacing: { before: 480, after: 80 }, keepNext: true, border: { top: { style: D.BorderStyle.SINGLE, size: 4, color: 'E6E1D7', space: 8 } } } },
        heading2: { run: { font: fonte, size: 25, color: '8A5A14', smallCaps: true, bold: false }, paragraph: { spacing: { before: 280, after: 100 }, keepNext: true, border: { bottom: { style: D.BorderStyle.SINGLE, size: 4, color: 'EFE7D6', space: 2 } } } },
        heading3: { run: { font: fonte, size: 24, color: '2F3B55', italics: true, bold: false }, paragraph: { spacing: { before: 200, after: 60 }, keepNext: true } },
      },
      paragraphStyles: [
        { id: 'Ementa', name: 'Ementa do ponto', basedOn: 'Normal', run: { italics: true, size: 20, color: '6B6457' }, paragraph: { alignment: J, spacing: { after: 160, line: 264 } } },
        { id: 'ItemTitulo', name: 'Título do item', basedOn: 'Normal', run: { color: '2C2C2C' }, paragraph: { keepNext: true, spacing: { before: 160, after: 40 } } },
        { id: 'Citacao', name: 'Citação recuada', basedOn: 'Normal', run: { size: tam - 2 }, paragraph: { indent: { left: 1134 }, alignment: J, spacing: { after: 100, line: 276 } } },
        { id: 'Nota', name: 'Anotação do ponto', basedOn: 'Normal', paragraph: { indent: { left: 284 }, border: { left: { style: D.BorderStyle.SINGLE, size: 12, color: 'C9B98F', space: 8 } }, shading: { type: D.ShadingType.CLEAR, fill: 'FCFAF3', color: 'auto' } } },
      ],
    },
    numbering: { config: [{ reference: 'num', levels: [
      { level: 0, format: D.LevelFormat.DECIMAL, text: '%1.', alignment: D.AlignmentType.LEFT, style: { paragraph: { indent: { left: 720, hanging: 360 } } } },
      { level: 1, format: D.LevelFormat.LOWER_LETTER, text: '%2)', alignment: D.AlignmentType.LEFT, style: { paragraph: { indent: { left: 1080, hanging: 360 } } } },
      { level: 2, format: D.LevelFormat.LOWER_ROMAN, text: '%3.', alignment: D.AlignmentType.LEFT, style: { paragraph: { indent: { left: 1440, hanging: 360 } } } },
    ] }] },
    sections: [{
      properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1418, bottom: 1418, left: 1701, right: 1134 } } },
      headers: { default: new D.Header({ children: [new D.Paragraph({ alignment: D.AlignmentType.RIGHT, children: [new D.TextRun({ text: discNome(disc) + ' · ' + e.sigla, smallCaps: true, size: 18, color: '9A9386' })] })] }) },
      footers: { default: new D.Footer({ children: [new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ children: [D.PageNumber.CURRENT], size: 20, color: '6B6457' })] })] }) },
      children: filhos,
    }],
  });
  const blob = await D.Packer.toBlob(doc);
  baixa(blob, nomeArq(`Cátedra - ${discNome(disc)} - ${e.sigla} - ${fmtData(now()).replace(/\//g, '-')}.docx`));
  toast('Arquivo Word gerado.');
}

/* =========================================================
   Backup (.json) e sincronização entre dispositivos via GitHub
   ========================================================= */
function pacote() {
  return {
    app: 'Cátedra', formato: 1, exportado: now(),
    itens: [...S.itens.values()], notas: [...S.notas.values()], lotes: [...S.lotes.values()],
    historico: S.historico,
    estrutura: S.estrutura.editadoLocalmente ? S.estrutura : null,
  };
}
/** mescla um pacote no banco local (vence a versão mais recente de cada registro) */
async function mesclaPacote(p) {
  if (!p || p.app !== 'Cátedra') throw new Error('Arquivo não reconhecido como backup do Cátedra.');
  let n = 0;
  const mistura = async (store, mapa, arr) => {
    const mud = [];
    for (const r of arr || []) { const l = mapa.get(r.id); if (!l || String(r.atualizado || '') > String(l.atualizado || '')) { mapa.set(r.id, r); mud.push(r); } }
    if (mud.length) await DB.putMany(store, mud); n += mud.length;
  };
  await mistura('itens', S.itens, p.itens);
  await mistura('notas', S.notas, p.notas);
  await mistura('lotes', S.lotes, p.lotes);
  if (Array.isArray(p.historico)) {
    const ids = new Set(S.historico.map(x => x.id));
    S.historico = [...S.historico, ...p.historico.filter(x => !ids.has(x.id))].sort((a, b) => b.data.localeCompare(a.data)).slice(0, 300);
    await DB.kv('historico', S.historico);
  }
  if (p.estrutura && p.estrutura.editais && (!S.estrutura.editadoLocalmente || (p.estrutura.alterado || '') > (S.estrutura.alterado || ''))) {
    S.estrutura = p.estrutura; await DB.kv('estrutura', S.estrutura); indexaEstrutura();
  }
  return n;
}
function exportaBackup() {
  const blob = new Blob([JSON.stringify(pacote())], { type: 'application/json' });
  baixa(blob, `catedra-backup-${fmtData(now()).replace(/\//g, '-')}.json`);
}
async function importaBackup(file) {
  try { const n = await mesclaPacote(JSON.parse(await file.text())); toast(`${n} registro(s) incorporado(s).`); desenhaDisciplinas(); atualizaBadges(); navega(S.rota === 'disc' ? 'painel' : S.rota); Sync.agenda(); }
  catch (e) { toast(e.message, 'bad'); }
}

/* ---------- GitHub ---------- */
const Sync = {
  cfg() { return LS.get('github', { owner: '', repo: '', branch: 'main', path: 'catedra-dados.json', token: '', auto: true }); },
  setCfg(c) { LS.set('github', c); },
  ativo() { const c = this.cfg(); return !!(c.owner && c.repo && c.token); },
  sha: LS.get('github.sha', null),
  ocupado: false, pendente: false, _t: null,
  status(txt, cls) { $('#syncTxt').textContent = txt; $('#syncDot').className = 'dot ' + (cls || ''); },
  agenda() {
    S.sujo = true;
    if (!this.ativo()) { this.status('Somente neste dispositivo', ''); return; }
    if (!this.cfg().auto) { this.status('Alterações não enviadas', 'warn'); return; }
    this.status('Alterações pendentes…', 'warn');
    clearTimeout(this._t); this._t = setTimeout(() => this.sincroniza(), 4000);
  },
  api(c, path = '') { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}${path}`; },
  hdr(c, extra = {}) { return Object.assign({ Authorization: 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28' }, extra); },
  async baixa(c) {
    const r = await fetch(this.api(c, '?ref=' + encodeURIComponent(c.branch)) + '&t=' + Date.now(), { headers: this.hdr(c, { Accept: 'application/vnd.github+json' }), cache: 'no-store' });
    if (r.status === 404) return { sha: null, dados: null };
    if (!r.ok) throw new Error('GitHub: ' + r.status + ' ' + ((await r.json().catch(() => ({}))).message || ''));
    const j = await r.json();
    let texto;
    if (j.content && j.encoding === 'base64') texto = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), ch => ch.charCodeAt(0)));
    else { // arquivos acima de 1 MB
      const r2 = await fetch(this.api(c, '?ref=' + encodeURIComponent(c.branch)) + '&t=' + Date.now(), { headers: this.hdr(c, { Accept: 'application/vnd.github.raw' }), cache: 'no-store' });
      if (!r2.ok) throw new Error('GitHub (arquivo grande): ' + r2.status);
      texto = await r2.text();
    }
    return { sha: j.sha, dados: JSON.parse(texto) };
  },
  async envia(c, sha) {
    const bytes = new TextEncoder().encode(JSON.stringify(pacote()));
    let b64 = ''; for (let i = 0; i < bytes.length; i += 0x8000) b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const body = { message: 'Cátedra: sincronização ' + fmtDataHora(now()), content: btoa(b64), branch: c.branch };
    if (sha) body.sha = sha;
    const r = await fetch(this.api(c), { method: 'PUT', headers: this.hdr(c, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) return null; // outro dispositivo gravou antes: baixar e tentar de novo
    if (!r.ok) throw new Error('GitHub: ' + r.status + ' ' + ((await r.json().catch(() => ({}))).message || ''));
    return (await r.json()).content.sha;
  },
  async sincroniza(manual = false) {
    if (!this.ativo()) { if (manual) { toast('Configure a sincronização com o GitHub em Configurações.'); navega('config'); } return; }
    if (this.ocupado) { this.pendente = true; return; }
    this.ocupado = true; this.status('Sincronizando…', 'warn');
    const c = this.cfg();
    try {
      for (let tent = 0; tent < 3; tent++) {
        const { sha, dados } = await this.baixa(c);
        let mud = 0; if (dados) mud = await mesclaPacote(dados);
        const novo = await this.envia(c, sha);
        if (novo) { this.sha = novo; LS.set('github.sha', novo); S.sujo = false; this.status('Sincronizado ' + fmtDataHora(now()).split(' ')[1], 'ok'); if (mud) { desenhaDisciplinas(); atualizaBadges(); if (S.rota === 'painel') navega('painel'); } if (manual) toast(mud ? `Sincronizado: ${mud} registro(s) recebido(s).` : 'Sincronizado.'); break; }
        await sleep(800);
      }
    } catch (e) { this.status('Falha na sincronização', 'bad'); if (manual) toast(e.message, 'bad'); console.warn(e); }
    finally { this.ocupado = false; if (this.pendente) { this.pendente = false; setTimeout(() => this.sincroniza(), 1500); } }
  },
  async testa(c) {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: this.hdr(c, { Accept: 'application/vnd.github+json' }) });
    if (!r.ok) throw new Error(r.status === 404 ? 'Repositório não encontrado ou token sem acesso a ele.' : 'GitHub: ' + r.status);
    const j = await r.json();
    return j.private ? 'Conexão ok. Repositório privado (recomendado).' : 'Conexão ok. Atenção: o repositório é PÚBLICO — seu material ficará visível a qualquer pessoa.';
  },
};

/* =========================================================
   Telas: navegação, painel, busca, editais, configurações
   ========================================================= */
function marcaNav(r) { $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === r)); }
function navega(r) {
  S.rota = r; marcaNav(r); fechaMenuLateral();
  if (r !== 'disc') { Cad.disc = null; desenhaDisciplinas(); }
  ({ painel: viewPainel, inserir: viewInserir, triagem: viewTriagem, editais: viewEditais, config: viewConfig }[r] || viewPainel)();
  $('#view').scrollTop = 0;
}
function fechaMenuLateral() { $('#side').classList.remove('open'); $('.scrim.side-s')?.remove(); }
function atualizaBadges() { const n = lotesVivos().reduce((a, l) => a + l.propostas.length, 0); const b = $('#triBadge'); b.textContent = n; b.className = 'badge' + (n ? ' acc' : ''); }

function cobertura(disc, edId) {
  const ps = pontosDaDisc(edId, disc); if (!ps.length) return null;
  const com = new Set(); for (const it of itensVivos()) for (const p of it.pontos || []) com.add(p);
  const c = ps.filter(p => com.has(p.id)).length;
  return { c, t: ps.length, pct: Math.round(c / ps.length * 100) };
}
function desenhaLente() {
  $('#lens').innerHTML = S.estrutura.editais.map(e => `<button data-l="${e.id}" class="${S.lente === e.id ? 'on' : ''}" style="--c:${e.cor}" title="${h(e.nome)}"><i></i>${h(e.sigla)}</button>`).join('');
  $$('#lens button').forEach(b => b.onclick = () => { S.lente = b.dataset.l; LS.set('lente', S.lente); desenhaLente(); desenhaDisciplinas(); if (S.rota === 'disc' && Cad.disc) abreDisciplina(Cad.disc); else if (S.rota === 'painel') viewPainel(); });
  const e = edital(S.lente); document.documentElement.style.setProperty('--lens', e.cor);
  $('#lensName').textContent = 'lente ' + e.sigla;
}
function desenhaDisciplinas() {
  const vivos = itensVivos();
  const por = new Map(); vivos.forEach(i => por.set(i.disc, (por.get(i.disc) || 0) + 1));

/* ---------- busca ---------- */
function busca(q) {
  q = q.trim(); if (!q) return;
  S.rota = 'busca'; marcaNav(null);
  const termos = semAcento(q).split(/\s+/).filter(Boolean);
  const res = [];
  for (const it of itensVivos()) {
    const campo = semAcento([it.titulo, it.ref, it.assunto, textoPlano(it.html)].join(' '));
    if (termos.every(t => campo.includes(t))) {
      const tit = semAcento((it.titulo || '') + ' ' + (it.ref || ''));
      res.push({ it, sc: termos.filter(t => tit.includes(t)).length * 10 + (it.estrela ? 1 : 0) });
    }
  }
  res.sort((a, b) => b.sc - a.sc);
  const marca = (txt) => { let s = h(txt); for (const t of termos) { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').split('').map(ch => { const m = { a: '[aáàâã]', e: '[eéê]', i: '[ií]', o: '[oóôõ]', u: '[uúü]', c: '[cç]' }; return m[ch] || ch; }).join('') + ')', 'gi'); s = s.replace(re, '<mark>$1</mark>'); } return s; };
  const trecho = (it) => { const t = textoPlano(it.html); const i = semAcento(t).indexOf(termos[0]); const a = Math.max(0, i - 120); return (a ? '…' : '') + t.slice(a, a + 320) + (t.length > a + 320 ? '…' : ''); };
  $('#view').innerHTML = `<div class="wrap"><h1 class="pg">Busca</h1><p class="sub">${res.length} resultado(s) para “${h(q)}”</p>
    <div class="res">${res.slice(0, 200).map(({ it }) => `<div class="r" data-id="${it.id}"><div class="row" style="gap:8px"><span class="chip acc">${h(TIPO_CURTO[it.tipo])}</span><span class="small muted">${h(discNome(it.disc))}${it.assunto ? ' · ' + h(it.assunto) : ''}</span><span class="sp"></span>${(it.pontos || []).slice(0, 4).map(p => { const x = PONTO.get(p); return x ? `<span class="chip ed" style="--c:${x.e.cor}">${x.e.sigla} ${h(rotuloPonto(x.p))}</span>` : ''; }).join('')}</div>
    <div class="t" style="margin-top:6px">${marca(it.titulo || '')}${it.ref ? ` <span class="muted small">${marca(it.ref)}</span>` : ''}</div><div class="x">${marca(trecho(it))}</div></div>`).join('') || '<div class="empty">Nada encontrado.</div>'}</div></div>`;
  $$('.res .r').forEach(r => r.onclick = () => { const it = S.itens.get(r.dataset.id); abreDisciplina(it.disc, { item: it.id }); });
}

    <div class="small muted" style="margin-top:6px">A IA identifica disciplinas e pontos e os associa às suas 20 disciplinas. Sem IA, o edital é criado vazio para preenchimento manual.</div>`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Criar vazio', fn: (ov) => criaEdital(ov, false) }, { txt: 'Estruturar com IA', cls: 'pri', fn: (ov) => criaEdital(ov, true) }] });
}
async function criaEdital(ov, comIA) {
  const sig = $('#neS', ov).value.trim(), nome = $('#neN', ov).value.trim() || sig, cor = $('#neC', ov).value, txt = $('#neT', ov).value.trim();
  if (!sig) { toast('Informe a sigla.'); return false; }
  const id = semAcento(sig).replace(/[^a-z0-9]/g, '') + (edital(semAcento(sig).replace(/[^a-z0-9]/g, '')) ? uid().slice(-3) : '');
  const e = { id, sigla: sig, nome, cor, pontos: {}, vistas: {}, proprio: true };
  if (comIA) {
    if (!IA.pronto()) { toast('Configure a chave de API.'); return false; }
    if (!txt) { toast('Cole o conteúdo programático.'); return false; }
    const b = $('[data-b="2"]', ov); b.disabled = true; b.textContent = 'Estruturando… 0';
    try {
      const partes = divideTexto(txt, 30000);
      for (const [i, parte] of partes.entries()) {
        const r = await IA.gerar({ sistema: sistemaClassificador(), maxTokens: 32000, onTok: (n) => { b.textContent = `Estruturando ${i + 1}/${partes.length}… ${nfmt(n)}`; },
          partes: [{ texto: `Estruture o conteúdo programático abaixo em pontos. Mapeie cada disciplina do edital para um dos identificadores: ${S.estrutura.disciplinas.map(d => d.id + '=' + d.nome).join('; ')}. Preserve o texto integral de cada ponto, sem resumir. Subpontos numerados (1.1, 1.2) viram itens com "lvl":1. Seções com letras (A) Sociologia…) vão em "sec".
Formato: {"disciplinas":{"civil":[{"n":"1","lvl":0,"sec":"","t":"texto integral do ponto"}]}}

TEXTO:
"""${parte}"""` }] });
        const j = extraiJSON(r);
        for (const [d, ps] of Object.entries(j.disciplinas || {})) {
          if (!disciplina(d)) continue;
          e.pontos[d] = (e.pontos[d] || []).concat(ps.map(p => ({ id: `${id}:${d}:${p.sec ? p.sec[0] + '.' : ''}${p.n}`, n: String(p.n), lvl: p.lvl || 0, ...(p.sec ? { sec: p.sec } : {}), t: p.t })));
        }
      }
    } catch (er) { toast(er.message, 'bad'); b.disabled = false; b.textContent = 'Estruturar com IA'; return false; }
  }
  S.estrutura.editais.push(e); S.estrutura.alterado = now(); await salvaEstrutura();
  S.lente = id; LS.set('lente', id); Ed.ed = id; Ed.disc = null;
  desenhaLente(); desenhaDisciplinas(); viewEditais();
  toast(`Edital ${sig} criado com ${Object.values(e.pontos).reduce((a, p) => a + p.length, 0)} pontos.`);
}

  $('#mG').onchange = (e) => { c.modeloGemini = e.target.value; salvaCfg(); };
  $$('[data-lista]').forEach(b => b.onclick = async () => {
    const p = b.dataset.lista; IA.setChave('claude', $('#kC').value.trim()); IA.setChave('gemini', $('#kG').value.trim());
    b.disabled = true; b.textContent = '…';
    try {
      const l = await IA.listarModelos(p); const sel = p === 'claude' ? $('#mC') : $('#mG'); const atual = p === 'claude' ? c.modeloClaude : c.modeloGemini;
      sel.innerHTML = `<option value="">Automático (${p === 'claude' ? 'Sonnet' : 'Pro'} mais recente)</option>` + l.map(m => `<option value="${h(m.id)}" ${m.id === atual ? 'selected' : ''}>${h(m.nome)}${m.nome !== m.id ? ' — ' + h(m.id) : ''}</option>`).join('');
      toast(l.length + ' modelo(s) disponível(is).');
    } catch (e) { toast(e.message, 'bad'); }
    b.disabled = false; b.textContent = 'Listar';
  });
  $('#semNeg').onchange = (e) => { c.semNegrito = e.target.checked; salvaCfg(); };
  $('#fDoc').onchange = (e) => { c.fonteDoc = e.target.value; salvaCfg(); };
  $('#tDoc').onchange = (e) => { c.tamDoc = +e.target.value || 12; salvaCfg(); };
  $('#eDoc').onchange = (e) => { c.entrelinha = +e.target.value; salvaCfg(); };
  const leG = () => ({ owner: $('#gO').value.trim(), repo: $('#gR').value.trim(), branch: $('#gB').value.trim() || 'main', path: $('#gP').value.trim() || 'catedra-dados.json', token: $('#gT').value.trim(), auto: $('#gA').checked });
  ['#gO', '#gR', '#gB', '#gP', '#gT', '#gA'].forEach(s => $(s).onchange = () => { Sync.setCfg(leG()); Sync.status(Sync.ativo() ? 'GitHub configurado' : 'Somente neste dispositivo', ''); });
  $('#gTest').onclick = async () => { Sync.setCfg(leG()); $('#gMsg').textContent = 'Testando…'; try { $('#gMsg').textContent = await Sync.testa(leG()); } catch (e) { $('#gMsg').textContent = e.message; } };
  $('#gSync').onclick = () => { Sync.setCfg(leG()); Sync.sincroniza(true); };
  $('#bkE').onclick = exportaBackup;
  $('#bkI').onclick = () => $('#bkF').click();
  $('#bkF').onchange = (e) => e.target.files[0] && importaBackup(e.target.files[0]);
  $('#bkZ').onclick = async () => { if (await confirma('Apagar TODO o material, notas e lotes deste dispositivo? Se a sincronização estiver ativa, os dados continuam no GitHub. Esta ação não pode ser desfeita.', 'Apagar tudo')) { for (const s of ['itens', 'notas', 'lotes']) await DB.clear(s); S.itens.clear(); S.notas.clear(); S.lotes.clear(); S.historico = []; await DB.kv('historico', []); LS.set('github.sha', null); toast('Dados apagados.'); desenhaDisciplinas(); atualizaBadges(); } };
}

/* ---------- tema ---------- */
function aplicaTema() {
  const t = S.cfg.tema === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : S.cfg.tema;
  document.documentElement.dataset.theme = t;
}

/* ---------- início ---------- */
async function inicia() {
  try { await carregaTudo(); }
  catch (e) { document.body.innerHTML = `<div style="padding:40px;font:15px system-ui">Não foi possível abrir o banco local do navegador (${h(e.message)}). Em janelas anônimas alguns navegadores bloqueiam o armazenamento.</div>`; return; }
  aplicaTema();
  desenhaLente(); desenhaDisciplinas(); atualizaBadges();
  document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); navega(g.dataset.go); } });
  $('#menuBtn').onclick = () => { $('#side').classList.add('open'); const s = document.createElement('div'); s.className = 'scrim side-s'; s.onclick = fechaMenuLateral; document.body.appendChild(s); };
  $('#themeBtn').onclick = () => { const atual = document.documentElement.dataset.theme; S.cfg.tema = atual === 'dark' ? 'light' : 'dark'; salvaCfg(); aplicaTema(); };
  $('#syncBtn').onclick = () => Sync.sincroniza(true);
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') busca(e.target.value); if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); } });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); } });
  window.addEventListener('beforeunload', (e) => { if (Ingest.rodando) { e.preventDefault(); e.returnValue = ''; } });
  if (Sync.ativo()) { Sync.status('GitHub configurado', ''); Sync.sincroniza(); }
  navega('painel');
  if ('storage' in navigator && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
inicia();

</script>
</body>
