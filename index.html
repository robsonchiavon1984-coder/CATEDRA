a inibitória em matéria de proteção ao meio ambiente. A tutela de urgência e de evidência no direito ambiental. O acesso coletivo à tutela jurisdicional em matéria ambiental. Intervenção de Terceiros stricto e lato sensu. Recursos."},{"id":"tjsc:ambiental:13","n":"13","lvl":0,"t":"Crimes contra o meio ambiente. Responsabilidade penal ambiental. Responsabilidade penal da pessoa jurídica. Ação e processo penal. Competência para julgar os crimes contra o meio ambiente. Crimes ambientais. Crimes contra a fauna. Crimes contra a flora. Crimes contra o ordenamento urbano e patrimônio cultural. Crimes de poluição."},{"id":"tjsc:ambiental:14","n":"14","lvl":0,"t":"O Direito Ambiental Internacional. Conceito. Fontes do Direito ambiental internacional. Princípios gerais do direito ambiental internacional. MERCOSUL e Direito Ambiental Internacional. Procedimentos administrativos de prevenção de dano ambiental nacional transfronteiriço. As Organizações Não Governamentais. ONGs."},{"id":"tjsc:ambiental:15","n":"15","lvl":0,"t":"Política Nacional de Recursos Hídricos. Política Nacional de Saneamento Básico. Política Nacional de Resíduos Sólidos."},{"id":"tjsc:ambiental:16","n":"16","lvl":0,"t":"Conceito de Poluição. Poluição das águas. Poluição Atmosférica. Poluição por resíduos sólidos. Poluição por rejeitos perigosos. Poluição por agrotóxicos. Poluição sonora. Áreas de Preservação Permanente e Unidades de Conservação: Fundamento Constitucional. Mudanças Climáticas. Pagamento por Serviços Ambientais. Mudança do Clima e Mercado de Carbono."},{"id":"tjsc:ambiental:17","n":"17","lvl":0,"t":"Política Nacional de Recursos Hídricos (Lei nº 9.433/1997). Lei de Crimes Ambientais (Lei nº 9.605/1998). Política Nacional de Educação Ambiental (Lei nº 9.795/1999). Poluição causada por óleo (Lei nº 9.966/2000). Sistema Nacional de Unidades de Conservação da Natureza (Lei nº 9.985/2000). Lei de Biossegurança (Lei nº 11.105/2005). Lei de Gestão de Florestas Públicas (Lei nº 11.284/2006). Lei da Mata Atlântica (Lei nº 11.428/2006). Lei de Saneamento Básico (Lei nº 11.445/2007). Política Nacional sobre Mudança do Clima (Lei nº 12.187/2009). Política Nacional de Resíduos Sólidos (Lei nº 12.305/2010). Lei da cooperação federativa em matéria ambiental (Lei Complementar nº 140/2011). Código Florestal (Lei nº 12.651/2012). Lei da Biodiversidade (Lei nº 13.123/2015). Lei de Pagamentos por Serviços Ambientais (Lei nº 14.119/2021). Lei Estadual nº 16.342/2014 - altera a Lei nº 14.675/2009, que institui o Código Estadual do Meio Ambiente."}],"administrativo":[{"id":"tjsc:administrativo:1","n":"1","lvl":0,"t":"As funções do Estado. Origem do Direito Administrativo. O regime jurídico-administrativo. Conteúdo do regime jurídico administrativo. Lei de Introdução às Normas do Direito Brasileiro – LINDB. Aplicação do regime jurídico administrativo a entidades da Administração Indireta, entidades de colaboração e particulares. Estatuto das Empresas Estatais (Lei nº 13.303/2006). Administração Direta e Indireta. Terceiro Setor. Conceito de Direito Administrativo e suas relações com as outras disciplinas jurídicas. A constitucionalização do Direito Administrativo."},{"id":"tjsc:administrativo:2","n":"2","lvl":0,"t":"Princípios Constitucionais do Direito Administrativo. Restrições ao princípio da legalidade. Princípios reconhecidos em legislação infraconstitucional, pela doutrina e pela jurisprudência. Interpretação do direito administrativo. Normas sobre interpretação do direito público na Lei de Introdução ao Direito Brasileiro. Controle sistemático das relações administrativas."},{"id":"tjsc:administrativo:3","n":"3","lvl":0,"t":"Ato administrativo: conceito, elementos, atributos, classificação, espécies. Perfeição, validade e eficácia do ato administrativo. Invalidade, nulidade, anulação, cassação, caducidade, convalidação e revogação. Principais espécies. Controle de mérito e de legalidade dos atos administrativos. Controle sistemático dos atos administrativos. Regime jurídico dos atos administrativos."},{"id":"tjsc:administrativo:4","n":"4","lvl":0,"t":"Servidores Públicos. Agentes Públicos. Classificação. Normas relativas à remuneração dos servidores e de agentes públicos. Regime dos servidores públicos e titulares de cargos públicos na Constituição Federal. Estatuto dos Funcionários Públicos Civis do Estado de Santa Catarina (Lei Estadual nº 6.745/1985). Regime Próprio de Previdência dos Servidores do Estado de Santa Catarina (Lei Complementar Estadual nº 412, de 26 de junho de 2008). Cargo, emprego e função pública. Provimento, vacância, remoção, redistribuição e substituição. Provimento. Nomeação. Concurso Público. Posse e exercício. Estabilidade. Transferência. Readaptação. Reversão. Reintegração. Recondução. Disponibilidade. Aproveitamento. Vacância. Remoção. Redistribuição. Substituição."},{"id":"tjsc:administrativo:5","n":"5","lvl":0,"t":"Direitos e vantagens dos servidores públicos. Deveres e responsabilidades dos servidores públicos. Do regime disciplinar. O funcionário Público Civil. Da Seguridade social do servidor: aposentadoria e pensões; aposentadoria de magistrado, membros do Ministério Público e do Tribunal de Contas; aposentadoria voluntária, aposentadoria compulsória. Normas relativas à remuneração dos servidores e de agentes políticos. Lei Complementar nº 35, de 14 de março de 1979 (Lei Orgânica da Magistratura Nacional) e alterações. Processo administrativo disciplinar (Lei Complementar Estadual nº 491, de 20 de janeiro de 2010)."},{"id":"tjsc:administrativo:6","n":"6","lvl":0,"t":"Improbidade administrativa: Lei Federal nº 8.429/1992. Agentes do polo ativo e passivo. Atos de improbidade. Da ação de improbidade administrativa. Das penas. Enriquecimento ilícito. Prejuízo ao erário. Princípios. Penas. Procedimento e prescrição. Regime jurídico dos atos de improbidade administrativa. Lei de Responsabilidade Fiscal - Lei Complementar nº 101/2000. Lei de Acesso à Informação - Lei Federal nº 12.527/2011. Lei Anticorrupção - Lei Federal nº 12.846/2013."},{"id":"tjsc:administrativo:7","n":"7","lvl":0,"t":"Controles da Administração Pública: Controle administrativo; Controle legislativo ou político; Controle judicial. Discricionariedade administrativa e controle judicial. Controle interno e controle externo. Controle pelo Tribunal de Contas. Domínio público. Controle sistemático das delegações de serviços públicos."},{"id":"tjsc:administrativo:8","n":"8","lvl":0,"t":"Domínio Público. Bens públicos. Regime jurídico. Classificação, Administração e Utilização. Alienação. Tratamento do tema no Estatuto da Cidade (Lei Federal nº 10.257/2001)."},{"id":"tjsc:administrativo:9","n":"9","lvl":0,"t":"Licitação (Lei nº 14.133/2021): Princípios, Obrigatoriedade, Dispensa e Exigibilidade, Procedimentos e Modalidades. Pregão presencial e eletrônico. Fases da licitação. Habilitação. Julgamento. Homologação e adjudicação. Recursos administrativos. Crimes. Licitação e mandado de segurança. Regime Diferenciado de Contratações Públicas. Registro de preços. Regime jurídico de licitações."},{"id":"tjsc:administrativo:10","n":"10","lvl":0,"t":"Contrato administrativo. Espécies. Conceito. Características. Prerrogativas da Administração. Formalização. Execução e inexecução. A cláusula rebus sic stantibus. A Teoria da Imprevisão. As cláusulas de reajuste de preços. Obrigações do Estado derivadas de contratos inválidos ou inexistentes. Rescisão e anulação. Regime jurídico dos contratos administrativos."},{"id":"tjsc:administrativo:11","n":"11","lvl":0,"t":"Convênios e Consórcios. Concessões e Permissões de serviços públicos (Lei nº 8.987/1995 e suas alterações). Forma e condições da outorga do serviço em concessão. O Prazo nas concessões e sua prorrogação. Poderes do Concedente. Os Direitos do concessionário. Regime tarifário e sua revisão. Os Direitos dos usuários. Formas de extinção da concessão e seus efeitos jurídicos. A reversão dos Bens. Serviços públicos. Responsabilidades civis do concessionário e do Poder concedente. Permissão. Parcerias Público-Privadas."},{"id":"tjsc:administrativo:12","n":"12","lvl":0,"t":"Parcerias com o terceiro setor. Convênios e outras espécies de ajustes colaborativos. Organizações sociais. OSCIPs. Organizações da Sociedade Civil."},{"id":"tjsc:administrativo:13","n":"13","lvl":0,"t":"Infrações e Sanções Administrativas. Conceito. Sujeito infrator. Excludentes da Infração. Princípios. Dever de sancionar. Processo administrativo. Regime jurídico. Conceito. Processo ou procedimento administrativo. Princípios do processo administrativo. Instauração do processo administrativo e fases do processo. A sindicância. Os sujeitos da relação processual administrativa. Direitos e deveres das partes. Competência. Instrução do processo administrativo. Decisão do Processo Administrativo: estrutura, tipologia. Recurso Administrativo e seus efeitos. Coisa julgada administrativa. Da revisão administrativa. Da prescrição e da decadência."},{"id":"tjsc:administrativo:14","n":"14","lvl":0,"t":"Poderes Administrativos. Poder de polícia: conceito. Intervenção do Estado na propriedade. Função social da propriedade. Desapropriação. Conceito. Requisitos. Bens suscetíveis de desapropriação: Competências relacionadas à desapropriação. Espécies de desapropriação Indenização e consectários legais. Caducidade da desapropriação. Imissão na posse do imóvel desapropriado. Direito de extensão. Desapropriação indireta. Retrocessão. Controle da desapropriação. Servidão administrativa. Tombamento. Requisição. Ocupação provisória. Limitação administrativa. Direito de construir e seu exercício. Loteamento e zoneamento."},{"id":"tjsc:administrativo:15","n":"15","lvl":0,"t":"Responsabilidade civil do Estado: evolução das teorias. Reparação do dano. Responsabilidade objetiva e subjetiva. Caracterização. Causas de exclusão e mitigação. Prescrição e decadência. Responsabilidades dos contratados e delegatários de serviços públicos. Procedimento administrativo e judicial. Direito de regresso."},{"id":"tjsc:administrativo:16","n":"16","lvl":0,"t":"Organização administrativa: noções gerais. Administração direta e indireta, centralizada e descentralizada. Autarquias. Autarquias comuns e especiais. Agências reguladoras e agências executivas. Fundações Públicas, Empresas Públicas e Sociedades de Economia Mista. Consórcios Públicos. Tutela dos entes da Administração Indireta. Entidades de colaboração e seu regime jurídico."},{"id":"tjsc:administrativo:17","n":"17","lvl":0,"t":"Jurisprudência e súmulas de direito administrativo do Superior Tribunal de Justiça e do Supremo Tribunal Federal. Súmulas Vinculantes. Temas decididos em regime de repercussão geral ou de recursos repetitivos."}],"humanistica":[{"id":"tjsc:humanistica:A.1","n":"1","lvl":0,"sec":"A) Legislação Estadual","t":"Lei Complementar Estadual nº 339, de 8 de março de 2006 (dispõe sobre a divisão e organização judiciárias do Estado de Santa Catarina e estabelece outras providências)."},{"id":"tjsc:humanistica:A.2","n":"2","lvl":0,"sec":"A) Legislação Estadual","t":"Lei Complementar Estadual nº 367, de 7 de dezembro de 2006 (dispõe sobre o Estatuto da Magistratura do Estado de Santa Catarina e adota outras providências)."},{"id":"tjsc:humanistica:A.3","n":"3","lvl":0,"sec":"A) Legislação Estadual","t":"Lei Complementar Estadual nº 413, de 7 de julho de 2008 (transforma cargos do Quadro da Magistratura e altera dispositivos das Leis Complementares Estaduais nº 339/2006 e nº 367/2006)."},{"id":"tjsc:humanistica:B.1","n":"1","lvl":0,"sec":"B) Sociologia do Direito","t":"Introdução à sociologia da administração judiciária. Aspectos gerenciais da atividade judiciária (administração e economia). Gestão. Gestão de pessoas."},{"id":"tjsc:humanistica:B.2","n":"2","lvl":0,"sec":"B) Sociologia do Direito","t":"Relações sociais e relações jurídicas. Controle social e o Direito. Transformações sociais e Direito."},{"id":"tjsc:humanistica:B.3","n":"3","lvl":0,"sec":"B) Sociologia do Direito","t":"Direito, Comunicação Social e opinião pública."},{"id":"tjsc:humanistica:B.4","n":"4","lvl":0,"sec":"B) Sociologia do Direito","t":"Conflitos sociais e mecanismos de resolução. Sistemas não judiciais de composição de litígios."},{"id":"tjsc:humanistica:C.1","n":"1","lvl":0,"sec":"C) Psicologia Judiciária","t":"Psicologia e Comunicação: relacionamento interpessoal, relacionamento do magistrado com a sociedade e a mídia."},{"id":"tjsc:humanistica:C.2","n":"2","lvl":0,"sec":"C) Psicologia Judiciária","t":"Problemas atuais da psicologia com reflexos no direito: assédio moral e assédio sexual."},{"id":"tjsc:humanistica:C.3","n":"3","lvl":0,"sec":"C) Psicologia Judiciária","t":"Teoria do conflito e os mecanismos autocompositivos. Técnicas de negociação e mediação. Procedimentos, posturas, condutas e mecanismos aptos a obter a solução conciliada dos conflitos."},{"id":"tjsc:humanistica:C.4","n":"4","lvl":0,"sec":"C) Psicologia Judiciária","t":"O processo psicológico e a obtenção da verdade judicial. O comportamento de partes e testemunhas."},{"id":"tjsc:humanistica:D.1","n":"1","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Regime jurídico da Magistratura Nacional: carreiras, ingresso, promoções, remoções."},{"id":"tjsc:humanistica:D.2","n":"2","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Direitos e deveres funcionais da magistratura."},{"id":"tjsc:humanistica:D.3","n":"3","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Integridade pessoal e profissional do juiz. Dignidade, honra e decoro. Diligência e dedicação. Conhecimento e Capacitação. Cortesia e Prudência do Juiz."},{"id":"tjsc:humanistica:D.4","n":"4","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Ilícitos éticos. Sanções. Lugar da ética na função judicial e na vida particular do juiz."},{"id":"tjsc:humanistica:D.5","n":"5","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"O papel da cordialidade na prestação jurisdicional."},{"id":"tjsc:humanistica:D.6","n":"6","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Código de Ética da Magistratura Nacional."},{"id":"tjsc:humanistica:D.7","n":"7","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Sistemas de controle interno do Poder Judiciário: Corregedorias, Ouvidorias, Conselhos Superiores e Conselho Nacional de Justiça."},{"id":"tjsc:humanistica:D.8","n":"8","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Responsabilidade administrativa, civil e criminal dos magistrados."},{"id":"tjsc:humanistica:D.9","n":"9","lvl":0,"sec":"D) Ética e Estatuto Jurídico da Magistratura Nacional","t":"Administração judicial. Planejamento estratégico. Modernização da gestão."},{"id":"tjsc:humanistica:E.1","n":"1","lvl":0,"sec":"E) Filosofia do Direito","t":"O conceito de Justiça. Sentido lato de Justiça, como valor universal. Sentido estrito de Justiça, como valor jurídico-político. Divergências sobre o conteúdo do conceito."},{"id":"tjsc:humanistica:E.2","n":"2","lvl":0,"sec":"E) Filosofia do Direito","t":"O conceito de Direito. Equidade. Direito e Moral."},{"id":"tjsc:humanistica:E.3","n":"3","lvl":0,"sec":"E) Filosofia do Direito","t":"A interpretação do Direito. A superação dos métodos de interpretação mediante puro raciocínio lógico-dedutivo. O método de interpretação pela lógica do razoável."},{"id":"tjsc:humanistica:F.1","n":"1","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Direito objetivo e direito subjetivo."},{"id":"tjsc:humanistica:F.2","n":"2","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Fontes do Direito objetivo. Princípios gerais de Direito. Jurisprudência. Súmula vinculante."},{"id":"tjsc:humanistica:F.3","n":"3","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Eficácia da lei no tempo. Conflito de normas jurídicas no tempo e o Direito brasileiro: Direito Penal, Direito Civil, Direito Constitucional e Direito do Trabalho."},{"id":"tjsc:humanistica:F.4","n":"4","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"O conceito de Política. Política e Direito."},{"id":"tjsc:humanistica:F.5","n":"5","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Ideologias."},{"id":"tjsc:humanistica:F.6","n":"6","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"A Declaração Universal dos Direitos do Homem (ONU)."},{"id":"tjsc:humanistica:F.7","n":"7","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Agenda 2030 e os 17 Objetivos de Desenvolvimento Sustentável."},{"id":"tjsc:humanistica:F.8","n":"8","lvl":0,"sec":"F) Teoria Geral do Direito e da Política","t":"Gênero e Patriarcado. Gênero e Raça. Discriminação e Desigualdades de Gênero – questões centrais. Protocolo de Julgamento com perspectiva de gênero."},{"id":"tjsc:humanistica:G.1","n":"1","lvl":0,"sec":"G) Direito Digital","t":"4ª Revolução industrial. Transformação Digital no Poder Judiciário. Tecnologia no contexto jurídico. Automação do processo. Inteligência Artificial e Direito. Audiências virtuais. Cortes remotas. Ciência de dados e Jurimetria. Resoluções do CNJ sobre inovações tecnológicas no Judiciário."},{"id":"tjsc:humanistica:G.2","n":"2","lvl":0,"sec":"G) Direito Digital","t":"Persecução Penal e novas tecnologias. Crimes virtuais e cibersegurança. Deepweb e Darkweb. Provas digitais. Criptomoedas e Lavagem de dinheiro."},{"id":"tjsc:humanistica:G.3","n":"3","lvl":0,"sec":"G) Direito Digital","t":"Noções gerais de contratos Inteligentes, Blockchain e Algoritmos."},{"id":"tjsc:humanistica:G.4","n":"4","lvl":0,"sec":"G) Direito Digital","t":"LGPD e proteção de dados pessoais."},{"id":"tjsc:humanistica:H.1","n":"1","lvl":0,"sec":"H) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Função judicial e pragmatismo. Antifundacionalismo. Contextualismo. Consequencialismo. Racionalismo e Empirismo. Dialética. Utilitarismo."},{"id":"tjsc:humanistica:H.2","n":"2","lvl":0,"sec":"H) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Análise econômica do direito. Conceitos fundamentais. Racionalidade econômica. Eficiência processual. Métodos adequados de resolução de conflitos e acesso à Justiça. Demandas frívolas e de valor esperado negativo. Precedentes, estabilidade da jurisprudência e segurança jurídica. Coisa Julgada."},{"id":"tjsc:humanistica:H.3","n":"3","lvl":0,"sec":"H) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Economia comportamental. Heurística e vieses cognitivos. A percepção de Justiça. Processo cognitivo de tomada de decisão."},{"id":"tjsc:humanistica:H.4","n":"4","lvl":0,"sec":"H) Pragmatismo, Análise Econômica do Direito e Economia Comportamental","t":"Governança corporativa e Compliance no Brasil. Mecanismos de Combate às organizações criminosas e Lavagem de Dinheiro. Whistleblower."},{"id":"tjsc:humanistica:I.1","n":"1","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Conceitos Fundamentais do Direito da Antidiscriminação."},{"id":"tjsc:humanistica:I.2","n":"2","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Modalidades de Discriminação."},{"id":"tjsc:humanistica:I.3","n":"3","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Legislação antidiscriminação nacional e internacional."},{"id":"tjsc:humanistica:I.4","n":"4","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Conceitos Fundamentais do Racismo, Sexismo, Intolerância Religiosa, LGBTQIA+fobia."},{"id":"tjsc:humanistica:I.5","n":"5","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Ações Afirmativas."},{"id":"tjsc:humanistica:I.6","n":"6","lvl":0,"sec":"I) Direito da Antidiscriminação","t":"Direitos dos Povos indígenas e das comunidades tradicionais."}],"dh":[{"id":"tjsc:dh:1","n":"1","lvl":0,"t":"Teoria Geral dos Direitos Humanos."},{"id":"tjsc:dh:2","n":"2","lvl":0,"t":"Sistema global de proteção dos direitos humanos."},{"id":"tjsc:dh:3","n":"3","lvl":0,"t":"Sistema regional interamericano de proteção dos direitos humanos."},{"id":"tjsc:dh:4","n":"4","lvl":0,"t":"Controle de convencionalidade."},{"id":"tjsc:dh:5","n":"5","lvl":0,"t":"A relação entre o direito internacional dos direitos humanos e o direito brasileiro."},{"id":"tjsc:dh:6","n":"6","lvl":0,"t":"Os direitos humanos na Constituição Federal de 1988."},{"id":"tjsc:dh:7","n":"7","lvl":0,"t":"A jurisprudência do Supremo Tribunal Federal em matéria de direitos humanos."}]},"vistas":{"execucao":["tjsc:penal:20","tjsc:penal:21","tjsc:penal:22","tjsc:penal:23","tjsc:penal:24","tjsc:penal:25","tjsc:penal:29","tjsc:penal:31","tjsc:penal:32","tjsc:penal:33","tjsc:ppenal:17"],"lpe":["tjsc:penal:50","tjsc:penal:51","tjsc:penal:52","tjsc:penal:53","tjsc:penal:54","tjsc:penal:55","tjsc:penal:56","tjsc:penal:57","tjsc:penal:58","tjsc:penal:59","tjsc:penal:60","tjsc:penal:61","tjsc:penal:62","tjsc:penal:63","tjsc:penal:64","tjsc:penal:65","tjsc:penal:66","tjsc:penal:67","tjsc:penal:68","tjsc:penal:69","tjsc:penal:70","tjsc:penal:71","tjsc:penal:72","tjsc:penal:73","tjsc:penal:74","tjsc:penal:75","tjsc:penal:76","tjsc:penal:77","tjsc:penal:78","tjsc:penal:79","tjsc:ppenal:16","tjsc:ppenal:18"],"lce":["tjsc:civil:22","tjsc:civil:23"]}},{"id":"trf5","sigla":"TRF5","nome":"Tribunal Regional Federal da 5ª Região — XVI Concurso Juiz Federal 2026","cor":"#8a3b2e","pontos":{"constitucional":[{"id":"trf5:constitucional:1","n":"1","lvl":0,"t":"Constituição, constitucionalismo e neoconstitucionalismo. Transconstitucionalismo. Poder constituinte originário e derivado. Reforma constitucional. Emendas constitucionais. Mutação constitucional. Direito constitucional intertemporal. Eficácia e aplicabilidade das normas constitucionais. Disposições constitucionais transitórias. Princípios fundamentais. Estado Democrático de Direito. República, Federação e separação de Poderes."},{"id":"trf5:constitucional:2","n":"2","lvl":0,"t":"Hermenêutica constitucional. Métodos e princípios de interpretação e concretização constitucional. Interpretação dos direitos fundamentais. Colisão de normas e direitos fundamentais. Proporcionalidade e razoabilidade. Lacunas e integração. Interpretação conforme a Constituição. Declaração de inconstitucionalidade sem redução de texto. Limites da interpretação constitucional."},{"id":"trf5:constitucional:3","n":"3","lvl":0,"t":"Teoria geral dos direitos fundamentais. Evolução, dimensões, características, eficácia e efetividade. Titularidade. Eficácia nas relações privadas. Restrições e limites. Núcleo essencial. Proporcionalidade. Proibição de proteção insuficiente. Abuso de direito. Judicialização dos direitos fundamentais."},{"id":"trf5:constitucional:4","n":"4","lvl":0,"t":"Direitos e garantias fundamentais em espécie. Vida e integridade física e moral. Igualdade e não discriminação. Legalidade. Liberdades públicas. Liberdade de expressão, informação e imprensa. Privacidade, honra, imagem e proteção de dados pessoais. Direitos da personalidade. Propriedade e sua função social. Acesso à justiça. Devido processo legal. Segurança jurídica. Remédios constitucionais. Garantias constitucionais penais. Direitos sociais, econômicos, culturais e ambientais. Direitos políticos. Partidos políticos. Nacionalidade."},{"id":"trf5:constitucional:5","n":"5","lvl":0,"t":"Tratados internacionais de direitos humanos. Incorporação e hierarquia. Sistemas global e regional de proteção. Proteção multinível. Controle de convencionalidade. Dignidade da pessoa humana. Cidadania. Diálogo entre cortes e ordens jurídicas. Transconstitucionalismo. Justiça Federal e direitos humanos."},{"id":"trf5:constitucional:6","n":"6","lvl":0,"t":"Federalismo. Entes federativos. Autonomia. Repartição de competências. Competências da União, dos Estados, do Distrito Federal e dos Municípios. Bens da União. Competências exclusivas, privativas, comuns, concorrentes e suplementares. Intervenção federal e estadual."},{"id":"trf5:constitucional:7","n":"7","lvl":0,"t":"Poder Legislativo. Organização, atribuições e funcionamento. Processo legislativo. Espécies normativas. Iniciativa, deliberação, sanção, veto e promulgação. Estatuto dos parlamentares. Imunidades e incompatibilidades. Comissões parlamentares de inquérito. Fiscalização contábil, financeira, orçamentária e patrimonial. Tribunais de Contas."},{"id":"trf5:constitucional:8","n":"8","lvl":0,"t":"Poder Executivo. Presidência da República. Atribuições e responsabilidade. Crimes de responsabilidade e impeachment. Poder regulamentar. Administração regulatória. Conselhos constitucionais. Defesa do Estado e das instituições democráticas. Estado de defesa e estado de sítio. Forças Armadas. Segurança pública."},{"id":"trf5:constitucional:9","n":"9","lvl":0,"t":"Poder Judiciário. Princípios, organização, autonomia e garantias. Magistratura. Supremo Tribunal Federal, Superior Tribunal de Justiça, Conselho Nacional de Justiça, Conselho da Justiça Federal, Tribunais Regionais Federais e Justiça Federal de primeiro grau. Competência da Justiça Federal. Juizados Especiais Federais. Estatuto da Magistratura. Organização da Justiça Federal. Ética judicial."},{"id":"trf5:constitucional:10","n":"10","lvl":0,"t":"Jurisdição constitucional. Controle de constitucionalidade difuso e concentrado. Modelos, parâmetros, legitimidade, procedimento, efeitos e modulação. Omissão inconstitucional. Ações de controle concentrado. Remédios constitucionais. Controle de convencionalidade."},{"id":"trf5:constitucional:11","n":"11","lvl":0,"t":"Funções essenciais à Justiça. Ministério Público. Advocacia-Geral da União e advocacia pública. Advocacia. Defensoria Pública. Princípios, garantias, funções institucionais e organização constitucional."},{"id":"trf5:constitucional:12","n":"12","lvl":0,"t":"Administração Pública na Constituição. Princípios. Acesso a cargos, empregos e funções públicas. Agentes e servidores públicos. Remuneração. Acumulação. Estabilidade. Regime próprio de previdência. Militares. Responsabilidade civil do Estado. Fundamentos constitucionais da improbidade administrativa."},{"id":"trf5:constitucional:13","n":"13","lvl":0,"t":"Regime constitucional da propriedade. Propriedade pública e privada. Recursos naturais e bens de produção. Bem de família. Função social da propriedade urbana e rural. Desapropriação. Usucapião urbano e rural. Política urbana. Precatórios e requisições de pequeno valor."},{"id":"trf5:constitucional:14","n":"14","lvl":0,"t":"Comunicação social. Liberdade de expressão e informação. Pluralismo. Vedação à censura. Regime constitucional dos meios de comunicação."},{"id":"trf5:constitucional:15","n":"15","lvl":0,"t":"Proteção constitucional da criança, do adolescente e do jovem. Prioridade absoluta. Direitos fundamentais e deveres de proteção."},{"id":"trf5:constitucional:16","n":"16","lvl":0,"t":"Povos indígenas, comunidades quilombolas e comunidades tradicionais. Identidade, autonomia, proteção cultural e territorial. Terras indígenas. Territórios quilombolas. Consulta e participação."},{"id":"trf5:constitucional:17","n":"17","lvl":0,"t":"Família. Educação. Cultura. Patrimônio cultural. Ciência, tecnologia e inovação. Proteção da pessoa idosa."},{"id":"trf5:constitucional:18","n":"18","lvl":0,"t":"Constituição econômica. Ordem econômica. Livre iniciativa e livre concorrência. Função social. Soberania econômica. Intervenção estatal direta e indireta. Regulação econômica. Planejamento. Empresas estatais. Recursos naturais. Desenvolvimento e redução das desigualdades."}],"previdenciario":[{"id":"trf5:previdenciario:1","n":"1","lvl":0,"t":"Seguridade Social. Saúde, Previdência Social e Assistência Social. Princípios, organização e fontes. Interpretação, aplicação, integração e eficácia das normas. Direito intertemporal. Direito adquirido, expectativa de direito e proteção da confiança."},{"id":"trf5:previdenciario:2","n":"2","lvl":0,"t":"Financiamento e custeio da Seguridade Social. Orçamento. Contribuições sociais. Contribuintes e responsáveis. Salário de contribuição. Arrecadação. Imunidade, isenção e responsabilidade. Prescrição e decadência."},{"id":"trf5:previdenciario:3","n":"3","lvl":0,"t":"Previdência Social. Regime Geral, regimes próprios e previdência complementar. Financiamento e equilíbrio financeiro e atuarial. Regime próprio dos servidores. Previdência complementar do servidor público. Contagem recíproca e compensação previdenciária. Regras permanentes e de transição das reformas previdenciárias."},{"id":"trf5:previdenciario:4","n":"4","lvl":0,"t":"Relação jurídica previdenciária no Regime Geral. Filiação e inscrição. Segurados e dependentes. Qualidade de segurado. Período de graça. Carência."},{"id":"trf5:previdenciario:5","n":"5","lvl":0,"t":"Cálculo dos benefícios. Salário de benefício. Período básico de cálculo. Média contributiva. Renda mensal inicial. Coeficientes. Limites. Fator previdenciário. Reajustamento. Pensões. Regras de transição e direito adquirido."},{"id":"trf5:previdenciario:6","n":"6","lvl":0,"t":"Tempo de contribuição e sua prova. Cadastro Nacional de Informações Sociais. Atividade rural. Segurado especial. Atividade sob condições especiais prejudiciais à saúde ou à integridade física. Conversão. Contagem recíproca e compensação."},{"id":"trf5:previdenciario:7","n":"7","lvl":0,"t":"Prestações previdenciárias. Concessão, manutenção, suspensão, cessação, cancelamento e restabelecimento. Acumulação de benefícios, inclusive entre regimes e sistemas de proteção social militar. Abono anual. Prescrição, decadência, revisão, descontos e restituições."},{"id":"trf5:previdenciario:8","n":"8","lvl":0,"t":"Benefícios previdenciários em espécie. Aposentadorias programadas e por incapacidade permanente. Aposentadoria especial e da pessoa com deficiência. Benefícios por incapacidade. Salário-maternidade. Salário-família. Pensão por morte. Auxílio-reclusão. Benefícios do segurado especial. Regras de transição por pontos, idades e pedágios. Benefícios sujeitos a legislação especial."},{"id":"trf5:previdenciario:9","n":"9","lvl":0,"t":"Assistência Social. Benefício de prestação continuada. Vulnerabilidade social. Grupo familiar. Pessoa com deficiência e avaliação biopsicossocial. Auxílio-inclusão. Serviços socioassistenciais. Habilitação e reabilitação. Relação com benefícios previdenciários."},{"id":"trf5:previdenciario:10","n":"10","lvl":0,"t":"Processo administrativo e judicial previdenciário. Direito ao melhor benefício. Prova e justificação administrativa. Reafirmação da data de entrada do requerimento. Recursos administrativos. Prévio requerimento e interesse de agir. Demandas previdenciárias. Competência. Justiça Federal e Juizados Especiais Federais. Gratuidade. Prioridade. Tutelas provisórias. Cumprimento e implantação de benefícios. Uniformização nos Juizados Especiais Federais."},{"id":"trf5:previdenciario:11","n":"11","lvl":0,"t":"Prescrição e decadência em matéria previdenciária. Prescrição das prestações. Prescrição do fundo de direito. Decadência do direito à revisão. Efeitos temporais das decisões."},{"id":"trf5:previdenciario:12","n":"12","lvl":0,"t":"Direito previdenciário intertemporal. Sucessão de regimes jurídicos. Reformas e regras de transição. Direito adquirido. Revisões decorrentes de alterações normativas e de mudanças de orientação jurisprudencial."}],"penal":[{"id":"trf5:penal:1","n":"1","lvl":0,"t":"Introdução ao Direito Penal. Conceito, função, fontes e princípios. Direito Penal e Constituição. Política criminal e criminologia. Garantismo. Seletividade das agências penais. Populismo penal. Microcriminalidade e macrocriminalidade. Direito Penal, povos indígenas e comunidades tradicionais. Crimes culturalmente motivados. Perspectivas de gênero, raça e antidiscriminação. Norma penal. Conflito aparente de normas."},{"id":"trf5:penal:2","n":"2","lvl":0,"t":"Aplicação da lei penal no tempo e no espaço. Anterioridade e legalidade. Lei penal mais benéfica. Lei excepcional e temporária. Tempo e lugar do crime. Territorialidade e extraterritorialidade. Pena cumprida no estrangeiro. Eficácia de sentença estrangeira. Contagem de prazos. Aplicação da Parte Geral aos crimes previstos em legislação especial."},{"id":"trf5:penal:3","n":"3","lvl":0,"t":"Teoria do crime. Tipicidade. Conduta. Resultado. Relação de causalidade. Omissão. Dolo e culpa. Preterdolo. Consumação e tentativa. Desistência voluntária. Arrependimento eficaz e posterior. Crime impossível. Erro de tipo e erro de proibição. Descriminantes putativas. Coação e obediência hierárquica. Ilicitude e causas de exclusão. Culpabilidade. Exigibilidade de conduta diversa. Concurso aparente de crimes."},{"id":"trf5:penal:4","n":"4","lvl":0,"t":"Imputabilidade penal. Inimputabilidade e semi-imputabilidade. Menoridade. Doença mental e desenvolvimento mental incompleto ou retardado. Emoção, paixão e embriaguez."},{"id":"trf5:penal:5","n":"5","lvl":0,"t":"Concurso de pessoas. Autoria, coautoria e participação. Teorias da autoria. Domínio do fato. Participação de menor importância. Cooperação dolosamente distinta. Comunicabilidade de circunstâncias. Responsabilidade penal da pessoa jurídica."},{"id":"trf5:penal:6","n":"6","lvl":0,"t":"Penas. Espécies. Regimes. Direitos da pessoa presa. Detração. Penas restritivas de direitos. Multa. Cominação e aplicação da pena. Circunstâncias judiciais, agravantes e atenuantes. Concurso de crimes. Continuidade delitiva. Suspensão condicional da pena. Livramento condicional. Efeitos da condenação. Reabilitação."},{"id":"trf5:penal:7","n":"7","lvl":0,"t":"Medidas de segurança. Pressupostos, espécies, duração e execução. Política antimanicomial. Desinstitucionalização e tratamento em meio aberto. Direitos das pessoas com transtorno mental em conflito com a lei."},{"id":"trf5:penal:8","n":"8","lvl":0,"t":"Ação penal e extinção da punibilidade. Ação penal pública e privada. Representação e requisição. Renúncia, perdão, perempção e decadência. Prescrição. Anistia, graça e indulto. Causas gerais e especiais de extinção da punibilidade."},{"id":"trf5:penal:9","n":"9","lvl":0,"t":"Crimes previstos na Parte Especial do Código Penal. Crimes contra a pessoa. Crimes contra o patrimônio. Crimes contra a propriedade imaterial. Crimes contra a organização do trabalho. Crimes contra a dignidade sexual. Crimes contra a incolumidade pública. Crimes contra a paz pública. Crimes contra a fé pública. Crimes contra a Administração Pública. Crimes contra o Estado Democrático de Direito. Crimes cibernéticos."},{"id":"trf5:penal:10","n":"10","lvl":0,"t":"Legislação penal especial de interesse da Justiça Federal. Abuso de autoridade. Crimes hediondos. Genocídio e graves violações de direitos humanos. Tortura. Racismo, discriminação e preconceito. Proteção penal de povos indígenas, comunidades tradicionais, crianças, adolescentes, pessoas idosas, pessoas com deficiência e mulheres. Armas. Lavagem de dinheiro. Crimes tributários, econômicos, contra o sistema financeiro, mercado de capitais e economia popular. Crimes ambientais e contra o patrimônio cultural. Telecomunicações e serviço postal. Trânsito. Drogas. Organizações criminosas, milícias e grupos paramilitares. Terrorismo. Biossegurança. Responsabilidade de prefeitos. Crimes eleitorais de competência federal. Crimes cibernéticos e digitais, inclusive violência sexual contra crianças e adolescentes praticada com tecnologias digitais e inteligência artificial. Tráfico de pessoas e de migrantes. Crimes de ódio. Crimes previstos em tratados internacionais incorporados ao ordenamento."},{"id":"trf5:penal:11","n":"11","lvl":0,"t":"Tratados, convenções e instrumentos internacionais em matéria penal. Sistema interamericano de direitos humanos e controle de convencionalidade. Crime organizado transnacional e seus protocolos sobre tráfico de pessoas, tráfico de migrantes e tráfico ilícito de armas. Corrupção. Tráfico ilícito de entorpecentes. Terrorismo. Tribunal Penal Internacional. Cibercrime. Regras internacionais sobre pessoas presas, mulheres privadas de liberdade e medidas não privativas de liberdade."}],"ppenal":[{"id":"trf5:ppenal:1","n":"1","lvl":0,"t":"Direito Processual Penal. Conceito, finalidade, características, fontes e princípios. Sistema acusatório. Garantias constitucionais do processo penal. Aplicação da lei processual penal. Tratados internacionais e controle de convencionalidade. Repartição constitucional de competências."},{"id":"trf5:ppenal:2","n":"2","lvl":0,"t":"Juiz das garantias. Direitos das vítimas. Perfilamento racial. Segurança pública e justiça criminal. Investigação, processo, julgamento e execução penal com perspectivas de gênero, raça e antidiscriminação. Pessoas e grupos em situação de vulnerabilidade."},{"id":"trf5:ppenal:3","n":"3","lvl":0,"t":"Persecução penal e investigação preliminar. Inquérito policial. Polícia Federal. Investigação pelo Ministério Público. Investigação defensiva. Indiciamento. Identificação criminal e genética. Arquivamento. Controle judicial e ministerial. Inteligência financeira e compartilhamento de informações. Cooperação entre órgãos de controle e persecução. Técnicas especiais de investigação. Investigação de organizações criminosas e de crimes cibernéticos."},{"id":"trf5:ppenal:4","n":"4","lvl":0,"t":"Justiça penal consensual. Acordo de não persecução penal. Transação penal. Suspensão condicional do processo. Colaboração premiada. Justiça restaurativa e práticas restaurativas."},{"id":"trf5:ppenal:5","n":"5","lvl":0,"t":"Ação penal. Pressupostos processuais e condições para o exercício da ação penal. Ação penal pública, condicionada, privada e subsidiária. Titularidade e princípios. Representação e requisição. Denúncia e queixa. Aditamento. Renúncia, perdão, perempção e decadência. Ação civil decorrente do crime."},{"id":"trf5:ppenal:6","n":"6","lvl":0,"t":"Sujeitos do processo penal. Juiz. Ministério Público. Conflitos e declínio de atribuição. Acusado e defesa. Defensoria Pública. Defensor dativo. Assistente de acusação. Auxiliares da justiça. Peritos e intérpretes. Impedimentos e suspeições. Vítimas, testemunhas e colaboradores. Proteção especial."},{"id":"trf5:ppenal:7","n":"7","lvl":0,"t":"Atos processuais. Comunicações processuais. Citações e intimações. Revelia. Pronunciamentos judiciais. Audiência. Sentença penal. Correlação entre acusação e sentença. Emendatio e mutatio libelli. Individualização da pena. Processo eletrônico. Atos digitais. Teleaudiências e videoconferência."},{"id":"trf5:ppenal:8","n":"8","lvl":0,"t":"Jurisdição e competência penal. Critérios de competência. Conexão, continência, prevenção e prerrogativa de função. Crimes praticados no exterior, em embarcações e aeronaves. Competência da Justiça Federal, dos Tribunais Regionais Federais e dos Tribunais Superiores. Conflitos de competência. Colegiados criminais em primeiro grau."},{"id":"trf5:ppenal:9","n":"9","lvl":0,"t":"Questões e processos incidentes. Questões prejudiciais. Exceções. Incompatibilidades, impedimentos e suspeições. Incidentes de falsidade e insanidade mental. Restituição de coisas apreendidas. Perdimento e alienação antecipada de bens."},{"id":"trf5:ppenal:10","n":"10","lvl":0,"t":"Prova penal. Teoria geral. Sistemas e standards probatórios. Ônus e valoração. Provas ilícitas. Corpo de delito e perícias. Prova testemunhal. Interrogatório. Confissão. Reconhecimento de pessoas e coisas. Acareação. Prova documental. Indícios. Busca e apreensão. Interceptações. Afastamento de sigilos. Meios especiais de obtenção de prova. Infiltração policial e digital. Ação controlada. Colaboração premiada. Prova emprestada. Prova genética. Bancos de perfis genéticos. Prova digital: obtenção, preservação, extração, documentação, autenticidade, integridade e cadeia de custódia. Dados armazenados, dados de tráfego, dispositivos, plataformas e computação em nuvem."},{"id":"trf5:ppenal:11","n":"11","lvl":0,"t":"Medidas cautelares penais. Prisões em flagrante, temporária e preventiva. Medidas cautelares diversas da prisão. Liberdade provisória e fiança. Audiência de custódia. Fundamentação concreta e proporcionalidade. Medidas protetivas de urgência. Medidas assecuratórias patrimoniais. Medidas cautelares probatórias. Investigação digital e ronda virtual. Proteção de crianças e adolescentes em investigações digitais."},{"id":"trf5:ppenal:12","n":"12","lvl":0,"t":"Processo e procedimentos penais. Procedimento comum. Juízo de admissibilidade da acusação. Resposta à acusação. Absolvição sumária. Audiência de instrução e julgamento. Procedimentos especiais. Tribunal do Júri. Crimes funcionais, contra a honra, contra a propriedade imaterial e outros de interesse federal. Procedimentos relativos a drogas, lavagem de dinheiro, crimes ambientais, sistema financeiro, migração e tráfico de pessoas. Processos de competência originária. Juizados Especiais Federais Criminais. Termo circunstanciado."},{"id":"trf5:ppenal:13","n":"13","lvl":0,"t":"Nulidades e recursos. Teoria geral das nulidades. Teoria geral dos recursos. Apelação. Recurso em sentido estrito. Embargos de declaração. Embargos infringentes e de nulidade. Carta testemunhável. Correição parcial. Recursos extraordinário e especial. Agravos. Reclamação. Coisa julgada. Revisão criminal. Habeas corpus. Mandado de segurança em matéria penal. Sistema recursal dos Juizados Especiais Federais Criminais."},{"id":"trf5:ppenal:14","n":"14","lvl":0,"t":"Execução penal e regime jurídico do Sistema Penitenciário Federal. Competência. Execução das penas privativas de liberdade, restritivas de direitos e multa. Medidas de segurança. Regimes, progressão e regressão. Faltas disciplinares. Remição. Livramento condicional. Suspensão condicional da pena. Incidentes. Indulto e comutação. Regime disciplinar diferenciado. Monitoramento eletrônico. Direitos da pessoa presa. Inclusão, permanência, transferência e exclusão no sistema penitenciário federal. Órgão colegiado competente. Estado de coisas inconstitucional e políticas de desencarceramento compatíveis com a ordem jurídica."},{"id":"trf5:ppenal:15","n":"15","lvl":0,"t":"Cooperação jurídica internacional em matéria penal. Cartas rogatórias. Homologação e execução de decisões estrangeiras. Auxílio direto. Autoridade central. Extradição. Entrega ao Tribunal Penal Internacional. Transferência de processos, execução de pena e pessoas condenadas. Cooperação policial internacional. Equipes conjuntas de investigação. Tratados multilaterais e bilaterais de assistência penal."}],"consumidor":[{"id":"trf5:consumidor:1","n":"1","lvl":0,"t":"Constituição econômica. Ordem econômica constitucional. Livre iniciativa, livre concorrência, propriedade, função social, defesa do consumidor, redução das desigualdades, pleno emprego e tratamento favorecido às pequenas empresas."},{"id":"trf5:consumidor:2","n":"2","lvl":0,"t":"Liberdade econômica. Livre exercício de atividade econômica. Garantias de livre iniciativa. Abuso regulatório. Segurança jurídica, boa-fé e análise de impacto da intervenção estatal."},{"id":"trf5:consumidor:3","n":"3","lvl":0,"t":"Intervenção do Estado no domínio econômico. Atuação direta e indireta. Regulação, fomento, planejamento, serviço público e poder de polícia. Agências reguladoras. Análise de impacto regulatório. Empresas estatais."},{"id":"trf5:consumidor:4","n":"4","lvl":0,"t":"Direito da concorrência. Sistema de defesa da concorrência. Infrações à ordem econômica. Abuso de posição dominante. Estruturas e atos de concentração. Concorrência desleal. Sanções, acordos e leniência."},{"id":"trf5:consumidor:5","n":"5","lvl":0,"t":"Comércio e economia internacionais. Blocos econômicos. Organizações econômicas internacionais. Comércio exterior. Defesa comercial. Medidas de salvaguarda. Subsídios e práticas desleais de comércio."},{"id":"trf5:consumidor:6","n":"6","lvl":0,"t":"Direito do consumidor. Fundamentos constitucionais. Princípios. Relação de consumo. Consumidor, fornecedor, produto e serviço. Consumidor por equiparação. Vulnerabilidade e hipervulnerabilidade. Direitos básicos."},{"id":"trf5:consumidor:7","n":"7","lvl":0,"t":"Relações materiais de consumo. Oferta e publicidade. Práticas abusivas. Cobrança de dívidas. Bancos de dados. Proteção contratual. Contratos de adesão. Responsabilidade pelo fato e vício do produto e do serviço. Prescrição e decadência. Comércio eletrônico, plataformas digitais e proteção de dados do consumidor."},{"id":"trf5:consumidor:8","n":"8","lvl":0,"t":"Tutela administrativa, coletiva e judicial do consumidor. Órgãos de proteção. Sanções administrativas. Tutela coletiva. Ações coletivas. Coisa julgada. Liquidação e execução. Métodos consensuais. Superendividamento."},{"id":"trf5:consumidor:9","n":"9","lvl":0,"t":"Análise Econômica do Direito aplicada à regulação, concorrência e consumo. Sistema de preços. Direitos de propriedade. Custos de transação. Externalidades. Assimetria de informação. Seleção adversa. Risco moral. Incentivos e eficiência."}],"civil":[{"id":"trf5:civil:1","n":"1","lvl":0,"t":"Direito Civil. Conceito, fontes, princípios e constitucionalização do Direito Privado. Lei de Introdução às Normas do Direito Brasileiro quanto à vigência, aplicação da lei no tempo e no espaço, integração e direito intertemporal, sem prejuízo do tratamento específico das normas gerais de interpretação e aplicação do Direito em Formação Humanística."},{"id":"trf5:civil:2","n":"2","lvl":0,"t":"Pessoas naturais. Personalidade e capacidade. Nascituro. Incapacidades. Emancipação. Ausência e morte presumida. Curatela e tomada de decisão apoiada. Direitos da personalidade. Nome, imagem, honra, privacidade, identidade e proteção de dados. Criança e adolescente. Pessoa idosa. Pessoa com deficiência. Identidade de gênero e nome social."},{"id":"trf5:civil:3","n":"3","lvl":0,"t":"Pessoas jurídicas. Classificação. Constituição, registro, administração e extinção. Associações, fundações e organizações religiosas. Autonomia patrimonial. Abuso e desconsideração da personalidade jurídica. Desvio de finalidade e confusão patrimonial. Entidades não personificadas."},{"id":"trf5:civil:4","n":"4","lvl":0,"t":"Domicílio. Domicílio da pessoa natural e jurídica. Pluralidade. Domicílio necessário. Eleição de foro e seus limites."},{"id":"trf5:civil:5","n":"5","lvl":0,"t":"Bens. Classificação. Bens públicos e privados. Universalidades. Benfeitorias. Frutos. Patrimônio."},{"id":"trf5:civil:6","n":"6","lvl":0,"t":"Fatos jurídicos. Negócios jurídicos. Existência, validade e eficácia. Representação. Condição, termo e encargo. Defeitos. Simulação. Invalidade. Atos jurídicos lícitos e ilícitos. Abuso de direito. Prova dos fatos jurídicos."},{"id":"trf5:civil:7","n":"7","lvl":0,"t":"Prescrição e decadência. Conceitos, distinções, prazos, renúncia e causas impeditivas, suspensivas e interruptivas. Prescrição intercorrente. Fazenda Pública. Imprescritibilidade."},{"id":"trf5:civil:8","n":"8","lvl":0,"t":"Obrigações. Modalidades. Transmissão. Adimplemento e extinção. Pagamento. Novação. Compensação. Confusão. Remissão. Inadimplemento. Mora. Perdas e danos. Juros e correção monetária. Cláusula penal. Arras. Preferências e privilégios creditórios."},{"id":"trf5:civil:9","n":"9","lvl":0,"t":"Contratos. Teoria geral. Princípios. Formação. Interpretação. Boa-fé objetiva. Função social. Contratos de adesão. Estipulação em favor de terceiro. Promessa de fato de terceiro. Vícios redibitórios. Evicção. Contratos aleatórios. Contrato preliminar. Extinção. Revisão e resolução por onerosidade excessiva."},{"id":"trf5:civil:10","n":"10","lvl":0,"t":"Contratos em espécie. Compra e venda. Troca. Doação. Locação. Empréstimo. Prestação de serviços. Empreitada. Depósito. Mandato. Corretagem. Transporte. Seguro. Constituição de renda. Jogo e aposta. Fiança. Transação. Compromisso. Alienação fiduciária. Contratos relacionados aos sistemas financeiro da habitação e imobiliário. Atos unilaterais. Enriquecimento sem causa."},{"id":"trf5:civil:11","n":"11","lvl":0,"t":"Responsabilidade civil. Responsabilidade contratual e extracontratual. Subjetiva e objetiva. Pressupostos. Excludentes. Fato de outrem e fato da coisa. Perda de uma chance. Danos patrimoniais e extrapatrimoniais. Dano moral coletivo. Quantificação. Responsabilidade civil digital e em relações de consumo."},{"id":"trf5:civil:12","n":"12","lvl":0,"t":"Direitos reais. Posse. Propriedade. Função social. Aquisição e perda. Usucapião. Direitos de vizinhança. Condomínio. Multipropriedade. Propriedade urbana e rural. Direitos reais sobre coisa alheia. Superfície, servidões, usufruto, uso, habitação, direito do promitente comprador, penhor, hipoteca, anticrese, concessões de uso, laje e garantias fiduciárias. Registros públicos."},{"id":"trf5:civil:13","n":"13","lvl":0,"t":"Direito de Família. Entidades familiares. Casamento. União estável. Relações de parentesco. Filiação biológica e socioafetiva. Poder familiar. Regimes de bens. Dissolução. Alimentos. Bem de família. Tutela e curatela. Multiparentalidade e reprodução assistida."},{"id":"trf5:civil:14","n":"14","lvl":0,"t":"Direito das Sucessões. Sucessão legítima e testamentária. Abertura da sucessão. Herança. Administração. Vocação hereditária. Aceitação e renúncia. Exclusão da sucessão. Herança jacente e vacante. Petição de herança. Herdeiros necessários. Legítima. Direito de representação. Testamentos, legados, inventário e partilha."}],"pcivil":[{"id":"trf5:pcivil:1","n":"1","lvl":0,"t":"Normas fundamentais do processo civil. Princípios processuais constitucionais. Fontes. Aplicação das normas processuais no tempo e no espaço. Teoria geral do processo. Cooperação, boa-fé, contraditório substancial, fundamentação e duração razoável."},{"id":"trf5:pcivil:2","n":"2","lvl":0,"t":"Jurisdição e competência. Jurisdição estatal e não estatal. Sistema multiportas. Autotutela, autocomposição, negociação, conciliação, mediação, arbitragem e outros métodos adequados. Limites da jurisdição nacional. Competência interna. Modificação. Conexão, continência e prevenção. Competência da Justiça Federal. Competência delegada. Conflitos de competência. Cooperação nacional e internacional."},{"id":"trf5:pcivil:3","n":"3","lvl":0,"t":"Ação, demanda e processo. Pretensão. Direito de ação. Elementos e condições para o exercício da ação. Interesse processual. Legitimidade ordinária e extraordinária. Substituição processual. Pressupostos processuais. Formação, suspensão e extinção do processo."},{"id":"trf5:pcivil:4","n":"4","lvl":0,"t":"Sujeitos do processo. Partes, procuradores e representação. Capacidade processual e postulatória. Deveres, responsabilidade processual e litigância de má-fé. Despesas, custas, honorários e gratuidade. Litisconsórcio. Intervenção de terceiros. Assistência. Denunciação. Chamamento. Incidente de desconsideração. Amicus curiae. Juiz e auxiliares. Impedimento e suspeição. Ministério Público como parte e como fiscal da ordem jurídica. Advocacia pública. Defensoria Pública."},{"id":"trf5:pcivil:5","n":"5","lvl":0,"t":"Atos processuais. Negócios jurídicos processuais. Forma, tempo e lugar. Prazos. Comunicação dos atos. Citação e intimação. Cartas. Nulidades. Distribuição e registro. Valor da causa. Processo eletrônico. Prática eletrônica de atos processuais. Regulamentação do processo judicial eletrônico e dos atos processuais eletrônicos pelo Conselho Nacional de Justiça e pelos tribunais. Domicílio judicial eletrônico. Comunicações processuais eletrônicas. Diário de Justiça eletrônico. Assinatura e identificação eletrônicas. Interoperabilidade, integração de sistemas, coleta, tratamento e compartilhamento de dados processuais."},{"id":"trf5:pcivil:6","n":"6","lvl":0,"t":"Tutela provisória. Tutelas de urgência e de evidência. Tutela cautelar e antecipada. Requisitos, competência, procedimento, efetivação, modificação, revogação e responsabilidade. Tutela antecedente. Estabilização da tutela antecipada. Poder geral de cautela. Tutelas específicas e medidas coercitivas."},{"id":"trf5:pcivil:7","n":"7","lvl":0,"t":"Procedimento comum. Petição inicial. Pedido e causa de pedir. Cumulação. Emenda. Indeferimento. Improcedência liminar. Audiência de conciliação ou mediação. Contestação e reconvenção. Revelia. Providências preliminares. Julgamento conforme o estado do processo, inclusive julgamento antecipado do mérito e julgamento antecipado parcial. Saneamento e organização do processo. Calendário processual. Audiência de instrução e julgamento. Alegações finais."},{"id":"trf5:pcivil:8","n":"8","lvl":0,"t":"Prova. Teoria geral. Objeto. Admissibilidade e valoração. Standards probatórios. Ônus estático e dinâmico. Prova emprestada. Produção antecipada. Ata notarial. Depoimento pessoal. Confissão. Exibição. Prova documental e eletrônica. Arguição de falsidade. Prova testemunhal. Inspeção judicial. Prova pericial e prova técnica simplificada."},{"id":"trf5:pcivil:9","n":"9","lvl":0,"t":"Pronunciamentos judiciais. Sentença, decisão interlocutória, despacho e acórdão. Fundamentação. Congruência. Fato e direito supervenientes. Remessa necessária. Coisa julgada material e formal. Limites objetivos e subjetivos. Relações continuativas. Coisa julgada inconstitucional. Querela nullitatis. Ação rescisória."},{"id":"trf5:pcivil:10","n":"10","lvl":0,"t":"Procedimentos e processos especiais. Jurisdição contenciosa e jurisdição voluntária. Procedimentos especiais previstos no Código de Processo Civil. Consignação em pagamento. Ação de exigir contas. Ações possessórias. Embargos de terceiro. Oposição. Habilitação. Ação monitória. Restauração de autos. Procedimentos de jurisdição voluntária. Processos especiais com pertinência à Justiça Federal. Mandado de segurança individual e coletivo. Ação popular. Ação civil pública. Ação de improbidade administrativa. Processo discriminatório de terras devolutas da União. Ações de desapropriação por utilidade ou necessidade pública, por interesse social e para fins de reforma agrária. Busca e apreensão decorrente de alienação fiduciária. Processos em matéria de registros públicos de competência da Justiça Federal. Processos relativos à demarcação, proteção e ocupação de terras indígenas e aos direitos territoriais de comunidades tradicionais, nos limites da competência da Justiça Federal. Recuperação judicial, recuperação extrajudicial e falência: questões processuais de interesse da Justiça Federal, competência, participação dos entes públicos, créditos públicos e conflitos de competência."},{"id":"trf5:pcivil:11","n":"11","lvl":0,"t":"Juizados Especiais Federais Cíveis. Princípios. Competência. Procedimento. Tutelas provisórias. Recursos. Turmas Recursais. Turmas Regionais e Turma Nacional de Uniformização. Pedido de uniformização. Coisa julgada. Cumprimento de sentença e execução."},{"id":"trf5:pcivil:12","n":"12","lvl":0,"t":"Processo coletivo e processo estrutural. Direitos difusos, coletivos e individuais homogêneos. Legitimidade. Competência. Inquérito civil e termo de ajustamento de conduta. Prova coletiva e estatística. Poderes do juiz. Decisões estruturais e dialógicas. Coisa julgada coletiva. Liquidação, cumprimento e execução coletivos. Soluções consensuais."},{"id":"trf5:pcivil:13","n":"13","lvl":0,"t":"Cumprimento de sentença e execução. Liquidação. Títulos executivos judiciais e extrajudiciais. Cumprimento provisório e definitivo. Obrigações de pagar, fazer, não fazer e entregar coisa. Responsabilidade patrimonial. Fraude à execução. Penhora, avaliação, expropriação e satisfação. Impugnação ao cumprimento e embargos à execução. Exceção de pré-executividade. Suspensão e extinção. Desjudicialização da execução."},{"id":"trf5:pcivil:14","n":"14","lvl":0,"t":"Cumprimento de sentença e execução contra a Fazenda Pública. Títulos executivos. Requisições de pequeno valor e precatórios. Impugnação. Inexigibilidade. Atualização, juros e ordem cronológica. Obrigações de fazer e não fazer contra os entes públicos. Execução provisória nos limites legais."},{"id":"trf5:pcivil:15","n":"15","lvl":0,"t":"Execuções especiais de interesse da Justiça Federal. Execução fiscal. Certidão de dívida ativa. Garantia do juízo. Penhora, indisponibilidade e expropriação. Embargos e exceção de pré-executividade. Redirecionamento. Prescrição intercorrente. Execuções de baixo valor. Garantias imobiliárias e fiduciárias e sua execução judicial e extrajudicial. Títulos de crédito rural, industrial, comercial, imobiliário e de exportação. Cobrança e satisfação de créditos públicos."},{"id":"trf5:pcivil:16","n":"16","lvl":0,"t":"Processos nos tribunais. Ordem dos processos. Poderes do relator. Julgamento colegiado. Técnica de ampliação do colegiado. Incidente de assunção de competência. Arguição de inconstitucionalidade. Conflito de competência. Homologação de decisão estrangeira e exequatur. Incidente de resolução de demandas repetitivas. Reclamação. Ação rescisória. Sistema de precedentes. Precedentes obrigatórios e persuasivos. Ratio decidendi, distinção e superação. Recursos repetitivos. Repercussão geral. Relevância da questão de direito federal infraconstitucional."},{"id":"trf5:pcivil:17","n":"17","lvl":0,"t":"Meios de impugnação das decisões judiciais. Teoria geral dos recursos. Efeitos, admissibilidade, preparo, desistência e renúncia. Apelação. Agravo de instrumento. Agravo interno. Embargos de declaração. Recurso ordinário. Recurso especial. Relevância da questão de direito federal infraconstitucional: demonstração, hipóteses de presunção, deliberação, participação de terceiros, suspensão de processos, julgamento e efeitos. Recurso extraordinário. Repercussão geral: demonstração, procedimento, presunções, participação de terceiros, sobrestamento, distinção, julgamento e efeitos. Agravos em recursos excepcionais. Embargos de divergência. Recursos repetitivos. Distinção e superação de precedentes."}],"empresarial":[{"id":"trf5:empresarial:1","n":"1","lvl":0,"t":"Direito Empresarial. Origem e evolução. Autonomia, fontes e princípios. Teoria dos atos de comércio e teoria da empresa. Constitucionalização. Livre iniciativa. Função social. Preservação da empresa. Segurança jurídica. Tecnologia e atividade empresarial."},{"id":"trf5:empresarial:2","n":"2","lvl":0,"t":"Empresário e estabelecimento empresarial. Empresário individual, sociedade empresária, empresário rural e pequenos empresários. Registro. Escrituração. Nome empresarial. Estabelecimento. Trespasse e sucessão empresarial. Teoria dos perfis da empresa e empresa como organização contratual."},{"id":"trf5:empresarial:3","n":"3","lvl":0,"t":"Teoria geral do Direito Societário. Sociedades personificadas e não personificadas. Personalidade jurídica e autonomia patrimonial. Desconsideração. Sócios e administradores. Capital social. Responsabilidade. Deliberações. Reorganizações societárias. Dissolução, liquidação e extinção. Grupos societários. Sociedades dependentes de autorização."},{"id":"trf5:empresarial:4","n":"4","lvl":0,"t":"Sociedade limitada. Constituição. Quotas. Capital. Sócios. Administração. Deliberações. Responsabilidade. Exclusão e retirada. Dissolução. Regência supletiva."},{"id":"trf5:empresarial:5","n":"5","lvl":0,"t":"Sociedade anônima. Constituição. Capital e ações. Valores mobiliários. Acionistas. Administração. Conselho fiscal. Assembleias. Poder de controle. Acordos de acionistas. Responsabilidade de administradores e controladores. Companhias abertas e fechadas. Empresas estatais constituídas sob forma societária."},{"id":"trf5:empresarial:6","n":"6","lvl":0,"t":"Títulos de crédito. Princípios. Cartularidade e desmaterialização. Títulos físicos, eletrônicos e escriturais. Letra de câmbio, nota promissória, cheque, duplicata e duplicata escritural. Aceite, endosso, aval, protesto e prescrição. Títulos bancários, comerciais, industriais, rurais, imobiliários e de exportação."},{"id":"trf5:empresarial:7","n":"7","lvl":0,"t":"Contratos empresariais. Compra e venda mercantil. Comissão. Agência e distribuição. Representação comercial. Concessão comercial. Franquia. Alienação fiduciária. Arrendamento mercantil. Factoring. Contratos bancários. Contratos eletrônicos e de plataforma. Redes contratuais e contratos empresariais de longa duração."},{"id":"trf5:empresarial:8","n":"8","lvl":0,"t":"Financiamento empresarial. Crédito bancário. Mercado de capitais. Securitização. Fundos de investimento e fundos de direitos creditórios. Garantias. Financiamento de projetos."},{"id":"trf5:empresarial:9","n":"9","lvl":0,"t":"Sistema Financeiro Nacional e mercados. Conselho Monetário Nacional, Banco Central e Comissão de Valores Mobiliários. Instituições financeiras. Mercado monetário, de crédito, de capitais e de câmbio. Valores mobiliários. Fundos. Sistemas de pagamento. Intervenção e liquidação extrajudicial. Sistemas financeiro da habitação e imobiliário."},{"id":"trf5:empresarial:10","n":"10","lvl":0,"t":"Recuperação judicial, recuperação extrajudicial e falência. Pressupostos, sujeitos, órgãos, créditos, classificação, habilitação e verificação. Plano. Assembleia de credores. Financiamento. Venda de ativos. Convolação. Encerramento. Créditos públicos e tributários. Participação dos entes públicos. Insolvência transnacional. Conflitos de competência."},{"id":"trf5:empresarial:11","n":"11","lvl":0,"t":"Propriedade intelectual e inovação. Propriedade industrial. Patentes. Modelos de utilidade. Desenho industrial. Marcas. Indicações geográficas. Concorrência desleal. Direito autoral e direitos conexos. Programas de computador. Proteção de cultivares. Segredos de negócio. Transferência de tecnologia. Inovação, pesquisa e desenvolvimento. Interface entre propriedade intelectual, concorrência e interesse público."},{"id":"trf5:empresarial:12","n":"12","lvl":0,"t":"Direito empresarial digital. Plataformas. Comércio eletrônico. Ativos digitais. Inteligência artificial na empresa. Dados e segredos empresariais. Blockchain e registros distribuídos. Smart contracts. Identidade e assinatura eletrônicas. Responsabilidade em ecossistemas digitais."}],"tributario":[{"id":"trf5:tributario:1","n":"1","lvl":0,"t":"Direito Financeiro e atividade financeira do Estado. Conceito, fontes e princípios. Receitas, despesas, orçamento e crédito público. Federalismo fiscal. Responsabilidade, sustentabilidade, transparência e equilíbrio fiscal."},{"id":"trf5:tributario:2","n":"2","lvl":0,"t":"Direito Orçamentário. Conceito, natureza e funções. Princípios orçamentários. Plano plurianual, diretrizes orçamentárias e orçamento anual. Orçamentos fiscal, de investimento e da seguridade social. Processo legislativo orçamentário. Emendas. Créditos adicionais. Execução. Contingenciamento. Controle."},{"id":"trf5:tributario:3","n":"3","lvl":0,"t":"Despesa pública. Conceito e classificação. Empenho, liquidação e pagamento. Restos a pagar e despesas de exercícios anteriores. Despesas obrigatórias e discricionárias. Despesas continuadas e extraordinárias. Limites fiscais. Impacto orçamentário das decisões judiciais."},{"id":"trf5:tributario:4","n":"4","lvl":0,"t":"Receita pública. Conceito e classificações. Receitas originárias e derivadas. Arrecadação. Vinculação e desvinculação. Renúncia de receitas e benefícios fiscais. Transferências intergovernamentais. Fundos públicos."},{"id":"trf5:tributario:5","n":"5","lvl":0,"t":"Crédito público, dívida pública e dívida ativa. Dívida interna e externa. Operações de crédito. Limites e garantias. Dívida ativa tributária e não tributária. Inscrição. Certidão de dívida ativa."},{"id":"trf5:tributario:6","n":"6","lvl":0,"t":"Sistema Tributário Nacional. Tributo e espécies tributárias. Competência tributária e capacidade tributária ativa. Repartição de receitas. Normas gerais. Federalismo fiscal."},{"id":"trf5:tributario:7","n":"7","lvl":0,"t":"Competência tributária e limitações constitucionais ao poder de tributar. Legalidade. Anterioridade. Irretroatividade. Igualdade. Capacidade contributiva. Vedação ao confisco. Uniformidade. Liberdade de tráfego. Segurança jurídica e proteção da confiança. Imunidades. Isenção e sua distinção das imunidades."},{"id":"trf5:tributario:8","n":"8","lvl":0,"t":"Fontes e legislação tributária. Constituição. Leis e atos normativos. Tratados e convenções internacionais. Normas complementares. Vigência, aplicação, interpretação e integração. Retroatividade benigna. Conflitos de normas."},{"id":"trf5:tributario:9","n":"9","lvl":0,"t":"Obrigação tributária e regra-matriz de incidência. Obrigação principal e acessória. Fato gerador. Base de cálculo. Alíquota. Sujeitos ativo e passivo. Domicílio. Responsabilidade. Substituição. Solidariedade. Sucessão. Planejamento tributário. Evasão, elisão, elusão e abuso."},{"id":"trf5:tributario:10","n":"10","lvl":0,"t":"Espécies tributárias. Impostos, taxas, contribuições de melhoria, empréstimos compulsórios e contribuições especiais. Tributação do consumo e da renda. Preços públicos."},{"id":"trf5:tributario:11","n":"11","lvl":0,"t":"Tributos federais atualmente vigentes. Imposto de renda das pessoas físicas e jurídicas. Tributação mensal e anual, progressividade, deduções, reduções, isenções, rendimentos sujeitos a tributação exclusiva, ganhos de capital, investimentos, rendimentos e ativos no exterior, lucros e dividendos e retenção na fonte. Tributação mínima das pessoas físicas de altas rendas: incidência, base, rendimentos incluídos e excluídos, alíquota mínima e progressiva, deduções, compensações, relação com o ajuste anual e regras de transição. Imposto sobre produtos industrializados. Imposto sobre operações financeiras. Imposto territorial rural. Impostos sobre importação e exportação. Contribuições sociais sobre receita e lucro. Contribuições de intervenção no domínio econômico. Contribuições de interesse de categorias profissionais ou econômicas. Salário-educação e contribuições destinadas a terceiros. Simples Nacional. Taxas federais e empréstimos compulsórios."},{"id":"trf5:tributario:12","n":"12","lvl":0,"t":"Novo sistema de tributação do consumo. Imposto sobre Bens e Serviços, Contribuição sobre Bens e Serviços e Imposto Seletivo. Princípios. Incidência. Base de cálculo. Não cumulatividade e creditamento. Destino. Split payment. Cashback. Regimes específicos e diferenciados. Administração, fiscalização e arrecadação. Comitê Gestor. Harmonização e contencioso administrativo."},{"id":"trf5:tributario:13","n":"13","lvl":0,"t":"Transição da reforma tributária. Coexistência entre tributos atuais e novos tributos. Implementação gradual. Transição de tributos estaduais, municipais e contribuições federais. Aproveitamento de créditos. Incentivos fiscais. Fundos de compensação e desenvolvimento. Repartição de receitas. Impactos sobre o Simples Nacional."},{"id":"trf5:tributario:14","n":"14","lvl":0,"t":"Crédito tributário. Constituição pelo lançamento. Modalidades. Suspensão, extinção e exclusão. Pagamento. Compensação. Transação. Remissão. Consignação. Conversão de depósito. Dação em pagamento. Prescrição e decadência. Restituição. Garantias e privilégios."},{"id":"trf5:tributario:15","n":"15","lvl":0,"t":"Administração tributária e processo administrativo tributário. Fiscalização e procedimento fiscal. Direitos e garantias do contribuinte. Sigilo fiscal e compartilhamento de informações. Cooperação. Dívida ativa. Certidões e cadastros. Processo administrativo: princípios, prova, decisão, recursos e efeitos. Administração e contencioso do novo sistema de tributação do consumo."},{"id":"trf5:tributario:16","n":"16","lvl":0,"t":"Processo judicial tributário. Execução fiscal. Competência. Certidão de dívida ativa. Garantia, penhora, indisponibilidade e expropriação. Defesas. Embargos. Exceção de pré-executividade. Redirecionamento. Prescrição e prescrição intercorrente. Suspensão e extinção. Execuções de baixo valor e racionalização da cobrança. Localização de devedores e bens. Medidas extrajudiciais de cobrança. Cautelar fiscal. Mandado de segurança em matéria tributária. Ação de repetição de indébito. Ação anulatória de débito fiscal. Ação declaratória. Ação de consignação em pagamento. Tutelas provisórias."},{"id":"trf5:tributario:17","n":"17","lvl":0,"t":"Reforma tributária: disciplina constitucional e infraconstitucional. Tributação sobre bens e serviços. Imposto Seletivo. Princípios, incidência, base, créditos, destino, regimes diferenciados e específicos. Simples Nacional. Governança e administração. Comitê Gestor. Processo administrativo. Distribuição de receitas. Transição e coexistência dos sistemas."}],"administrativo":[{"id":"trf5:administrativo:1","n":"1","lvl":0,"t":"Direito Administrativo. Administração Pública como função do Estado. Fontes, evolução e regime jurídico-administrativo. Princípios constitucionais e legais, explícitos e implícitos. Legalidade e juridicidade. Reforma do Estado. Administração gerencial. Governança pública, integridade, gestão de riscos, planejamento e controle. Terceiro setor e entidades de colaboração."},{"id":"trf5:administrativo:2","n":"2","lvl":0,"t":"Organização administrativa. Administração direta e indireta. Órgãos públicos. Desconcentração e descentralização. Autarquias, fundações, empresas públicas, sociedades de economia mista, subsidiárias, consórcios e entidades paraestatais. Regime das empresas estatais. Governança, pessoal, bens, contratos, responsabilidade e controle."},{"id":"trf5:administrativo:3","n":"3","lvl":0,"t":"Serviços públicos e regulação. Princípios. Delegação. Concessão, permissão e autorização. Tarifas. Equilíbrio econômico-financeiro. Extinção e reversão. Agências reguladoras. Poder normativo. Análise de impacto regulatório. Participação social. Parcerias público-privadas."},{"id":"trf5:administrativo:4","n":"4","lvl":0,"t":"Intervenção do Estado na propriedade. Limitações administrativas. Servidão. Ocupação temporária. Requisição. Tombamento e proteção do patrimônio cultural. Desapropriação por necessidade ou utilidade pública, interesse social e para reforma agrária. Desapropriações constitucionais. Fases, indenização, imissão na posse, juros, correção, honorários, desapropriação indireta e retrocessão."},{"id":"trf5:administrativo:5","n":"5","lvl":0,"t":"Responsabilidade civil do Estado. Evolução e teorias. Responsabilidade objetiva. Ação e omissão. Nexo causal. Excludentes e atenuantes. Responsabilidade por atos legislativos, jurisdicionais, administrativos e de prestadores de serviços públicos. Reparação e direito de regresso."},{"id":"trf5:administrativo:6","n":"6","lvl":0,"t":"Agentes públicos. Agentes políticos, servidores estatutários, empregados públicos, temporários e particulares em colaboração. Cargos, empregos e funções. Ingresso. Concurso. Direitos, deveres e responsabilidades. Remuneração. Acumulação. Estabilidade. Regimes previdenciários. Processo administrativo disciplinar."},{"id":"trf5:administrativo:7","n":"7","lvl":0,"t":"Ato, processo e controle administrativos. Ato administrativo: conceito, elementos, atributos, espécies, validade, eficácia, vícios, extinção, anulação, revogação, convalidação e conservação. Discricionariedade. Processo administrativo. Decisão coordenada. Motivação. Participação. Controle interno, externo, administrativo, legislativo e jurisdicional. Tribunais de Contas. Limites do controle judicial."},{"id":"trf5:administrativo:8","n":"8","lvl":0,"t":"Improbidade administrativa. Fundamentos. Atos de improbidade. Dolo, tipicidade e sujeitos. Sanções. Prescrição. Indisponibilidade de bens. Acordo de não persecução civil. Ação de improbidade administrativa: legitimidade, competência, procedimento, prova, sentença, coisa julgada e execução. Relações com as instâncias civil, penal, eleitoral e administrativa."},{"id":"trf5:administrativo:9","n":"9","lvl":0,"t":"Direito Administrativo Sancionador. Princípios e garantias. Legalidade, tipicidade, culpabilidade, pessoalidade, proporcionalidade, contraditório, ampla defesa e non bis in idem. Infrações e sanções. Responsabilidade subjetiva e objetiva nos casos admitidos. Autoria e participação. Dosimetria. Prescrição e prescrição intercorrente. Processo sancionador. Medidas cautelares. Prova e motivação. Acordos e consensualidade. Relação entre instâncias. Responsabilidade de pessoas jurídicas por atos contra a Administração. Programas de integridade. Processo de responsabilização. Acordos de leniência. Reparação do dano e cooperação."},{"id":"trf5:administrativo:10","n":"10","lvl":0,"t":"Licitações e contratos administrativos. Fundamentos constitucionais. Princípios. Planejamento das contratações públicas. Governança das contratações. Fase preparatória. Estudos técnicos preliminares. Termo de referência e projetos. Orçamento estimado. Agentes da contratação e segregação de funções. Modalidades de licitação. Pregão. Concorrência. Concurso. Leilão. Diálogo competitivo. Critérios de julgamento. Modos de disputa. Habilitação. Julgamento. Recursos. Homologação. Revogação e anulação da licitação. Contratação direta. Dispensa e inexigibilidade. Procedimentos auxiliares. Credenciamento. Pré-qualificação. Procedimento de manifestação de interesse. Sistema de registro de preços. Registro cadastral. Contratações eletrônicas. Contratos administrativos. Conceito, características, formalização e espécies. Cláusulas exorbitantes. Garantias. Duração e prorrogação. Execução e fiscalização. Alterações contratuais. Equilíbrio econômico-financeiro. Reajuste, repactuação e revisão. Subcontratação. Inexecução. Extinção. Invalidade e nulidade. Infrações e sanções administrativas. Processo sancionador nas contratações públicas. Meios alternativos de prevenção e solução de controvérsias. Contratações públicas sustentáveis, inovadoras e digitais."},{"id":"trf5:administrativo:11","n":"11","lvl":0,"t":"Poderes administrativos. Poder regulamentar e normativo. Poder hierárquico. Poder disciplinar. Poder de polícia. Ciclo de polícia. Delegação. Limites. Abuso de poder. Excesso e desvio de finalidade."},{"id":"trf5:administrativo:12","n":"12","lvl":0,"t":"Bens públicos e domínio público. Bens federais. Terras devolutas. Terrenos de marinha e acrescidos. Ilhas, praias e faixa de fronteira. Recursos minerais e potenciais hidráulicos. Águas. Terras indígenas. Patrimônio imobiliário da União. Regularização fundiária e destinação de bens públicos."},{"id":"trf5:administrativo:13","n":"13","lvl":0,"t":"Direito administrativo fundiário, agrário e habitacional. Política agrária e reforma agrária. Função social da propriedade rural. Terras públicas federais. Arrecadação, discriminação, regularização e destinação. Assentamentos. Desapropriação agrária. Cadastro rural. Ocupação. Regularização fundiária urbana e rural em áreas federais. Política habitacional. Sistemas financeiro da habitação e imobiliário sob perspectiva administrativa. Programas habitacionais. Demarcação e processos administrativos territoriais."},{"id":"trf5:administrativo:14","n":"14","lvl":0,"t":"Direito administrativo da saúde. Sistema Único de Saúde. Princípios, organização, competências e financiamento. Participação privada. Vigilância sanitária e epidemiológica. Incorporação de tecnologias. Medicamentos e tratamentos. Judicialização da saúde. Competência federativa. Medicina baseada em evidências. Prova técnica. Emergências sanitárias. Impactos orçamentários e sustentabilidade."}],"ambiental":[{"id":"trf5:ambiental:1","n":"1","lvl":0,"t":"Direito Ambiental. Conceito, objeto, fontes e princípios. Prevenção, precaução, poluidor-pagador, usuário-pagador, protetor-recebedor, participação, informação, equidade intergeracional, vedação ao retrocesso e reparação integral. Função socioambiental da propriedade. Meio ambiente como direito humano."},{"id":"trf5:ambiental:2","n":"2","lvl":0,"t":"Constituição e meio ambiente. Competências legislativas e administrativas. Federalismo cooperativo. Bens ambientais. Competência da Justiça Federal. Patrimônio cultural, arqueológico e natural."},{"id":"trf5:ambiental:3","n":"3","lvl":0,"t":"Política e administração ambiental. Sistema nacional de meio ambiente. Instrumentos de política ambiental. Planejamento. Zoneamento. Padrões ambientais. Cadastros, informação e monitoramento. Instrumentos econômicos. Poder de polícia e fiscalização."},{"id":"trf5:ambiental:4","n":"4","lvl":0,"t":"Licenciamento ambiental e avaliação de impactos. Competência. Procedimento. Modalidades. Estudos ambientais. Estudo e relatório de impacto ambiental. Participação pública. Condicionantes. Renovação, suspensão e cancelamento. Empreendimentos de significativo impacto. Grandes obras e infraestrutura. Controle judicial."},{"id":"trf5:ambiental:5","n":"5","lvl":0,"t":"Responsabilidade ambiental. Dano ambiental individual e coletivo. Responsabilidade civil objetiva. Nexo causal. Solidariedade. Obrigações propter rem. Reparação, restauração e compensação. Responsabilidade do Estado. Responsabilidade administrativa e penal. Responsabilidade penal da pessoa jurídica. Relações entre instâncias."},{"id":"trf5:ambiental:6","n":"6","lvl":0,"t":"Vegetação e flora. Áreas de preservação permanente. Reserva legal. Cadastro e regularização ambiental. Supressão e manejo. Recuperação. Incêndios e queimadas."},{"id":"trf5:ambiental:7","n":"7","lvl":0,"t":"Áreas protegidas e unidades de conservação. Categorias. Criação, alteração e extinção. Plano de manejo. Zonas de amortecimento. Mosaicos e corredores ecológicos. Reservas da biosfera. Compensação ambiental. Zona costeira. Áreas marinhas e oceânicas."},{"id":"trf5:ambiental:8","n":"8","lvl":0,"t":"Biodiversidade, patrimônio genético e conhecimentos tradicionais associados. Acesso e repartição de benefícios. Biotecnologia. Biossegurança. Organismos geneticamente modificados. Proteção internacional da biodiversidade."},{"id":"trf5:ambiental:9","n":"9","lvl":0,"t":"Recursos hídricos e saneamento. Domínio das águas. Gestão por bacias. Outorga. Cobrança. Enquadramento. Águas superficiais e subterrâneas. Saneamento básico e universalização."},{"id":"trf5:ambiental:10","n":"10","lvl":0,"t":"Mineração, recursos minerais e segurança de barragens. Licenciamento. Recuperação de áreas degradadas. Responsabilidade por desastres. Rejeitos e estruturas de contenção."},{"id":"trf5:ambiental:11","n":"11","lvl":0,"t":"Resíduos sólidos, substâncias e produtos perigosos. Logística reversa. Responsabilidade compartilhada. Transporte e destinação. Agrotóxicos e outros produtos sujeitos a controle ambiental."},{"id":"trf5:ambiental:12","n":"12","lvl":0,"t":"Mudanças climáticas. Mitigação, adaptação e perdas e danos. Desenvolvimento sustentável. Transição ecológica e energética. Mercados de carbono. Justiça climática. Objetivos de Desenvolvimento Sustentável."},{"id":"trf5:ambiental:13","n":"13","lvl":0,"t":"Energia, infraestrutura e meio ambiente. Matriz energética. Empreendimentos de infraestrutura. Avaliação ambiental estratégica. Grandes obras. Competência federal."},{"id":"trf5:ambiental:14","n":"14","lvl":0,"t":"Povos indígenas, comunidades quilombolas e tradicionais. Direitos territoriais e ambientais. Consulta e participação. Conhecimentos tradicionais. Proteção dos modos de vida."},{"id":"trf5:ambiental:15","n":"15","lvl":0,"t":"Tutela judicial e coletiva do meio ambiente. Ação civil pública. Ação popular. Mandado de segurança coletivo. Tutelas provisórias. Tutela específica e inibitória. Execução coletiva. Inquérito civil. Termo de ajustamento de conduta. Soluções consensuais e processos estruturais. Ministério Público, Defensoria Pública, associações e entes públicos."},{"id":"trf5:ambiental:16","n":"16","lvl":0,"t":"Direito Ambiental Internacional. Princípios, tratados e convenções. Biodiversidade. Clima. Resíduos e substâncias perigosas. Proteção marinha. Cooperação e responsabilidade internacional."},{"id":"trf5:ambiental:17","n":"17","lvl":0,"t":"Meio ambiente e saúde. Riscos ambientais. Saneamento, poluição e saúde coletiva. Emergências ambientais e sanitárias."},{"id":"trf5:ambiental:18","n":"18","lvl":0,"t":"Meio ambiente, economia e produção. Agronegócio. Produção sustentável. Bioeconomia. Serviços ecossistêmicos. Instrumentos econômicos. Refle
